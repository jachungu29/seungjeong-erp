<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 ERP · 설계 그래프 (구조도 연동)</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel3:#21262d;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px}header .sub{color:var(--dim);font-size:11.5px}
header .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel3);color:var(--txt);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--blue)}.btn.on{border-color:var(--blue);color:var(--blue)}
.stat{font-size:11px;color:var(--dim);font-family:var(--mono)}
.stage{position:relative;height:calc(100vh - 46px);overflow:hidden;background:radial-gradient(circle at 50% 40%,#12161d,#0d1117)}
svg{width:100%;height:100%;display:block;cursor:grab}svg.pan{cursor:grabbing}
.edge{stroke-opacity:.5;stroke-linecap:round}
.node circle{stroke:#0d1117;stroke-width:1.4;cursor:pointer}
.node.sel circle{stroke:#fff;stroke-width:2.4}
.node text{fill:var(--txt);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#0d1117;stroke-width:3px;stroke-linejoin:round}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--faint);background:rgba(13,17,23,.7);padding:5px 10px;border-radius:7px;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:14px}
.empty a{color:var(--blue)}
.legend{position:absolute;right:12px;top:12px;max-width:210px;background:rgba(22,27,34,.85);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;max-height:70vh;overflow:auto}
.legend .lg{display:flex;align-items:center;gap:6px;margin:2px 0}.legend .lg i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
</style></head><body>
<header>
 <h1>승정 ERP · 설계 그래프</h1><span class="sub">구조도(map) 단일 소스 · 실시간 연동</span>
 <span class="sp">
  <span class="stat" id="stat">…</span>
  <button class="btn on" id="scrBtn" onclick="toggleScr()">화면까지 표시</button>
  <button class="btn" onclick="relayout()">↻ 재배치</button>
  <button class="btn" onclick="fit()">⊡ 맞춤</button>
  <a class="btn" href="rev0-map.html">🗺️ 구조도 편집</a>
  <a class="btn" href="index2.html">← 메인</a>
 </span>
</header>
<div class="stage" id="stage">
 <svg id="svg"><g id="view"><g id="edges"></g><g id="nodes"></g></g></svg>
 <div class="legend" id="legend"></div>
 <div class="hint">드래그=이동 · 빈곳 드래그=화면이동 · 휠=확대/축소</div>
 <div class="empty" id="empty" style="display:none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script>
var svg=document.getElementById('svg'),view=document.getElementById('view');
var eEl=document.getElementById('edges'),nEl=document.getElementById('nodes');
var LV=[{r:17,f:14},{r:13,f:13},{r:9.5,f:11.5},{r:6.5,f:10.5}]; // 허브/대/중/화면
var STCOL={live:'#3fb950',todo:'#8b949e',bom:'#58a6ff'};
var G={nodes:[],edges:[],map:{}}, px=0,py=0,z=1, alpha=0,running=false, showScr=true, STRUCT=null;
var mode=null,drag=null,doff=null,pan=null,start=null,moved=false;

function shade(hex,p){
  try{var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
   r=Math.round(r+(255-r)*p);g=Math.round(g+(255-g)*p);b=Math.round(b+(255-b)*p);
   return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}catch(e){return hex;}
}
function build(){
  var W=svg.clientWidth||900,H=svg.clientHeight||600,cx=W/2,cy=H/2;
  G={nodes:[],edges:[],map:{}};
  add({id:'__hub',name:'승정 ERP',depth:0,col:'#c9b3ff',x:cx,y:cy,hub:true});
  if(!STRUCT||!STRUCT.length){ document.getElementById('empty').style.display='flex';
    document.getElementById('empty').innerHTML='구조도 데이터가 없습니다.<br><a href="rev0-map.html">구조도(map)</a>에서 편집·저장하면 여기에 자동 반영됩니다.'; drawBuild(); return; }
  document.getElementById('empty').style.display='none';
  STRUCT.forEach(function(c,ci){
    var col=c.color||'#5a6b78', cid='c'+ci;
    add({id:cid,name:(c.num?c.num+' ':'')+c.label,depth:1,col:col,x:cx+Math.cos(ci/STRUCT.length*6.28)*230,y:cy+Math.sin(ci/STRUCT.length*6.28)*230});
    edge('__hub',cid,1);
    (c.mids||[]).forEach(function(m,mi){
      var mid=cid+'m'+mi;
      add({id:mid,name:m.hdr,depth:2,col:shade(col,.28),x:0,y:0});
      edge(cid,mid,2);
      if(showScr)(m.items||[]).forEach(function(it,ii){
        var sid=mid+'s'+ii;
        add({id:sid,name:it.name,depth:3,col:shade(col,.5),st:it.st,x:0,y:0});
        edge(mid,sid,3);
      });
    });
  });
  G.nodes.forEach(function(n){ if(n.x===0&&n.y===0){ var p=G.map[parentOf(n.id)]; var a=Math.random()*6.28; n.x=(p?p.x:cx)+Math.cos(a)*70; n.y=(p?p.y:cy)+Math.sin(a)*70; } });
  drawBuild(); reheat(1); legend(); stat();
}
function parentOf(id){ var e=G.edges.filter(function(x){return x.t===id;})[0]; return e?e.s:'__hub'; }
function add(o){o.vx=0;o.vy=0;o.r=LV[o.depth].r;o.f=LV[o.depth].f;G.nodes.push(o);G.map[o.id]=o;}
function edge(s,t,d){G.edges.push({s:s,t:t,d:d});}
function drawBuild(){
  eEl.textContent='';nEl.textContent='';
  G.edges.forEach(function(e){var b=G.map[e.t];var l=svgEl('line');l.setAttribute('class','edge');l.setAttribute('stroke',(b?b.col:'#30363d'));l.setAttribute('stroke-width',e.d===1?2.2:e.d===2?1.4:1);e.el=l;eEl.appendChild(l);});
  G.nodes.forEach(function(n){var g=svgEl('g');g.setAttribute('class','node');g.setAttribute('data-id',n.id);
    var c=svgEl('circle');c.setAttribute('r',n.r);c.setAttribute('fill',n.col);
    if(n.st){c.setAttribute('stroke',STCOL[n.st]||'#0d1117');c.setAttribute('stroke-width',2);}
    g.appendChild(c);
    var t=svgEl('text');t.setAttribute('y',n.r+n.f);t.setAttribute('font-size',n.f);t.textContent=n.name;g.appendChild(t);
    n.el=g;nEl.appendChild(g);});
}
function svgEl(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
function applyView(){view.setAttribute('transform','translate('+px+','+py+') scale('+z+')');}
function tick(){
  var ns=G.nodes,m=ns.length,W=svg.clientWidth,H=svg.clientHeight,cx=W/2,cy=H/2,i,j,cap=300*300;
  for(i=0;i<m;i++){ns[i].fx=0;ns[i].fy=0;}
  for(i=0;i<m;i++)for(j=i+1;j<m;j++){var a=ns[i],b=ns[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>cap)continue;if(d2<1)d2=1;var d=Math.sqrt(d2),f=900/d2,ux=dx/d,uy=dy/d;a.fx-=ux*f;a.fy-=uy*f;b.fx+=ux*f;b.fy+=uy*f;}
  G.edges.forEach(function(e){var a=G.map[e.s],b=G.map[e.t];if(!a||!b)return;var len=e.d===1?150:e.d===2?80:52,dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-len)*.09,ux=dx/d,uy=dy/d;a.fx+=ux*f;a.fy+=uy*f;b.fx-=ux*f;b.fy-=uy*f;});
  for(i=0;i<m;i++){var n=ns[i];n.fx+=(cx-n.x)*.012;n.fy+=(cy-n.y)*.012;if(n.hub){n.x=cx;n.y=cy;continue;}if(n.pin)continue;n.vx=(n.vx+n.fx)*.85;n.vy=(n.vy+n.fy)*.85;n.x+=n.vx*alpha;n.y+=n.vy*alpha;}
}
function draw(){
  G.edges.forEach(function(e){var a=G.map[e.s],b=G.map[e.t];if(!a||!b||!e.el)return;e.el.setAttribute('x1',a.x);e.el.setAttribute('y1',a.y);e.el.setAttribute('x2',b.x);e.el.setAttribute('y2',b.y);});
  G.nodes.forEach(function(n){if(n.el)n.el.setAttribute('transform','translate('+n.x+','+n.y+')');});
}
function reheat(a){alpha=Math.max(alpha,a||.5);if(!running){running=true;requestAnimationFrame(loop);}}
function loop(){tick();draw();alpha*=.985;if(alpha>.03)requestAnimationFrame(loop);else{running=false;draw();}}
function legend(){var h='<div style="font-weight:700;margin-bottom:5px">대분류</div>';(STRUCT||[]).forEach(function(c){h+='<div class="lg"><i style="background:'+(c.color||'#5a6b78')+'"></i>'+(c.num?c.num+' ':'')+esc(c.label)+'</div>';});h+='<div style="font-weight:700;margin:7px 0 4px">상태(테두리)</div><div class="lg"><i style="background:'+STCOL.live+'"></i>작동</div><div class="lg"><i style="background:'+STCOL.todo+'"></i>준비중</div><div class="lg"><i style="background:'+STCOL.bom+'"></i>BOM</div>';document.getElementById('legend').innerHTML=h;}
function stat(){var c=0,mm=0,s=0;(STRUCT||[]).forEach(function(x){c++;(x.mids||[]).forEach(function(y){mm++;s+=(y.items||[]).length;});});document.getElementById('stat').textContent=c+'대 · '+mm+'중 · '+s+'화면';}
function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggleScr(){showScr=!showScr;document.getElementById('scrBtn').classList.toggle('on',showScr);build();}
function relayout(){var W=svg.clientWidth,H=svg.clientHeight;G.nodes.forEach(function(n){if(n.hub)return;var a=Math.random()*6.28,r=60+Math.random()*260;n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r;n.vx=0;n.vy=0;});reheat(1);}
function fit(){if(!G.nodes.length)return;var xs=G.nodes.map(function(n){return n.x;}),ys=G.nodes.map(function(n){return n.y;});var mnx=Math.min.apply(0,xs),mxx=Math.max.apply(0,xs),mny=Math.min.apply(0,ys),mxy=Math.max.apply(0,ys);var w=(mxx-mnx)||1,h=(mxy-mny)||1,W=svg.clientWidth,H=svg.clientHeight,pad=80;z=Math.max(.2,Math.min((W-pad)/w,(H-pad)/h,1.6));px=W/2-(mnx+mxx)/2*z;py=H/2-(mny+mxy)/2*z;applyView();}

function ndFrom(t){while(t&&t!==svg){if(t.getAttribute&&t.getAttribute('data-id'))return t;t=t.parentNode;}return null;}
function wpt(x,y){var r=svg.getBoundingClientRect();return{x:(x-r.left-px)/z,y:(y-r.top-py)/z};}
svg.addEventListener('mousedown',function(e){var g=ndFrom(e.target);start={x:e.clientX,y:e.clientY};moved=false;if(g){mode='n';drag=G.map[g.getAttribute('data-id')];var w=wpt(e.clientX,e.clientY);doff={x:drag.x-w.x,y:drag.y-w.y};drag.pin=true;}else{mode='p';svg.classList.add('pan');pan={px:px,py:py,x:e.clientX,y:e.clientY};}});
window.addEventListener('mousemove',function(e){if(!mode)return;if(Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y)>4)moved=true;if(mode==='n'&&drag){var w=wpt(e.clientX,e.clientY);drag.x=w.x+doff.x;drag.y=w.y+doff.y;drag.vx=0;drag.vy=0;reheat(.12);}else if(mode==='p'){px=pan.px+(e.clientX-pan.x);py=pan.py+(e.clientY-pan.y);applyView();}});
window.addEventListener('mouseup',function(){if(mode==='n'&&drag)drag.pin=false;else if(mode==='p')svg.classList.remove('pan');mode=null;drag=null;});
svg.addEventListener('wheel',function(e){e.preventDefault();var r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,wx=(mx-px)/z,wy=(my-py)/z,nz=z*(e.deltaY<0?1.12:.89);nz=Math.max(.2,Math.min(3,nz));px=mx-wx*nz;py=my-wy*nz;z=nz;applyView();},{passive:false});
window.addEventListener('resize',function(){reheat(.3);});

/* 데이터: 구조도(map_struct) 단일 소스 — 로컬 즉시 → 클라우드 반영/실시간 */
function apply(v){ if(v&&v.length){ STRUCT=v; build(); } }
(function(){
  try{ STRUCT=JSON.parse(localStorage.getItem('SJ_MAP_STRUCT')); }catch(e){}
  build();
  if(window.Cloud){
    Cloud.get('map_struct').then(function(v){ if(v&&v.length) apply(v); });
    Cloud.on('map_struct', apply);
  }
})();
</script>
</body></html>
