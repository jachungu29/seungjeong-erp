<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--kr)}
#g{width:100vw;height:100vh;display:block;background:radial-gradient(circle at 50% 40%,#181a24 0%,#0f1016 100%)}
.bar{position:fixed;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
.title{font-weight:800;font-size:16px;margin-right:8px}
.title span{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:8px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{position:fixed;bottom:12px;left:14px;font-size:11.5px;color:var(--dim);font-family:var(--mono);z-index:5}
.search{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;width:150px}
line.lnk{stroke:#343846;stroke-opacity:.5}
line.lnk.cross{stroke:#6f66c9;stroke-opacity:.5}
circle.nd{cursor:pointer;stroke:#0d0e13;stroke-width:1.2px}
text.lbl{fill:#c8cfdd;font-size:10px;font-family:var(--kr);pointer-events:none;paint-order:stroke;stroke:#0f1016;stroke-width:3px;stroke-linejoin:round}
.leg{position:fixed;top:14px;right:14px;background:rgba(26,28,38,.85);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--dim);z-index:5;max-height:82vh;overflow:auto}
.leg b{color:var(--txt);font-size:11.5px;display:block;margin-bottom:5px}
.leg .it{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.leg .dot{width:9px;height:9px;border-radius:50%}
</style></head><body>

 node.attr("opacity",function(n){return keep.has(n.id)?1:0.12;});
 link.attr("stroke-opacity",function(l){return ((l.source.id===d.id)||(l.target.id===d.id))?0.9:0.05;});
 lab.style("display",function(n){return keep.has(n.id)?"block":"none";});
}
function hoverOff(){
 node.attr("opacity",1);link.attr("stroke-opacity",null);
 lab.style("display",function(n){return n.lvl===0?"block":"none";});
}
function dstart(e,d){if(!e.active&&physOn)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;}
function ddrag(e,d){d.fx=e.x;d.fy=e.y;if(!physOn)tick();}
function dend(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}
function setDepth(v){maxLvl=v;["d0","d1","d2","d9"].forEach(function(id){document.getElementById(id).classList.remove("on");});document.getElementById(v===0?"d0":v===1?"d1":v===2?"d2":"d9").classList.add("on");build();}
function togglePhys(){physOn=!physOn;document.getElementById("phys").textContent=physOn?"물리 ⏸":"물리 ▶";if(physOn){sim.alpha(0.5).restart();}else{sim.stop();}}
function resetView(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);}
function doSearch(q){q=(q||"").trim().toLowerCase();if(!q){node.attr("stroke","#0d0e13").attr("stroke-width",1.2);return;}
 node.attr("stroke",function(d){return d.label.toLowerCase().indexOf(q)>=0?"#ffd33d":"#0d0e13";}).attr("stroke-width",function(d){return d.label.toLowerCase().indexOf(q)>=0?3:1.2;});}
// 범례 (대분류)
var leg=document.getElementById("leg");var lh="<b>대분류 22</b>";
DATA.nodes.filter(function(n){return n.lvl===0;}).forEach(function(n){lh+='<div class="it" onclick="focusNode(\''+n.id+'\')"><span class="dot" style="background:'+n.color+'"></span>'+n.label+'</div>';});
leg.innerHTML=lh;
function focusNode(id){var n=DATA.nodes.find(function(x){return x.id===id;});if(!n)return;var t=d3.zoomIdentity.translate(W/2-n.x*1.6,H/2-n.y*1.6).scale(1.6);svg.transition().duration(600).call(zoom.transform,t);}
build();
window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;svg.attr("viewBox",[0,0,W,H]);sim.force("center",d3.forceCenter(W/2,H/2));sim.alpha(0.3).restart();});
</script></body></html>
