<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --primary:#0A2463;--accent:#E84855;--gold:#C9AE4A;
    --surface:#F7F6F2;--card:#FFFFFF;--border:#DDD9CE;
    --text:#1A1A1A;--muted:#6B6860;
    --dept-q:#EBF5FF;--dept-qc:#0A2463;
    --dept-p:#FFF3E0;--dept-pc:#A0520A;
    --dept-d:#F3E5F5;--dept-dc:#5A1A7A;
    --dept-b:#E8F5E9;--dept-bc:#1B6B2A;
    --dept-m:#FFF8E1;--dept-mc:#7A5800;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);line-height:1.6;}

  /* HEADER */
  header{background:var(--primary);color:white;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(10,36,99,.3);}
  .header-inner{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .header-title{display:flex;align-items:center;gap:12px;}
  .header-badge{background:var(--accent);color:white;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:3px 9px;border-radius:3px;letter-spacing:.5px;white-space:nowrap;}
  .header-title h1{font-size:16px;font-weight:700;letter-spacing:-.3px;}
  .header-title p{font-size:11px;opacity:.7;margin-top:1px;}
  .search-wrap{display:flex;align-items:center;gap:8px;}
  #search-input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:white;font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:6px 13px;width:240px;outline:none;transition:background .2s;}
  #search-input::placeholder{color:rgba(255,255,255,.5);}
  #search-input:focus{background:rgba(255,255,255,.2);}
  #search-count{font-size:12px;opacity:.6;white-space:nowrap;min-width:60px;}

  /* NAV */
  nav{background:var(--primary);border-top:1px solid rgba(255,255,255,.1);}
  .nav-inner{max-width:1280px;margin:0 auto;padding:0 28px;display:flex;overflow-x:auto;scrollbar-width:none;}
  .nav-inner::-webkit-scrollbar{display:none;}
  .nav-tab{color:rgba(255,255,255,.6);font-size:12.5px;padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;user-select:none;}
  .nav-tab:hover{color:rgba(255,255,255,.9);}
  .nav-tab.active{color:white;border-bottom-color:var(--gold);font-weight:500;}

  /* MAIN */
  .main{max-width:1280px;margin:0 auto;padding:28px;}

  /* STATS BANNER */
  .stats{background:white;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:6px;padding:16px 24px;margin-bottom:28px;display:flex;align-items:center;gap:0;}
  .stat{text-align:center;flex:1;}
  .stat .num{font-size:26px;font-weight:700;color:var(--primary);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:3px;}
  .stat+.stat{border-left:1px solid var(--border);}

  /* CLAUSE GROUP */
  .clause-group{margin-bottom:10px;}
  .clause-header{background:white;border:1px solid var(--border);border-radius:6px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:box-shadow .15s;user-select:none;}
  .clause-header:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .clause-header.expanded{border-radius:6px 6px 0 0;border-bottom:1px solid var(--border);}
  .clause-num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--accent);min-width:42px;}
  .clause-title{font-size:14px;font-weight:500;flex:1;}
  .clause-meta{display:flex;gap:6px;align-items:center;}
  .doc-count-badge{font-size:10px;background:#FFF3E0;color:#BF6000;border:1px solid #F9C36D;padding:2px 7px;border-radius:3px;font-weight:500;white-space:nowrap;}
  .arrow{font-size:11px;color:var(--muted);transition:transform .2s;}
  .arrow.open{transform:rotate(90deg);}

  /* CLAUSE BODY */
  .clause-body{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;display:none;}
  .clause-body.open{display:block;}

  /* SUB-CLAUSE */
  .sub-clause{border-bottom:1px solid #F0EEE8;padding:14px 18px 14px 60px;}
  .sub-clause:last-child{border-bottom:none;}
  .sub-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);font-weight:500;margin-bottom:3px;}
  .sub-title{font-size:13.5px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sub-desc{font-size:12.5px;color:#3A3830;line-height:1.65;}
  .sub-desc ul{margin:5px 0 0 16px;}
  .sub-desc ul li{margin-bottom:2px;font-size:12.5px;}
  .badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;}
  .badge-iatf{background:#FFF3E0;color:#BF6000;border:1px solid #F9C36D;}
  .badge-9001{background:#EBF0F8;color:#0A2463;border:1px solid #BDD0EE;}
  .iatf-note{display:inline-block;background:#FFF8E1;border-left:3px solid var(--gold);color:#7A5800;font-size:11.5px;padding:5px 9px;margin-top:7px;border-radius:0 4px 4px 0;line-height:1.5;}

  /* DOCUMENT PANEL TOGGLE */
  .doc-toggle{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 10px;background:#F0F4FF;border:1px solid #BDD0EE;border-radius:4px;font-size:11.5px;font-weight:500;color:var(--primary);cursor:pointer;user-select:none;transition:background .15s;}
  .doc-toggle:hover{background:#E0EAFF;}
  .doc-toggle.has-docs{background:#EBF5FF;}
  .doc-toggle .dt-arrow{font-size:10px;transition:transform .2s;}
  .doc-toggle.open .dt-arrow{transform:rotate(90deg);}

  /* DOCUMENT PANEL */
  .doc-panel{display:none;margin-top:10px;border:1px solid var(--border);border-radius:5px;overflow:hidden;}
  .doc-panel.open{display:block;}
  .doc-proc-group{border-bottom:1px solid #F0EEE8;}
  .doc-proc-group:last-child{border-bottom:none;}
  .doc-proc-header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#FAFAF8;border-bottom:1px solid #F0EEE8;}
  .doc-proc-code{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;color:var(--primary);min-width:100px;}
  .doc-proc-name{font-size:12.5px;font-weight:500;flex:1;}
  .dept-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;}
  .dept-품질팀{background:var(--dept-q);color:var(--dept-qc);}
  .dept-생산팀{background:var(--dept-p);color:var(--dept-pc);}
  .dept-개발팀{background:var(--dept-d);color:var(--dept-dc);}
  .dept-구매팀{background:var(--dept-b);color:var(--dept-bc);}
  .dept-관리팀{background:var(--dept-m);color:var(--dept-mc);}
  .dept-기타{background:#F5F5F5;color:#555;}
  .doc-list{padding:6px 0;}
  .doc-row{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 28px;font-size:12px;}
  .doc-row:hover{background:#F7F9FF;}
  .doc-row-code{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#888;min-width:130px;}
  .doc-row-name{flex:1;color:#2A2A2A;}
  .doc-row.customer .doc-row-code{color:#9B4A00;}
  .doc-row.customer .doc-row-name::before{content:"고객양식 ";color:#9B4A00;font-size:10px;}
  .doc-row.ref-doc .doc-row-name{color:var(--muted);}
  .doc-row.ref-doc .doc-row-code{color:#BBB;}

  /* SEARCH HIGHLIGHT */
  mark{background:#FFE57A;color:inherit;border-radius:2px;padding:0 1px;}
  .no-results{text-align:center;padding:50px 20px;color:var(--muted);display:none;}
  .no-results.show{display:block;}

  footer{max-width:1280px;margin:36px auto 0;padding:18px 28px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}

  @media(max-width:768px){
    .main{padding:12px;}
    .header-inner{padding:10px 14px;}
    .nav-inner{padding:0 14px;}
    #search-input{width:160px;}
    .stats{flex-wrap:wrap;}
    .stat{min-width:50%;}
    .sub-clause{padding-left:16px;}
    footer{padding:14px;flex-direction:column;gap:5px;text-align:center;}
  }
</style>
</head>

/* ===== RENDER ===== */
function countDocs(subNum) {
  const keys = subDocMap[subNum] || [];
  return keys.reduce((acc, k) => {
    const g = docGroups[k];
    if (!g) return acc;
    return acc + g.docs.filter(d => !d.ref).length;
  }, 0);
}

function countClauseDocs(clauseNum) {
  const clause = data.find(c => c.num === clauseNum);
  if (!clause) return 0;
  const allKeys = new Set();
  clause.subs.forEach(s => { (subDocMap[s.num] || []).forEach(k => allKeys.add(k)); });
  let total = 0;
  allKeys.forEach(k => {
    const g = docGroups[k];
    if (g) total += g.docs.filter(d => !d.ref).length;
  });
  return total;
}

function renderDocPanel(subNum) {
  const keys = subDocMap[subNum] || [];
  if (!keys.length) return "";
  const groups = keys.map(k => docGroups[k]).filter(Boolean);
  if (!groups.length) return "";
  const ownDocs = groups.reduce((a, g) => a + g.docs.filter(d => !d.ref).length, 0);
  const html = groups.map(g => {
    const deptClass = "dept-" + (g.dept || "기타").replace(/팀$/,"팀");
    const rows = g.docs.map(d => {
      let cls = "doc-row";
      if (d.customer) cls += " customer";
      else if (d.ref) cls += " ref-doc";
      return `<div class="${cls}"><span class="doc-row-code">${d.code}</span><span class="doc-row-name">${d.name}</span></div>`;
    }).join("");
    return `<div class="doc-proc-group">
      <div class="doc-proc-header">
        <span class="doc-proc-code">${g.code}</span>
        <span class="doc-proc-name">${g.name}</span>
        <span class="dept-badge dept-${g.dept}">${g.dept}</span>
      </div>
      <div class="doc-list">${rows}</div>
    </div>`;
  }).join("");
  return `<div>
    <div class="doc-toggle has-docs" onclick="toggleDoc(this)">
      <span>📄 관련 문서 ${ownDocs}건</span>
      <span class="dt-arrow">▶</span>
    </div>
    <div class="doc-panel">${html}</div>
  </div>`;
}

function toggleDoc(btn) {
  btn.classList.toggle("open");
  const panel = btn.nextElementSibling;
  panel.classList.toggle("open");
}

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return text.replace(re, m => `<mark>${m}</mark>`);
}

function render(filter="", section="all") {
  const container = document.getElementById("clauses-container");
  container.innerHTML = "";
  const q = filter.toLowerCase().trim();
  let totalVisible = 0;

  data.forEach(clause => {
    if (section !== "all" && clause.num !== section) return;
    const matchedSubs = clause.subs.filter(sub => {
      if (!q) return true;
      return sub.num.toLowerCase().includes(q) || sub.title.toLowerCase().includes(q) ||
        sub.desc.toLowerCase().includes(q) || sub.items.some(i => i.toLowerCase().includes(q)) ||
        (sub.iatf && sub.iatf.toLowerCase().includes(q)) ||
        (subDocMap[sub.num] || []).some(k => {
          const g = docGroups[k];
          return g && (g.code.toLowerCase().includes(q) || g.name.toLowerCase().includes(q) ||
            g.docs.some(d => d.code.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)));
        });
    });
    if (q && !matchedSubs.length) return;
    totalVisible += matchedSubs.length;

    const clauseDocs = countClauseDocs(clause.num);
    const groupEl = document.createElement("div");
    groupEl.className = "clause-group";
    const headerEl = document.createElement("div");
    headerEl.className = "clause-header";
    headerEl.innerHTML = `<span class="clause-num">${clause.num}</span>
      <span class="clause-title">${hl(clause.title, q)}</span>
      <span class="clause-meta">
        <span class="doc-count-badge">문서 ${clauseDocs}건</span>
        <span class="arrow">▶</span>
      </span>`;
    const bodyEl = document.createElement("div");
    bodyEl.className = "clause-body";

    if (q) {
      headerEl.classList.add("expanded");
      bodyEl.classList.add("open");
      headerEl.querySelector(".arrow").classList.add("open");
    }
    headerEl.addEventListener("click", () => {
      const isOpen = bodyEl.classList.toggle("open");
      headerEl.classList.toggle("expanded", isOpen);
      headerEl.querySelector(".arrow").classList.toggle("open", isOpen);
    });

    const subsToShow = q ? matchedSubs : clause.subs;
    subsToShow.forEach(sub => {
      const subEl = document.createElement("div");
      subEl.className = "sub-clause";
      const badges = sub.badges.map(b => {
        if (b === "IATF 추가") return `<span class="badge badge-iatf">IATF 추가</span>`;
        if (b === "ISO 9001") return `<span class="badge badge-9001">ISO 9001</span>`;
        return "";
      }).join(" ");
      const items = sub.items.length
        ? `<ul>${sub.items.map(i=>`<li>${hl(i,q)}</li>`).join("")}</ul>` : "";
      const iatfNote = sub.iatf
        ? `<div class="iatf-note"><strong>IATF Note:</strong> ${hl(sub.iatf,q)}</div>` : "";
      const docPanel = renderDocPanel(sub.num);
      subEl.innerHTML = `
        <div class="sub-num">${sub.num}</div>
        <div class="sub-title">${hl(sub.title,q)} ${badges}</div>
        <div class="sub-desc">${hl(sub.desc,q)}${items}${iatfNote}${docPanel}</div>`;
      bodyEl.appendChild(subEl);
    });

    groupEl.appendChild(headerEl);
    groupEl.appendChild(bodyEl);
    container.appendChild(groupEl);
  });

  const noRes = document.getElementById("no-results");
  noRes.classList.toggle("show", totalVisible === 0 && !!q);
  document.getElementById("search-count").textContent = q ? `${totalVisible}건` : "";
}

/* NAV */
let curSection = "all";
document.getElementById("nav-tabs").querySelectorAll(".nav-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    curSection = tab.dataset.section;
    render(document.getElementById("search-input").value, curSection);
  });
});

let st;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(st);
  st = setTimeout(() => render(e.target.value, curSection), 200);
});

render();
