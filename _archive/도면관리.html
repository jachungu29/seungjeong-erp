<!DOCTYPE html>
<html lang="ko">
<head><base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도면관리 시스템 | Drawing Management System</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --bg2: #0d1424;
  --bg3: #111a2e;
  --bg4: #162038;
  --sidebar: #091220;
  --card: #111a2e;
  --card2: #162038;
  --border: #1e2d4a;
  --border2: #243558;
  --cyan: #00c8ff;
  --cyan2: #00a8d4;
  --cyan-dim: rgba(0,200,255,0.12);
  --cyan-glow: rgba(0,200,255,0.25);
  --green: #00e5a0;
  --yellow: #f5c842;
  --orange: #ff8c42;
  --red: #ff4d6d;
  --purple: #a855f7;
  --text: #e8edf5;
  --text2: #9ab0cc;
  --text3: #5a7494;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
/* Layout */
#app { display: flex; height: 100vh; overflow: hidden; }
/* Sidebar */
#sidebar {
  width: 220px; min-width: 220px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.logo-main {
  font-size: 13px; font-weight: 700; color: var(--cyan);
  letter-spacing: 0.5px; line-height: 1.3;
}
.logo-sub {
  font-size: 10px; color: var(--text3); margin-top: 2px;
  font-family: var(--mono); letter-spacing: 0.3px;
}
.sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav-section-label {
  font-size: 9px; font-weight: 600; color: var(--text3);
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 10px 8px 5px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 6px; cursor: pointer;
  color: var(--text2); font-size: 12.5px; font-weight: 500;
  margin-bottom: 1px; transition: all 0.15s; border: 1px solid transparent;
  white-space: nowrap; overflow: hidden;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  background: var(--cyan-dim); color: var(--cyan);
  border-color: rgba(0,200,255,0.2);
}
.nav-item .nav-icon { font-size: 14px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: var(--bg4);
  color: var(--text3); font-size: 10px;
  padding: 1px 6px; border-radius: 10px;
  font-family: var(--mono); flex-shrink: 0;
}
.nav-item.active .nav-badge { background: rgba(0,200,255,0.15); color: var(--cyan); }
.sidebar-bottom {
  padding: 10px 8px;
  border-top: 1px solid var(--border);
}
.btn-io {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 10px; border-radius: 6px;
  font-size: 12px; font-family: var(--sans); font-weight: 500;
  cursor: pointer; border: 1px solid var(--border2); margin-bottom: 6px;
  background: var(--bg3); color: var(--text2); transition: all 0.15s;
}
.btn-io:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
/* Header */
#header {
  height: 52px; min-height: 52px;
  display: flex; align-items: center;
  padding: 0 20px; gap: 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.header-title {
  font-size: 15px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.header-title span { color: var(--cyan); }
.search-wrap {
  flex: 1; max-width: 380px;
  position: relative; margin-left: 10px;
}
.search-wrap input {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: 6px;
  padding: 7px 12px 7px 34px;
  color: var(--text); font-family: var(--sans); font-size: 12.5px;
  outline: none; transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--cyan); }
.search-wrap .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 13px;
}
.header-filters { display: flex; gap: 6px; margin-left: 6px; }
.filter-chip {
  padding: 5px 11px; border-radius: 5px; font-size: 11.5px;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); cursor: pointer; transition: all 0.15s;
  font-family: var(--sans); white-space: nowrap;
}
.filter-chip:hover { border-color: var(--cyan); color: var(--cyan); }
.filter-chip.active { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
.header-right { margin-left: auto; display: flex; gap: 8px; }
.btn-primary {
  padding: 7px 14px; border-radius: 6px;
  background: var(--cyan); color: #000;
  border: none; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; font-family: var(--sans);
  display: flex; align-items: center; gap: 5px;
}
.btn-primary:hover { background: var(--cyan2); }
/* Content */
#content { flex: 1; overflow-y: auto; padding: 16px 20px; }
/* Stats cards */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 16px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.stat-card.cyan::before { background: var(--cyan); }
.stat-card.green::before { background: var(--green); }
.stat-card.yellow::before { background: var(--yellow); }
.stat-card.purple::before { background: var(--purple); }
.stat-label { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }
.stat-value { font-size: 26px; font-weight: 700; font-family: var(--mono); margin: 4px 0 2px; }
.stat-card.cyan .stat-value { color: var(--cyan); }
.stat-card.green .stat-value { color: var(--green); }
.stat-card.yellow .stat-value { color: var(--yellow); }
.stat-card.purple .stat-value { color: var(--purple); }
.stat-sub { font-size: 10.5px; color: var(--text3); }
/* Table */
.table-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--card2);
}
.table-title { font-size: 12px; font-weight: 600; color: var(--text2); display: flex; align-items: center; gap: 8px; }
.count-badge {
  background: var(--bg); border: 1px solid var(--border2);
  color: var(--text3); font-size: 10.5px; font-family: var(--mono);
  padding: 1px 7px; border-radius: 10px;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 9px 12px;
  background: var(--bg); color: var(--text3);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td {
  padding: 9px 12px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text2); vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
.tr-clickable { cursor: pointer; }
.tr-clickable:hover td { background: rgba(0,200,255,0.04) !important; }
.partno {
  font-family: var(--mono); font-size: 11.5px;
  color: var(--cyan); font-weight: 500;
}
.partname { font-weight: 500; color: var(--text); }
.type-badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 4px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.type-완제품 { background: rgba(0,200,255,0.12); color: var(--cyan); border: 1px solid rgba(0,200,255,0.25); }
.type-반제품 { background: rgba(0,229,160,0.10); color: var(--green); border: 1px solid rgba(0,229,160,0.25); }
.type-원부자재 { background: rgba(245,200,66,0.10); color: var(--yellow); border: 1px solid rgba(245,200,66,0.25); }
.type-미매핑 { background: rgba(255,77,109,0.10); color: var(--red); border: 1px solid rgba(255,77,109,0.25); }
.rev-badge {
  display: inline-flex; align-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 4px;
  background: rgba(168,85,247,0.12); color: var(--purple);
  border: 1px solid rgba(168,85,247,0.25);
}
.has-drawing { color: var(--cyan); }
.no-drawing { color: var(--text3); }
.action-btn {
  padding: 4px 9px; border-radius: 4px; font-size: 11px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; font-family: var(--sans);
  transition: all 0.12s; display: inline-flex; align-items: center; gap: 4px;
}
.action-btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
.action-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,77,109,0.08); }
/* BOM tree */
.bom-tree { padding: 12px; }
.bom-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px; margin-bottom: 2px;
  border: 1px solid transparent; transition: all 0.12s;
}
.bom-row:hover { background: rgba(255,255,255,0.03); border-color: var(--border); }
.bom-indent { display: flex; align-items: center; gap: 0; }
.bom-line { width: 20px; height: 20px; flex-shrink: 0; position: relative; }
.bom-level-0 .bom-partno { color: var(--cyan); font-size: 12.5px; }
.bom-level-1 .bom-partno { color: var(--green); }
.bom-level-2 .bom-partno { color: var(--yellow); }
.bom-level-3 .bom-partno { color: var(--orange); }
.bom-partno { font-family: var(--mono); font-size: 11.5px; font-weight: 500; min-width: 170px; }
.bom-partname { font-size: 12px; color: var(--text); min-width: 200px; }
.bom-spec { font-size: 11px; color: var(--text3); min-width: 140px; }
.bom-qty { font-family: var(--mono); font-size: 11.5px; color: var(--text2); min-width: 50px; text-align: right; }
.bom-supplier { font-size: 11px; color: var(--text3); min-width: 110px; }
.bom-price { font-family: var(--mono); font-size: 11.5px; color: var(--text2); min-width: 70px; text-align: right; }
/* Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  max-height: 90vh; width: 900px; max-width: 100%;
  overflow: hidden;
}
.modal-lg { width: 1100px; }
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 14px;
  flex-shrink: 0;
}
.modal-title-area { flex: 1; }
.modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
.modal-subtitle { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--mono); }
.modal-close {
  background: none; border: none; color: var(--text3);
  font-size: 20px; cursor: pointer; padding: 2px;
  transition: color 0.12s; line-height: 1; flex-shrink: 0;
}
.modal-close:hover { color: var(--text); }
.modal-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 20px; flex-shrink: 0;
  background: var(--sidebar);
}
.modal-tab {
  padding: 10px 16px; font-size: 12px; font-weight: 500;
  color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.15s; white-space: nowrap;
}
.modal-tab:hover { color: var(--text); }
.modal-tab.active { color: var(--cyan); border-color: var(--cyan); }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
}
/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-size: 10.5px; font-weight: 600; color: var(--text3);
  letter-spacing: 0.6px; text-transform: uppercase;
}
.form-label .req { color: var(--red); margin-left: 3px; }
.form-input, .form-select, .form-textarea {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 6px; padding: 8px 11px;
  color: var(--text); font-family: var(--sans); font-size: 12.5px;
  outline: none; transition: border-color 0.15s; width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--cyan); }
.form-select { cursor: pointer; appearance: none; }
.form-textarea { resize: vertical; min-height: 70px; }
.form-input.mono { font-family: var(--mono); }
/* Drawing upload area */
.drawing-drop {
  border: 2px dashed var(--border2); border-radius: 8px;
  padding: 32px; text-align: center; cursor: pointer;
  transition: all 0.15s; position: relative;
}
.drawing-drop:hover, .drawing-drop.dragover {
  border-color: var(--cyan); background: var(--cyan-dim);
}
.drawing-drop input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.drop-icon { font-size: 32px; margin-bottom: 8px; }
.drop-text { font-size: 12.5px; color: var(--text2); }
.drop-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
/* Drawing preview */
.drawing-preview-wrap {
  background: var(--bg3); border-radius: 8px;
  overflow: hidden; position: relative; min-height: 300px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
}
.drawing-preview-wrap img {
  max-width: 100%; max-height: 450px;
  object-fit: contain; display: block;
}
.drawing-preview-wrap iframe {
  width: 100%; height: 450px; border: none;
}
/* Rev history */
.rev-timeline { display: flex; flex-direction: column; gap: 0; }
.rev-item {
  display: flex; gap: 14px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.rev-item:last-child { border-bottom: none; }
.rev-dot-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
.rev-dot {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--purple); color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-family: var(--mono);
}
.rev-dot.latest { background: var(--cyan); color: #000; }
.rev-line { flex: 1; width: 1px; background: var(--border); margin-top: 4px; }
.rev-content { flex: 1; }
.rev-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.rev-tag { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--purple); }
.rev-tag.latest { color: var(--cyan); }
.rev-date { font-size: 11px; color: var(--text3); }
.rev-latest-badge {
  font-size: 9px; padding: 1px 6px; border-radius: 3px;
  background: rgba(0,200,255,0.15); color: var(--cyan);
  font-weight: 600; letter-spacing: 0.5px;
}
.rev-note { font-size: 12px; color: var(--text2); }
.rev-file { font-size: 11px; color: var(--text3); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
/* Parent product list */
.parent-list { display: flex; flex-direction: column; gap: 8px; }
.parent-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; padding: 12px 14px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: all 0.15s;
}
.parent-card:hover { border-color: var(--cyan); background: var(--cyan-dim); }
.parent-partno { font-family: var(--mono); font-size: 12px; color: var(--cyan); font-weight: 500; min-width: 160px; }
.parent-name { font-size: 12.5px; color: var(--text); font-weight: 500; flex: 1; }
.parent-model { font-size: 11px; color: var(--text3); }
.parent-customer { font-size: 11px; color: var(--text3); }
/* Multi-select checkbox list */
.checkbox-list {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 6px; max-height: 200px; overflow-y: auto; padding: 6px;
}
.checkbox-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 4px; cursor: pointer; transition: background 0.12s;
}
.checkbox-item:hover { background: rgba(255,255,255,0.04); }
.checkbox-item input[type=checkbox] { accent-color: var(--cyan); width: 14px; height: 14px; flex-shrink: 0; }
.checkbox-label { font-size: 12px; color: var(--text2); }
.checkbox-sub { font-size: 10.5px; color: var(--text3); }
/* Info row */
.info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 16px;
}
.info-item { display: flex; flex-direction: column; gap: 2px; }
.info-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
.info-value { font-size: 12.5px; color: var(--text); font-weight: 500; }
.info-value.mono { font-family: var(--mono); color: var(--cyan); }
/* Section header */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-title {
  font-size: 12px; font-weight: 600; color: var(--text2);
  display: flex; align-items: center; gap: 8px;
}
.section-line {
  flex: 1; height: 1px; background: var(--border); margin-left: 10px;
}
/* Empty state */
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text3); font-size: 13px;
}
.empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
/* BOM tree header row */
.bom-header {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; margin-bottom: 4px;
  font-size: 10.5px; color: var(--text3); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
/* Loading */
.loading { display: flex; align-items: center; justify-content: center; height: 200px; gap: 10px; color: var(--text3); }
/* Notification */
#notif {
  position: fixed; top: 16px; right: 16px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
}
.notif-item {
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 12px 16px;
  font-size: 12.5px; color: var(--text); min-width: 260px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px;
  animation: slideIn 0.2s ease;
}
.notif-item.success { border-left: 3px solid var(--green); }
.notif-item.error { border-left: 3px solid var(--red); }
.notif-item.info { border-left: 3px solid var(--cyan); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
/* Responsive override for content dividers */
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.flex-row { display: flex; align-items: center; gap: 10px; }
.flex-1 { flex: 1; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.mt-12 { margin-top: 12px; }
.btn-ghost {
  padding: 7px 14px; border-radius: 6px;
  background: transparent; color: var(--text2);
  border: 1px solid var(--border2); font-size: 12px;
  cursor: pointer; transition: all 0.15s; font-family: var(--sans);
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-ghost:hover { border-color: var(--text2); color: var(--text); }
.btn-danger {
  padding: 7px 14px; border-radius: 6px;
  background: transparent; color: var(--red);
  border: 1px solid rgba(255,77,109,0.3); font-size: 12px;

let state = {
  items: {},        // partNo -> item (BOM embedded + userItems)
  bomLinks: [],     // BOM hierarchy links
  drawings: {},     // partNo -> {revHistory:[{rev,date,note,fileName,fileType,fileHash}]}
  fileStore: {},    // fileHash -> fileData (dedup, content-addressed)
  userItems: {},    // user-added/modified items only (exported in JSON)
  view: 'dashboard',
  search: '',
  typeFilter: 'all',
  editingPartNo: null,
  tempDrawingData: null,  // {fileName,fileData,fileType}
  tempRevFileData: null,
};

function initData() {
  // Load items from BOM raw data
  BOM_ITEMS_RAW.forEach(item => {
    state.items[item.partNo] = {
      ...item,
      id: item.partNo,
    };
  });
  state.bomLinks = BOM_LINKS_RAW;
  
  // Load saved data from localStorage (v2 format preferred)
  const savedV2 = localStorage.getItem('drawingMgmt_v2');
  const savedV1 = localStorage.getItem('drawingMgmt_v1');
  const saved = savedV2 || savedV1;
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (savedV2) {
        // v2: drawings + fileStore + userItems
        if (parsed.drawings) state.drawings = parsed.drawings;
        if (parsed.fileStore) state.fileStore = parsed.fileStore;
        if (parsed.userItems) {
          state.userItems = parsed.userItems;
          Object.assign(state.items, parsed.userItems);
        }
      } else {
        // v1 legacy: had inline fileData in revHistory
        if (parsed.drawings) state.drawings = parsed.drawings;
        if (parsed.items) {
          Object.entries(parsed.items).forEach(([k,v]) => {
            if (!state.items[k]) { state.items[k]=v; state.userItems[k]=v; }
            else state.items[k] = {...state.items[k], ...v};
          });
        }
        // Migrate inline fileData to fileStore
        migrateToFileStore();
        saveToStorage(); // resave in v2 format
      }
    } catch(e) { console.warn('Storage load error:', e); }
  }
  updateBadges();
  setTimeout(updateStorageStats, 100);
}

// ======================== STORAGE OPTIMIZATION ========================
// fileStore: hash -> fileData (dedup across revisions)
// drawings: partNo -> {revHistory:[{rev,date,note,fileName,fileType,fileHash}]}

function hashStr(str) {
  // Fast 53-bit hash (cyrb53)
  let h1=0xdeadbeef^0, h2=0x41c6ce57^0;
  for(let i=0,ch;i<str.length;i++){
    ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

function addToFileStore(fileData) {
  if (!fileData) return null;
  const h = hashStr(fileData);
  if (!state.fileStore[h]) state.fileStore[h] = fileData;
  return h;
}

function getFromFileStore(fileHash) {
  return state.fileStore[fileHash] || null;
}

function migrateToFileStore() {
  // Migrate old format: move fileData from rev entries to fileStore
  let migrated = 0;
  Object.values(state.drawings).forEach(d => {
    (d.revHistory||[]).forEach(r => {
      if (r.fileData && !r.fileHash) {
        r.fileHash = addToFileStore(r.fileData);
        delete r.fileData;
        migrated++;
      }
    });
  });
  if (migrated > 0) console.log(`Migrated ${migrated} file entries to fileStore`);
}

function getStorageStats() {
  const fileStoreSize = Object.values(state.fileStore).reduce((a,v)=>a+v.length,0);
  const itemsSize = JSON.stringify(state.userItems||{}).length;
  const drawingsSize = JSON.stringify(state.drawings||{}).length;
  const totalKB = (fileStoreSize + itemsSize + drawingsSize) / 1024;
  return {
    fileCount: Object.keys(state.fileStore).length,
    fileStoreKB: Math.round(fileStoreSize/1024),
    totalKB: Math.round(totalKB),
  };
}

function saveToStorage() {
  try {
    const payload = JSON.stringify({
      drawings: state.drawings,
      fileStore: state.fileStore,
      userItems: state.userItems || {},
    });
    localStorage.setItem('drawingMgmt_v2', payload);
    // Clear old format key if present
    localStorage.removeItem('drawingMgmt_v1');
    updateStorageStats();
  } catch(e) {
    notify('로컬 저장 실패 (용량 초과) — JSON 내보내기로 보관하세요', 'error');
  }
  _cloudSave(); // 클라우드 저장(전 PC 공유)
}

function updateStorageStats() {
  const el = document.getElementById('storageStats');
  if (!el) return;
  const s = getStorageStats();
  el.textContent = `💾 ${s.totalKB} KB (파일 ${s.fileCount}개)`;
  el.style.color = s.totalKB > 3000 ? 'var(--red)' : s.totalKB > 1500 ? 'var(--yellow)' : 'var(--text3)';
}

// ======================== VIEWS ========================
function setView(v) {
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + v);
  if (nav) nav.classList.add('active');
  
  const titles = {
    dashboard:'📊 대시보드', all:'📋 전체 도면', finished:'🏭 완제품',
    semi:'🔩 반제품', material:'📦 원부자재', register:'➕ 도면 등록'
  };
  const header = document.getElementById('headerTitle');
  header.innerHTML = titles[v] ? `<span>${titles[v]}</span>` : v;
  
  const showFilters = ['all','finished','semi','material'].includes(v);
  document.getElementById('typeFilters').style.display = showFilters ? 'flex' : 'none';
  
  render();
}

function render() {
  const c = document.getElementById('content');
  switch(state.view) {
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'all': c.innerHTML = renderAll(); break;
    case 'finished': c.innerHTML = renderFinished(); break;
    case 'semi': c.innerHTML = renderSemi(); break;
    case 'material': c.innerHTML = renderMaterial(); break;
    case 'register': openEditModal(null); setView('all'); break;
    default: c.innerHTML = renderDashboard();
  }
}

function getItems(typeFilter) {
  let items = Object.values(state.items);
  if (typeFilter && typeFilter !== 'all') {
    if (typeFilter === '반제품') items = items.filter(i => i.type.startsWith('반제품'));
    else items = items.filter(i => i.type === typeFilter);
  }
  if (state.typeFilter && state.typeFilter !== 'all' && !typeFilter) {
    if (state.typeFilter === '반제품') items = items.filter(i => i.type.startsWith('반제품'));
    else items = items.filter(i => i.type === state.typeFilter);
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    items = items.filter(i => 
      i.partNo.toLowerCase().includes(q) ||
      i.partName.toLowerCase().includes(q) ||
      (i.spec||'').toLowerCase().includes(q) ||
      (i.supplier||'').toLowerCase().includes(q)
    );
  }
  return items.sort((a,b) => a.partNo.localeCompare(b.partNo));
}

function getDrawingInfo(partNo) {
  return state.drawings[partNo] || null;
}

function hasDrawing(partNo) {
  const d = getDrawingInfo(partNo);
  if (!d || !d.revHistory || !d.revHistory.length) return false;
  return d.revHistory.some(r => r.fileHash || r.fileData);
}

function getCurrentRev(partNo) {
  const d = getDrawingInfo(partNo);
  if (!d || !d.revHistory || !d.revHistory.length) return '-';
  return d.revHistory[d.revHistory.length-1].rev || '-';
}

function typeClass(type) {
  if (type === '완제품') return 'type-완제품';
  if (type.startsWith('반제품')) return 'type-반제품';
  if (type === '원부자재') return 'type-원부자재';
  return 'type-미매핑';
}
function typeLabel(type) {
  if (type.startsWith('반제품')) return type;
  return type;
}

function renderBOMTree(finishedPartNo) {
  const rows = state.bomLinks.filter(b => b.finishedPartNo === finishedPartNo)
    .sort((a,b) => a.level - b.level);
  if (!rows.length) return `<div class="empty-state"><div class="empty-icon">🔩</div><div>BOM 구성이 없습니다</div></div>`;
  
  // Group by unique display (de-dup same partNo at same level)
  const seen = new Set();
  const unique = rows.filter(r => {
    const key = r.level + '_' + r.partNo + '_' + (r.parentPartNo||'');
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  
  return `
  <div style="overflow-x:auto">
  <div class="bom-header" style="padding-left:8px">
    <div style="min-width:${4*20+180}px">품번 (계층구조)</div>

    } else if (file.type.includes('pdf')) {

      preview.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">

function saveItem() {
  const partNo = state.editingPartNo || document.getElementById('e_partNo').value.trim();
  if (!partNo) { notify('품번을 입력해주세요', 'error'); return; }
  const partName = document.getElementById('e_partName').value.trim();
  if (!partName) { notify('품명을 입력해주세요', 'error'); return; }
  
  // Collect usedIn
  const usedIn = Array.from(document.querySelectorAll('#e_usedIn input:checked')).map(c => c.value);
  const carModels = document.getElementById('e_carModel').value.split(',').map(s=>s.trim()).filter(Boolean);
  const customers = document.getElementById('e_customer').value.split(',').map(s=>s.trim()).filter(Boolean);
  
  const type = document.getElementById('e_type').value;
  
  // Create/update item
  if (!state.items[partNo]) {
    state.items[partNo] = { partNo, partName, type, spec:'', supplier:'', unitPrice:0, equipment:'', safetyStock:0, note:'', usedInFinished:[], customers:[], carModels:[] };
  }
  state.items[partNo] = {
    ...state.items[partNo],
    partName,
    type,
    spec: document.getElementById('e_spec').value.trim(),
    supplier: document.getElementById('e_supplier').value.trim(),
    unitPrice: parseFloat(document.getElementById('e_unitPrice').value)||0,
    equipment: document.getElementById('e_equipment').value.trim(),
    safetyStock: parseInt(document.getElementById('e_safetyStock').value)||0,
    carModels: carModels.length ? carModels : state.items[partNo].carModels,
    customers: customers.length ? customers : state.items[partNo].customers,
    note: document.getElementById('e_note').value.trim(),
    usedInFinished: type === '완제품' ? [partNo] : (usedIn.length ? usedIn : state.items[partNo].usedInFinished),
  };
  
  // ── 도면 파일 처리 규칙 ──
  // 최신 Rev 파일 1개만 fileStore에 유지.
  // 새 파일이 등록되면 이전 Rev 파일을 fileStore에서 제거(메타 이력은 보존).
  function replaceLatestFile(partNo, newHash) {
    const revs = state.drawings[partNo]?.revHistory || [];
    // 현재 파일이 있는 모든 이전 Rev의 fileHash 제거 (fileStore에서도 삭제)
    revs.forEach(r => {
      if (r.fileHash && r.fileHash !== newHash) {
        // 다른 품목이 같은 파일을 공유하는지 확인 후 삭제
        const usedElsewhere = Object.entries(state.drawings).some(([pNo, d]) =>
          pNo !== partNo && (d.revHistory||[]).some(rv => rv.fileHash === r.fileHash)
        );
        if (!usedElsewhere) delete state.fileStore[r.fileHash];
        delete r.fileHash; // revHistory 항목에서 파일 참조 제거 (메타는 유지)
      }
    });
  }

  // 초기 도면 등록 (도면 탭에서 업로드)
  if (state.tempDrawingData) {
    const rev = document.getElementById('e_currentRev').value.trim() || 'A';
    if (!state.drawings[partNo]) state.drawings[partNo] = { revHistory: [] };
    const fileHash = addToFileStore(state.tempDrawingData.fileData);
    replaceLatestFile(partNo, fileHash); // 이전 파일 제거
    const existing = state.drawings[partNo].revHistory.find(r => r.rev === rev);
    if (!existing) {
      state.drawings[partNo].revHistory.push({
        rev, date: new Date().toISOString().slice(0,10),
        note: '최초 등록', fileName: state.tempDrawingData.fileName,
        fileType: state.tempDrawingData.fileType, fileHash,
      });
    } else {
      existing.fileHash = fileHash;
      existing.fileType = state.tempDrawingData.fileType;
      existing.fileName = state.tempDrawingData.fileName;
    }
    state.tempDrawingData = null;
  }

  // 개정 추가 (개정 탭) — 새 파일 있으면 이전 Rev 파일 삭제, 이력 메타는 보존
  const newRev = document.getElementById('e_newRev').value.trim();
  if (newRev) {
    const revNote = document.getElementById('e_revNote').value.trim();
    const revDate = document.getElementById('e_revDate').value;
    if (!state.drawings[partNo]) state.drawings[partNo] = { revHistory: [] };
    let fileHash = '';
    if (state.tempRevFileData?.fileData) {
      fileHash = addToFileStore(state.tempRevFileData.fileData);
      replaceLatestFile(partNo, fileHash); // 새 파일로 교체 — 이전 파일 제거
    }
    const existing = state.drawings[partNo].revHistory.find(r => r.rev === newRev);
    const revEntry = {
      rev: newRev, date: revDate, note: revNote,
      fileName: state.tempRevFileData?.fileName || (existing?.fileName||''),
      fileType: state.tempRevFileData?.fileType || (existing?.fileType||''),
      ...(fileHash ? { fileHash } : {}),
    };
    if (!existing) state.drawings[partNo].revHistory.push(revEntry);
    else Object.assign(existing, revEntry);
    state.tempRevFileData = null;
  }
  
  saveToStorage();
  updateBadges();
  closeModal('editModal');
  notify('저장되었습니다: ' + partNo, 'success');
  render();
}

// ======================== DOWNLOAD ========================
function downloadDrawing(partNo) {
  const drawInfo = getDrawingInfo(partNo);
  const latest = drawInfo?.revHistory?.slice(-1)[0];
  const fd = latest?.fileHash ? getFromFileStore(latest.fileHash) : latest?.fileData;
  if (!fd) { notify('등록된 도면이 없습니다', 'error'); return; }
  downloadFile(fd, latest.fileName || partNo + '_drawing');
}

function downloadRevDrawing(partNo, rev) {
  const drawInfo = getDrawingInfo(partNo);
  const r = drawInfo?.revHistory?.find(h => h.rev === rev);
  const fd = r?.fileHash ? getFromFileStore(r.fileHash) : r?.fileData;
  if (!fd) { notify('파일을 찾을 수 없습니다', 'error'); return; }
  downloadFile(fd, r.fileName || partNo + '_' + rev);
}

function downloadCurrentDrawing() {
  if (state.tempDrawingData) {
    downloadFile(state.tempDrawingData.fileData, state.tempDrawingData.fileName);
  }
}

function downloadFile(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ======================== JSON EXPORT/IMPORT ========================
function exportJSON() {
  // Export v2: only drawings + fileStore + user-added items (NOT embedded BOM data)
  const data = {
    version: 2,
    exportDate: new Date().toISOString(),
    drawings: state.drawings,
    fileStore: state.fileStore,
    userItems: state.userItems || {},
  };
  const jsonStr = JSON.stringify(data);
  const stats = getStorageStats();
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'drawing_management_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const sizeKB = Math.round(jsonStr.length / 1024);
  notify(`JSON 내보내기 완료 (${sizeKB.toLocaleString()} KB)`, 'success');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const ver = data.version || 1;

      if (ver >= 2) {
        // v2 format: drawings + fileStore + userItems only
        if (data.drawings) Object.assign(state.drawings, data.drawings);
        if (data.fileStore) Object.assign(state.fileStore, data.fileStore);
        if (data.userItems) {
          state.userItems = state.userItems || {};
          Object.assign(state.userItems, data.userItems);
          Object.assign(state.items, data.userItems);
        }
      } else {
        // v1 legacy format: had full items+bomLinks+drawings with inline fileData
        if (data.items) {
          // Only merge user-created items (not BOM items that are already embedded)
          Object.entries(data.items).forEach(([k,v]) => {
            if (!state.items[k]) { state.items[k]=v; state.userItems=state.userItems||{}; state.userItems[k]=v; }
          });
        }
        if (data.drawings) Object.assign(state.drawings, data.drawings);
        // Migrate inline fileData -> fileStore
        migrateToFileStore();
      }

      saveToStorage();
      updateBadges();
      render();
      const sizeKB = Math.round(e.target.result.length/1024);
      notify(`불러오기 완료 (v${ver} 형식, ${sizeKB.toLocaleString()} KB)`, 'success');
    } catch(err) { notify('파일 형식 오류: ' + err.message, 'error'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// Drag and drop for drawing
document.addEventListener('DOMContentLoaded', () => {
  const drop = document.getElementById('drawingDrop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) { const inp = document.getElementById('drawingFileInput'); inp.files = e.dataTransfer.files; onDrawingFile({target:inp}); }
    });
  }
});

// ======================== STORAGE MANAGER ========================
function showStorageManager() {
  const s = getStorageStats();
  const fileEntries = Object.entries(state.fileStore);
  
  // Build usage by partNo
  const usage = {};
  Object.entries(state.drawings).forEach(([partNo, d]) => {
    (d.revHistory||[]).forEach(r => {
      if (r.fileHash) {
        const fd = state.fileStore[r.fileHash];
        const kb = fd ? Math.round(fd.length/1024) : 0;
        if (!usage[partNo]) usage[partNo] = {partNo, name: state.items[partNo]?.partName||'', files:[], totalKB:0};
        usage[partNo].files.push({rev:r.rev, kb, hash:r.fileHash, fileName:r.fileName||''});
        usage[partNo].totalKB += kb;
      }
    });
  });
  
  const usageRows = Object.values(usage).sort((a,b)=>b.totalKB-a.totalKB);
  const orphans = fileEntries.filter(([h]) => {
    return !Object.values(state.drawings).some(d => (d.revHistory||[]).some(r=>r.fileHash===h));
  });
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title-area">
        <div class="modal-title">🗄 저장소 관리</div>
        <div class="modal-subtitle">총 ${s.totalKB.toLocaleString()} KB | 파일 ${s.fileCount}개 (중복제거 적용)</div>
      </div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body">
      <div style="background:var(--bg3);border-radius:8px;padding:12px 14px;margin-bottom:16px">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px">저장된 파일</div>
            <div style="font-size:20px;font-weight:700;color:var(--cyan);font-family:var(--mono)">${s.fileCount}</div></div>
          <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px">파일 용량</div>
            <div style="font-size:20px;font-weight:700;color:var(--green);font-family:var(--mono)">${s.fileStoreKB.toLocaleString()} KB</div></div>
          <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px">고아 파일</div>
            <div style="font-size:20px;font-weight:700;color:${orphans.length?'var(--yellow)':'var(--text3)'};font-family:var(--mono)">${orphans.length}</div></div>
        </div>
      </div>
      ${orphans.length ? `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:11.5px;color:var(--yellow)">⚠ 미사용 파일 ${orphans.length}개 발견 — 삭제하면 용량을 절약할 수 있습니다</div>
        <button class="action-btn danger" onclick="cleanOrphanFiles(this)">🗑 정리</button>
      </div>` : ''}
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.6px">품목별 도면 용량</div>
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:6px 8px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">품번</th>
          <th style="padding:6px 8px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">Rev수</th>
          <th style="text-align:right;padding:6px 8px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">용량</th>
        </tr></thead><tbody>
        ${usageRows.map(u=>`<tr>
          <td style="padding:6px 8px;font-size:11.5px;"><span style="font-family:var(--mono);color:var(--cyan);font-size:11px">${u.partNo}</span> <span style="color:var(--text3)">${u.name}</span></td>
          <td style="padding:6px 8px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--text2)">${u.files.length}</td>
          <td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;color:${u.totalKB>500?'var(--yellow)':'var(--text2)'}">${u.totalKB.toLocaleString()} KB</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
}

function cleanOrphanFiles(btn) {
  const drawings = state.drawings;
  const usedHashes = new Set();
  Object.values(drawings).forEach(d => {
    (d.revHistory||[]).forEach(r => { if (r.fileHash) usedHashes.add(r.fileHash); });
  });
  let removed = 0;
  Object.keys(state.fileStore).forEach(h => {
    if (!usedHashes.has(h)) { delete state.fileStore[h]; removed++; }
  });
  saveToStorage();
  notify(`고아 파일 ${removed}개 정리 완료`, 'success');
  btn.closest('.modal-overlay').remove();
  showStorageManager();
}
