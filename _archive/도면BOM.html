<!DOCTYPE html>
<html lang="ko"><head><base href="../">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>도면기반 BOM</title>
<link rel="icon" href="sj-icon.png">
<style>
:root{--navy:#0d2240;--blue:#1a7abf;--bg:#eef2f8;--border:#dfe6ef;--text:#1e293b;--muted:#64748b;--head:#0f2748;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;background:var(--head);color:#fff;padding:9px 18px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.topbar .sub{font-size:10.5px;opacity:.7;font-weight:400}
.stats{display:flex;gap:12px;font-size:11px}
.stats b{color:#7dd3fc;font-size:13px}
.modesw{display:flex;background:#1e3a5f;border-radius:8px;padding:2px}
.modesw button{background:transparent;color:#a9c2df;border:0;padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;font-weight:600}
.modesw button.on{background:var(--blue);color:#fff}
.spacer{flex:1}
.sync{font-size:10px;padding:2px 8px;border-radius:10px;background:#334155;color:#cbd5e1}
.tb-btn{background:#1e3a5f;color:#fff;border:1px solid #2c527e;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer;position:relative}
.tb-btn:hover{background:#27496f}
.tb-btn.blue{background:var(--blue);border-color:var(--blue)}
.filterbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;flex-wrap:wrap}
.filterbar label{font-size:11px;color:var(--muted);font-weight:600}
.filterbar select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.filterbar .clr{margin-left:auto;font-size:11px;color:var(--blue);cursor:pointer;background:none;border:0}
.wrap{display:flex;height:calc(100vh - 96px)}
.side{width:310px;min-width:310px;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column}
.side .sh{padding:9px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:12px;color:var(--muted)}
.side input.q{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px}
.flist{flex:1;overflow-y:auto}
.frow{padding:8px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.frow:hover{background:#f8fafc}
.frow.active{background:#e8f2fb;border-left:3px solid var(--blue)}
.frow .pn{font-weight:700;font-family:ui-monospace,monospace;font-size:12px;color:var(--navy)}
.frow .nm{color:var(--muted);font-size:11px;margin-top:2px}
.frow .meta{color:#94a3b8;font-size:10px;margin-top:1px}
.main{flex:1;overflow:auto;padding:14px 18px}
.mhead h2{font-size:17px;color:var(--navy);font-family:ui-monospace,monospace}
.mhead .d{color:var(--muted);font-size:12px;margin-top:3px}
.sumcards{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.sc{background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 14px;min-width:110px}
.sc .v{font-size:18px;font-weight:800;color:var(--navy)}
.sc .l{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
th{background:#f1f5f9;color:var(--muted);font-weight:700;padding:8px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tr:hover td{background:#fafcff}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.b-fin{background:#dcfce7;color:#166534}.b-semi{background:#fef9c3;color:#854d0e}.b-raw{background:#e0e7ff;color:#3730a3}.b-etc{background:#f1f5f9;color:#64748b}
.pn{font-family:ui-monospace,monospace;font-weight:600}
.qty{text-align:right;font-family:ui-monospace,monospace;font-weight:700}
.lv-pill{display:inline-block;min-width:22px;text-align:center;background:#eef2f8;border-radius:5px;font-size:10px;color:var(--muted);padding:1px 4px;font-family:ui-monospace,monospace}
.empty{padding:60px;text-align:center;color:#94a3b8}
.colmenu{position:absolute;top:38px;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:8px;z-index:40;width:150px;display:none}
.colmenu.show{display:block}
.colmenu label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px;padding:4px 6px;cursor:pointer;font-weight:500}
.colmenu label:hover{background:#f1f5f9;border-radius:5px}
@media print{.topbar,.filterbar,.side,.colmenu{display:none}.wrap{height:auto;display:block}.main{overflow:visible;padding:0}}
</style></head>
<body>
<div class="topbar">
  <h1>🧩 도면기반 BOM <span class="sub">Drawing-based BOM</span></h1>
  <div class="stats"><span>완제품 <b id="s-fin">0</b></span><span>BOM행 <b id="s-link">0</b></span><span>품목 <b id="s-item">0</b></span></div>
  <div class="modesw"><button id="m-fwd" class="on" onclick="setMode('fwd')">▽ 정전개(완제품→부품)</button><button id="m-rev" onclick="setMode('rev')">△ 역전개(부품→완제품)</button></div>
  <span class="sync" id="sync">● 로딩…</span>
  <div class="spacer"></div>
  <button class="tb-btn" onclick="toggleCol(event)">⚙ 컬럼<div class="colmenu" id="colmenu"></div></button>
  <button class="tb-btn" onclick="printBom()">🖨 인쇄</button>
  <button class="tb-btn blue" onclick="excelBom()">📊 엑셀</button>
</div>
<div class="filterbar">
  <label>🚗 차종</label><select id="f-car" onchange="rerenderList()"><option value="">전체</option></select>
  <label>🏢 고객</label><select id="f-cust" onchange="rerenderList()"><option value="">전체</option></select>
  <label id="lbl-type" style="display:none">📦 유형</label><select id="f-type" style="display:none" onchange="rerenderList()"><option value="">전체</option></select>
  <button class="clr" onclick="clearFilters()">필터 초기화 ✕</button>
</div>
<div class="wrap">
  <div class="side">
    <div class="sh" id="side-h">완제품 목록 <span id="flist-cnt" style="color:#94a3b8"></span></div>
    <div style="padding:8px 10px;border-bottom:1px solid var(--border)"><input class="q" id="q" placeholder="🔍 품번·품명 검색" oninput="rerenderList()"></div>
    <div class="flist" id="flist"></div>
  </div>
  <div class="main" id="main"><div class="empty">← 왼쪽에서 선택하세요.</div></div>
</div>

var ITEMS=ITEMS_EMBED, LINKS=LINKS_EMBED, IMAP={}, CUR=null, MODE='fwd';

function uniq(a){var s={},o=[];a.forEach(function(x){if(x&&!s[x]){s[x]=1;o.push(x);}});return o.sort();}

function populateFilters(){
  var cars=uniq(LINKS.map(function(l){return l.carModel;}));
  var custs=uniq(LINKS.map(function(l){return l.customer;}));
  var types=uniq(ITEMS.map(function(i){return i.type;}));
  fill('f-car',cars);fill('f-cust',custs);fill('f-type',types);
}
function fill(id,arr){var s=document.getElementById(id),cur=s.value;s.innerHTML='<option value="">전체</option>'+arr.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');s.value=cur;}

function finishedList(){var m={};LINKS.forEach(function(l){if(!m[l.finishedPartNo]){var it=IMAP[l.finishedPartNo]||{};m[l.finishedPartNo]={pn:l.finishedPartNo,nm:it.partName||'',car:l.carModel||'',cust:l.customer||''};}});return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.pn<b.pn?-1:1;});}
function componentList(){ // 부품(역전개 대상): level>0 에 등장하는 품번들
  var s={};LINKS.forEach(function(l){if(l.level>0)s[l.partNo]=1;});
  return Object.keys(s).map(function(pn){var it=IMAP[pn]||{};return {pn:pn,nm:it.partName||'',type:it.type||'',sup:it.supplier||''};}).sort(function(a,b){return a.pn<b.pn?-1:1;});
}
function rerenderList(){ MODE==='fwd'?renderFwdList():renderRevList(); }
function renderFwdList(){
  var q=(document.getElementById('q').value||'').toLowerCase(),car=document.getElementById('f-car').value,cust=document.getElementById('f-cust').value;

  });

}
function renderRevList(){
  var q=(document.getElementById('q').value||'').toLowerCase(),tp=document.getElementById('f-type').value,car=document.getElementById('f-car').value,cust=document.getElementById('f-cust').value;
  var arr=componentList().filter(function(c){
    if(q&&(c.pn+c.nm).toLowerCase().indexOf(q)<0)return false;

    if(car||cust){var u=LINKS.filter(function(l){return l.partNo===c.pn&&l.level>0;});if(!u.some(function(l){return (!car||l.carModel===car)&&(!cust||l.customer===cust);}))return false;}

  });
  document.getElementById('flist-cnt').textContent='('+arr.length+')';
  document.getElementById('flist').innerHTML=arr.map(function(c){return row(c.pn,c.nm,typeBadge(c.type)+(c.sup?('  '+c.sup):''));}).join('')||emptyRow();
  bindRows();

function row(pn,nm,meta){return '<div class="frow'+(pn===CUR?' active':'')+'" data-pn="'+encodeURIComponent(pn)+'"><div class="pn">'+pn+'</div><div class="nm">'+(nm||'-')+'</div><div class="meta">'+meta+'</div></div>';}

function buildTree(fpn){
  var rows=LINKS.filter(function(l){return l.finishedPartNo===fpn;});
  var byParent={};rows.forEach(function(r){var k=r.parentPartNo||'__ROOT__';(byParent[k]=byParent[k]||[]).push(r);});
  var out=[];
  function dfs(pn,ext){(byParent[pn]||[]).sort(function(a,b){return a.partNo<b.partNo?-1:1;}).forEach(function(r){var e=(+r.qty||0)*ext;out.push({r:r,ext:e});dfs(r.partNo,e);});}
  (byParent['__ROOT__']||[]).forEach(function(r){out.push({r:r,ext:(+r.qty||1)});dfs(r.partNo,(+r.qty||1));});
  return out;
}

  else if(c.k==='customer')v=esc(r?r.customer:(it.customers&&it.customers[0]));
  else if(c.k==='equipment')v=esc(it.equipment);
  else if(c.k==='safetyStock')v=it.safetyStock?('<span class="qty">'+it.safetyStock.toLocaleString()+'</span>'):'';
  else if(c.k==='note')v=esc(it.note);
  h+='<td style="color:#475569">'+v+'</td>';});return h;}

function selectF(fpn){
  CUR=fpn;renderFwdList();
  var tree=buildTree(fpn),it0=IMAP[fpn]||{};
  var rawCnt=tree.filter(function(t){var it=IMAP[t.r.partNo]||{};return it.type&&it.type.indexOf('원부자재')>=0;}).length;
  var totCost=tree.reduce(function(s,t){var u=(IMAP[t.r.partNo]||{}).unitPrice||0;return s+u*t.ext;},0);
  var maxLv=tree.reduce(function(m,t){return Math.max(m,t.r.level);},0);
  var rows=tree.map(function(t){var it=IMAP[t.r.partNo]||{},lv=t.r.level;var indent=new Array(lv+1).join('&nbsp;&nbsp;&nbsp;&nbsp;');
    return '<tr><td><span class="lv-pill">L'+lv+'</span></td><td class="pn">'+indent+(lv>0?'└ ':'')+t.r.partNo+'</td><td>'+esc(it.partName||'-')+'</td><td>'+typeBadge(it.type)+'</td><td class="qty">'+(+t.r.qty||0)+'</td><td class="qty" style="color:var(--blue)">'+(Math.round(t.ext*1000)/1000)+'</td>'+colCells(it,t.r,t.ext)+'</tr>';
  }).join('');
  document.getElementById('main').innerHTML=
    '<div class="mhead"><h2>'+fpn+'</h2><div class="d">'+esc(it0.partName)+(it0.spec?('  ·  '+esc(it0.spec)):'')+'  ·  🚗 '+esc(tree[0]&&tree[0].r.carModel)+'  ·  '+esc(tree[0]&&tree[0].r.customer)+'</div></div>'+
    '<div class="sumcards"><div class="sc"><div class="v">'+tree.length+'</div><div class="l">총 구성 행</div></div><div class="sc"><div class="v">L'+maxLv+'</div><div class="l">최대 레벨</div></div><div class="sc"><div class="v">'+rawCnt+'</div><div class="l">원부자재 종류</div></div><div class="sc"><div class="v">'+(totCost?('₩'+Math.round(totCost).toLocaleString()):'-')+'</div><div class="l">1대 소요 금액</div></div></div>'+
    '<table id="bomtbl"><thead><tr><th>레벨</th><th>품번</th><th>품명</th><th>유형</th><th>소요량</th><th>누적소요</th>'+colHead()+'</tr></thead><tbody>'+rows+'</tbody></table>';
}
function selectRev(pn){
  CUR=pn;renderRevList();
  var it=IMAP[pn]||{};
  var us=LINKS.filter(function(l){return l.partNo===pn&&l.level>0;});
  var byFin={};us.forEach(function(l){(byFin[l.finishedPartNo]=byFin[l.finishedPartNo]||[]).push(l);});
  var finPns=Object.keys(byFin).sort();
  var totQty=us.reduce(function(s,l){return s+(+l.qty||0);},0);
  var rows=finPns.map(function(fp){var fit=IMAP[fp]||{};var arr=byFin[fp];
    return arr.map(function(l,i){return '<tr><td class="pn">'+(i===0?fp:'')+'</td><td>'+(i===0?esc(fit.partName||'-'):'')+'</td><td><span class="lv-pill">L'+l.level+'</span></td><td class="pn" style="color:#64748b">'+esc(l.parentPartNo)+'</td><td class="qty">'+(+l.qty||0)+'</td><td style="color:#475569">'+esc(l.carModel)+'</td><td style="color:#475569">'+esc(l.customer)+'</td></tr>';}).join('');
  }).join('');
  document.getElementById('main').innerHTML=
    '<div class="mhead"><h2>'+pn+' <span style="font-size:12px">'+typeBadge(it.type)+'</span></h2><div class="d">'+esc(it.partName)+(it.spec?('  ·  '+esc(it.spec)):'')+(it.supplier?('  ·  공급:'+esc(it.supplier)):'')+(it.unitPrice?('  ·  단가 '+it.unitPrice.toLocaleString()):'')+'</div></div>'+
    '<div class="sumcards"><div class="sc"><div class="v">'+finPns.length+'</div><div class="l">사용 완제품 수</div></div><div class="sc"><div class="v">'+us.length+'</div><div class="l">총 사용 위치</div></div><div class="sc"><div class="v">'+(Math.round(totQty*1000)/1000)+'</div><div class="l">소요량 합계</div></div></div>'+
    (us.length?('<table id="bomtbl"><thead><tr><th>완제품 품번</th><th>완제품 품명</th><th>사용 레벨</th><th>직상위 품번</th><th>소요량</th><th>차종</th><th>고객</th></tr></thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">이 부품을 사용하는 완제품이 없습니다.</div>');
}

function setMode(m){
  MODE=m;CUR=null;
  document.getElementById('m-fwd').className=(m==='fwd'?'on':'');
  document.getElementById('m-rev').className=(m==='rev'?'on':'');
  document.getElementById('side-h').firstChild.textContent=(m==='fwd'?'완제품 목록 ':'부품 목록(역전개) ');
  document.getElementById('q').placeholder=(m==='fwd'?'🔍 완제품 품번·품명':'🔍 부품 품번·품명');
  document.getElementById('lbl-type').style.display=(m==='rev'?'':'none');
  document.getElementById('f-type').style.display=(m==='rev'?'':'none');
  document.getElementById('main').innerHTML='<div class="empty">← 왼쪽에서 '+(m==='fwd'?'완제품':'부품')+'을 선택하세요.</div>';
  rerenderList();
}
function clearFilters(){document.getElementById('q').value='';document.getElementById('f-car').value='';document.getElementById('f-cust').value='';document.getElementById('f-type').value='';rerenderList();}
function renderColMenu(){document.getElementById('colmenu').innerHTML=COLS.map(function(c,i){return '<label><input type="checkbox" '+(c.on?'checked':'')+' onchange="COLS['+i+'].on=this.checked;if(CUR&&MODE===\''+'fwd'+'\')selectF(CUR)">'+c.l+'</label>';}).join('');}
function toggleCol(e){e.stopPropagation();document.getElementById('colmenu').classList.toggle('show');}
document.addEventListener('click',function(){document.getElementById('colmenu').classList.remove('show');});
function printBom(){window.print();}
function excelBom(){if(!document.getElementById('bomtbl')){alert('먼저 항목을 선택하세요.');return;}var tbl=document.getElementById('bomtbl').outerHTML;var html='<html><head><meta charset="UTF-8"></head><body><h3>'+CUR+' '+(MODE==='fwd'?'BOM 정전개':'역전개(사용처)')+'</h3>'+tbl+'</body></html>';var blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(MODE==='fwd'?'BOM_':'WhereUsed_')+CUR+'.xls';a.click();}
function setStats(){document.getElementById('s-fin').textContent=finishedList().length;document.getElementById('s-link').textContent=LINKS.length;document.getElementById('s-item').textContent=ITEMS.length;}
function extractArr(txt,name){try{var i=txt.indexOf('const '+name);if(i<0)return null;var j=txt.indexOf('[',i);var depth=0,k=j;for(;k<txt.length;k++){var c=txt[k];if(c==='[')depth++;else if(c===']'){depth--;if(depth===0)break;}}return JSON.parse(txt.slice(j,k+1));}catch(e){return null;}}
function refreshAll(){reindex();setStats();populateFilters();renderColMenu();rerenderList();}
function boot(){
  refreshAll();
  fetch('_archive/도면관리.html').then(function(r){return r.text();}).then(function(t){
    var it=extractArr(t,'BOM_ITEMS_RAW'),lk=extractArr(t,'BOM_LINKS_RAW');var sy=document.getElementById('sync');
    if(it&&lk&&it.length&&lk.length){ITEMS=it;LINKS=lk;refreshAll();sy.textContent='● 도면관리 동기화됨 ('+ITEMS.length+'품목/'+LINKS.length+'BOM)';sy.style.background='#166534';}
    else sy.textContent='● 내장 스냅샷 사용';
  }).catch(function(){document.getElementById('sync').textContent='● 내장 스냅샷 사용';});
}
boot();
</script>
