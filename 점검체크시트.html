<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설비·안전·소방 정기점검 체크시트 · 승정</title>
<style>
:root{--navy:#0b3d5c;--teal:#0d6e8c;--gold:#F5A623;--bg:#eef1f6;--card:#fff;--line:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#1c2430;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#123a52,#0d6e8c);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:16px;font-weight:800}
.spacer{flex:1}
.cloud{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);font-weight:600}
.cloud.on{background:#1e8e4e}.cloud.off{background:#7a8699}
.status{font-size:12px;opacity:.95}
.editbtn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.editbtn.on{background:#22c55e;color:#fff}
.savebtn{background:var(--gold);color:#3a2a00;border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.prnbtn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.wrap{padding:12px 18px 40px}
.tabbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tabbtn{border:1.5px solid #b9cede;background:#fff;color:#4a6072;font-family:inherit;font-size:13px;font-weight:800;padding:9px 15px;border-radius:9px;cursor:pointer}
.tabbtn:hover{border-color:var(--teal);color:var(--teal)}
.tabbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.meta{display:flex;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;align-items:center}
.meta label{font-size:12px;color:var(--mut);font-weight:700;margin-right:4px}
.meta input,.meta select{padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px;font-family:inherit}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:9px;padding:7px 12px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:600}.kpi .v{font-size:19px;font-weight:800;color:var(--navy);margin-top:1px}
.kpi.g{border-left-color:#1e8e4e}.kpi.g .v{color:#1e8e4e}.kpi.o{border-left-color:var(--gold)}.kpi.o .v{color:#b8860b}.kpi.r{border-left-color:#C62828}.kpi.r .v{color:#C62828}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.ptitle{font-size:15px;font-weight:800;color:var(--navy)}
.addbtn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.ghostbtn{background:#fff;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:920px}
th{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;padding:8px 5px;white-space:nowrap;position:sticky;top:0;border-right:1px solid #1c5568}
td{border-bottom:1px solid var(--line);border-right:1px solid #eef1f5;padding:5px 6px;vertical-align:middle;font-size:12.5px}
th:last-child,td:last-child{border-right:0}
tr:nth-child(even) td{background:#f8fafc}
td.no{text-align:center;color:var(--mut);font-weight:700;width:34px}
td.item{font-weight:700;color:var(--navy)}
td.std{color:#555;font-size:11.5px}
[contenteditable=true]{outline:1px dotted #f0b84a;border-radius:3px;background:#fffef5}
select.rsel{padding:5px 4px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px;font-family:inherit;font-weight:800;width:100%}
select.rsel.r-양호{color:#1e8e4e}select.rsel.r-주의{color:#B8860B}select.rsel.r-불량{color:#C62828}select.rsel.r-해당없음{color:#94a3b8}
tr.bad td{background:#fdeeee}
input.f{width:100%;box-sizing:border-box;padding:5px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:inherit}
.delx{background:#fff;color:#C62828;border:1px solid #E0A0A0;border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer;font-weight:700}
.hint{font-size:11.5px;color:var(--mut);margin-top:8px}
/* 레이아웃 */
.layctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.laybox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:auto;background:#f4f6f8;max-height:640px}
.layimg{display:block;max-width:100%}
.layimg.pinmode{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);z-index:5;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .dot{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#C62828;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin .dot b{transform:rotate(45deg);color:#fff;font-size:12px;font-weight:800}
.pin.설비 .dot{background:#1565c0}.pin.안전 .dot{background:#e08a00}.pin.소방 .dot{background:#C62828}
.pinlist{margin-top:10px}
.pinlist table{min-width:600px}
.emptylay{padding:40px;text-align:center;color:#94a3b8;font-size:13px}
/* 대시보드 */
.dashgrid{display:grid;grid-template-columns:1fr;gap:12px}
.chartcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.chartcard h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .nm{width:70px;font-weight:800;font-size:13px}
.bar .track{flex:1;height:24px;background:#eef1f5;border-radius:6px;overflow:hidden;display:flex}
.bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.seg.g{background:#1e8e4e}.seg.o{background:#F5A623}.seg.r{background:#C62828}
.acttbl th{background:#7a1f2b}
.printhead{display:none}.rpt-foot{display:none}
@media print{
 @page{size:A4 portrait;margin:9mm}
 header,.tabbar,.strip,.savebtn,.prnbtn,.editbtn,.cloud,.status,.hint,.phead,.addbtn,.ghostbtn,.delx{display:none!important}
 .wrap{padding:0}.meta{border:0;padding:0;margin-bottom:6px}
 .printhead{display:block;margin-bottom:8px}
 .rpt-title{text-align:center;font-size:19px;font-weight:800;letter-spacing:2px}
 .rpt-sub{text-align:center;font-size:11px;color:#444;margin:3px 0 8px}
 .gyeolja{float:right;border-collapse:collapse}
 .gyeolja td{border:1px solid #333;text-align:center;font-size:9px;padding:2px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .gyeolja td.gh{background:#eef2f5!important;color:#111!important;font-weight:700}.gyeolja td.sg{height:40px;width:56px}
 .card{border:0;padding:0}.tbl-wrap{overflow:visible!important;border:1px solid #888}
 table{min-width:0!important}
 th{background:#0b3d5c!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9px;padding:4px 3px}
 td{padding:3px 4px;font-size:9px}
 select.rsel,input.f{border:0!important;background:transparent!important;font-size:9px!important;padding:1px!important;-webkit-appearance:none;appearance:none}
 tr.bad td{background:#fdeeee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .rpt-foot{display:block;text-align:right;font-size:9px;color:#666;margin-top:8px}
}
</style></head><body>

 var dl=cat==='설비'?'eqdl':'locdl';
 var h='<div class="card"><div class="phead"><span class="ptitle">'+(TABS.find(function(t){return t[0]===cat;})[1])+' 항목</span>'+(EDIT?'<button class="addbtn" onclick="addItem(\''+cat+'\')">＋ 항목 추가</button>':'')+'<span class="spacer"></span></div>';
 h+='<div class="tbl-wrap"><table><tr><th class="no">No</th><th>점검 항목</th><th>점검 기준</th><th style="width:124px">'+locHdr(cat)+'</th><th style="width:96px">결과</th><th style="width:150px">조치사항</th><th style="width:88px">조치자</th><th style="width:120px">조치일자</th>'+(EDIT?'<th style="width:34px">삭제</th>':'')+'</tr>';
 items.forEach(function(it,i){var r=res[i]||{r:'양호',a:'',loc:'',actBy:'',actDate:''};
  h+='<tr class="'+(r.r==='불량'?'bad':'')+'"><td class="no">'+(i+1)+'</td>'+
   '<td class="item"'+(EDIT?' contenteditable="true" oninput="edItem(\''+cat+'\','+i+',\'t\',this.innerText)"':'')+'>'+esc(it.t)+'</td>'+
   '<td class="std"'+(EDIT?' contenteditable="true" oninput="edItem(\''+cat+'\','+i+',\'b\',this.innerText)"':'')+'>'+esc(it.b)+'</td>'+
   '<td><input class="f" list="'+dl+'" value="'+esc(r.loc)+'" oninput="setLoc(\''+cat+'\','+i+',this.value)" placeholder="'+(cat==='설비'?'호기/설비':'위치')+'"></td>'+
   '<td><select class="rsel r-'+r.r+'" onchange="setRes(\''+cat+'\','+i+',this.value)">'+RES.map(function(o){return '<option'+(r.r===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></td>'+
   '<td><input class="f" value="'+esc(r.a)+'" oninput="setAct(\''+cat+'\','+i+',this.value)" placeholder="조치·비고"></td>'+
   '<td><input class="f" value="'+esc(r.actBy)+'" oninput="setActBy(\''+cat+'\','+i+',this.value)" placeholder="조치자"></td>'+
   '<td><input class="f" type="date" value="'+esc(r.actDate)+'" onchange="setActDate(\''+cat+'\','+i+',this.value)"></td>'+
   (EDIT?'<td style="text-align:center"><button class="delx" onclick="delItem(\''+cat+'\','+i+')">✕</button></td>':'')+'</tr>';
 });
 h+='</table></div><div class="hint">결과 <b>불량/주의</b> 항목은 <b>'+locHdr(cat)+'</b>과 <b>조치사항</b>을 입력하세요. 위치는 🏭 LAY-OUT 탭에서 도면에 핀으로 표시할 수 있습니다.</div></div>';
 el('body').innerHTML=h;
}
function setRes(c,i,v){DATA.res[c][i].r=v;markDirty();renderCheck(c);}
function setAct(c,i,v){DATA.res[c][i].a=v;markDirty();}
function setActBy(c,i,v){DATA.res[c][i].actBy=v;markDirty();}
function setActDate(c,i,v){DATA.res[c][i].actDate=v;markDirty();}
function setLoc(c,i,v){DATA.res[c][i].loc=v;markDirty();}
function edItem(c,i,f,v){DATA.items[c][i][f]=v;markDirty();}
function addItem(c){DATA.items[c].push({t:'새 점검항목',b:'점검 기준 입력'});DATA.res[c].push({r:'양호',a:'',loc:'',actBy:'',actDate:''});markDirty();renderCheck(c);}
function delItem(c,i){if(!confirm('이 점검항목을 삭제할까요?'))return;DATA.items[c].splice(i,1);DATA.res[c].splice(i,1);markDirty();renderCheck(c);}
/* ===== 공장 LAY-OUT ===== */
function renderLayout(){
 el('strip').innerHTML='';
 var L=DATA.layout;
 var h='<div class="card"><div class="phead"><span class="ptitle">🏭 공장 LAY-OUT · 발생위치 표시</span><span class="spacer"></span>'+
  '<button class="ghostbtn" onclick="pickLayout()">🖼️ 도면 업로드/교체</button>'+
  (L.img?('<button class="'+(PINMODE?'addbtn':'ghostbtn')+'" onclick="togglePin()">📍 '+(PINMODE?'핀 추가중(클릭)…끄기':'발생위치 핀 추가')+'</button>'):'')+'</div>';
 if(!L.img){h+='<div class="emptylay">🖼️ 공장 도면(사진·이미지)을 업로드하세요.<br>업로드 후 <b>📍 발생위치 핀 추가</b>로 도면 위에 위치를 표시할 수 있습니다.</div>';}
 else{
  h+='<div class="layctrl"><span style="font-size:12px;color:#64748b">📍 파랑=설비 · 주황=안전 · 빨강=소방 · 도면 클릭하면 핀 추가 · 핀/아래 목록에서 내용 편집·삭제</span></div>';
  h+='<div class="laybox" id="laybox"><img class="layimg'+(PINMODE?' pinmode':'')+'" id="layimg" src="'+L.img+'" onclick="layClick(event)">';
  L.pins.forEach(function(p,i){h+='<div class="pin '+(p.cat||'소방')+'" style="left:'+p.x+'%;top:'+p.y+'%" onclick="pinClick('+i+')"><div class="dot"><b>'+(i+1)+'</b></div></div>';});
  h+='</div>';
  h+='<div class="pinlist"><div class="tbl-wrap"><table><tr><th class="no">번호</th><th style="width:90px">구분</th><th>발생위치 / 내용</th><th style="width:44px">삭제</th></tr>';
  if(!L.pins.length)h+='<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:16px">핀이 없습니다. 도면을 클릭해 발생위치를 표시하세요.</td></tr>';
  L.pins.forEach(function(p,i){h+='<tr><td class="no">'+(i+1)+'</td>'+
    '<td><select class="rsel" onchange="edPin('+i+',\'cat\',this.value)"><option'+(p.cat==='설비'?' selected':'')+'>설비</option><option'+(p.cat==='안전'?' selected':'')+'>안전</option><option'+(p.cat==='소방'?' selected':'')+'>소방</option></select></td>'+
    '<td><input class="f" value="'+esc(p.label)+'" oninput="edPin('+i+',\'label\',this.value)" placeholder="예: 수직3호기 유압누유"></td>'+
    '<td style="text-align:center"><button class="delx" onclick="delPin('+i+')">✕</button></td></tr>';});
  h+='</table></div></div>';
 }
 h+='<div class="hint">발생위치 핀은 저장 시 도면 이미지와 함께 전 PC에 공유됩니다. 점검에서 불량이 난 설비/위치를 도면에 찍어두면 한눈에 파악됩니다.</div></div>';
 el('body').innerHTML=h;
}
function pickLayout(){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){DATA.layout.img=rd.result;markDirty();renderLayout();};rd.readAsDataURL(f);};inp.click();}
function togglePin(){PINMODE=!PINMODE;renderLayout();}
function layClick(e){if(!PINMODE)return;var img=el('layimg');var r=img.getBoundingClientRect();var x=((e.clientX-r.left)/r.width*100);var y=((e.clientY-r.top)/r.height*100);DATA.layout.pins.push({x:Math.round(x*10)/10,y:Math.round(y*10)/10,cat:'소방',label:'발생위치 '+(DATA.layout.pins.length+1)});markDirty();renderLayout();}
function pinClick(i){var p=DATA.layout.pins[i];var v=prompt('발생위치/내용 입력 (취소=변경없음)',p.label);if(v!=null){p.label=v;markDirty();renderLayout();}}
function edPin(i,f,v){DATA.layout.pins[i][f]=v;markDirty();if(f==='cat')renderLayout();}
function delPin(i){DATA.layout.pins.splice(i,1);markDirty();renderLayout();}
/* ===== 대시보드 ===== */
function renderDash(){
 el('strip').innerHTML='';
 var tot=0,tg=0,tw=0,tb=0,acts=[];
 CATS.forEach(function(c){DATA.res[c].forEach(function(x,i){tot++;if(x.r==='양호')tg++;else if(x.r==='주의')tw++;else if(x.r==='불량')tb++;if(x.r==='불량'||x.r==='주의')acts.push({c:c,item:DATA.items[c][i].t,loc:x.loc,r:x.r,a:x.a,actBy:x.actBy,actDate:x.actDate});});});
 var rate=tot?Math.round((tot-tw-tb)/tot*100):0;
 el('strip').innerHTML='<div class="kpi"><div class="l">총 점검항목</div><div class="v">'+tot+'</div></div>'+
  '<div class="kpi g"><div class="l">양호</div><div class="v">'+tg+'</div></div>'+
  '<div class="kpi o"><div class="l">주의</div><div class="v">'+tw+'</div></div>'+
  '<div class="kpi r"><div class="l">불량</div><div class="v">'+tb+'</div></div>'+
  '<div class="kpi"><div class="l">양호율</div><div class="v">'+rate+'%</div></div>';
 var h='<div class="dashgrid">';
 h+='<div class="chartcard"><h3>📊 구분별 점검결과 분포</h3>';
 CATS.forEach(function(c){var r=DATA.res[c],g=0,w=0,b=0;r.forEach(function(x){if(x.r==='양호')g++;else if(x.r==='주의')w++;else if(x.r==='불량')b++;});var t=Math.max(1,g+w+b);
  h+='<div class="bar"><div class="nm">'+({설비:'🔧 설비',안전:'🦺 안전',소방:'🔥 소방'}[c])+'</div><div class="track">'+
   (g?'<div class="seg g" style="width:'+(g/t*100)+'%">'+g+'</div>':'')+
   (w?'<div class="seg o" style="width:'+(w/t*100)+'%">'+w+'</div>':'')+
   (b?'<div class="seg r" style="width:'+(b/t*100)+'%">'+b+'</div>':'')+'</div></div>';});
 h+='<div style="font-size:11.5px;color:#64748b;margin-top:4px">■ <span style="color:#1e8e4e">양호</span> ■ <span style="color:#b8860b">주의</span> ■ <span style="color:#C62828">불량</span></div></div>';
 h+='<div class="chartcard"><h3>🛠️ 조치 필요 내역 ('+acts.length+'건) <span style="font-size:11.5px;color:#64748b;font-weight:400">· 불량/주의 항목</span></h3>';
 h+='<div class="tbl-wrap"><table class="acttbl"><tr><th style="width:60px">항목분류</th><th>점검항목</th><th style="width:120px">위치/설비</th><th style="width:64px">결과</th><th>조치사항</th><th style="width:80px">조치자</th><th style="width:100px">조치일자</th></tr>';
 if(!acts.length)h+='<tr><td colspan="7" style="text-align:center;color:#1e8e4e;padding:18px;font-weight:800">✅ 이상 항목 없음 (전체 양호)</td></tr>';
 acts.sort(function(a,b){return (a.r==='불량'?0:1)-(b.r==='불량'?0:1);});
 acts.forEach(function(a){h+='<tr class="'+(a.r==='불량'?'bad':'')+'"><td style="text-align:center;font-weight:700">'+a.c+'</td><td class="item">'+esc(a.item)+'</td><td>'+esc(a.loc||'-')+'</td><td style="text-align:center;font-weight:800;color:'+(a.r==='불량'?'#C62828':'#B8860B')+'">'+a.r+'</td><td>'+esc(a.a||'(조치 미입력)')+'</td><td>'+esc(a.actBy||'-')+'</td><td>'+esc(a.actDate||'-')+'</td></tr>';});
 h+='</table></div></div>';
 h+='</div>';
 el('body').innerHTML=h;
}
/* ===== 저장·인쇄·부팅 ===== */
function pullMeta(){DATA.date=el('m_date').value;DATA.cycle=el('m_cycle').value;DATA.insp=el('m_insp').value;DATA.conf=el('m_conf').value;}
function doPrint(){
 pullMeta();
 var isCat=CATS.indexOf(TAB)>=0;var title=isCat?((TABS.find(function(t){return t[0]===TAB;})[1]).replace(/^[^가-힣]+/,'').trim()+' 정기점검 체크시트'):(TAB==='dash'?'정기점검 대시보드':'공장 LAY-OUT');
 var html='<table class="gyeolja"><tr><td class="gh">점검자</td><td class="gh">부서장</td><td class="gh">대표이사</td></tr><tr><td class="sg"></td><td class="sg"></td><td class="sg"></td></tr></table>'
  +'<div class="rpt-title">'+title+'</div>'
  +'<div class="rpt-sub">㈜승정 · 점검일 '+(DATA.date||today())+' · 주기 '+DATA.cycle+' · 점검자 '+(DATA.insp||'')+' · 확인자 '+(DATA.conf||'')+'</div>';
 el('printhead').innerHTML=html;var rf=el('rptfoot');if(rf)rf.textContent='㈜승정 · 설비·안전·소방 정기점검 · 출력 '+today();
 window.print();
}
function normalize(v){var d={date:'',cycle:'일일',insp:'',conf:'',items:{},res:{},layout:{img:'',pins:[]}};if(v&&typeof v==='object'){d.date=v.date||'';d.cycle=v.cycle||'일일';d.insp=v.insp||'';d.conf=v.conf||'';if(v.items)d.items=v.items;if(v.res)d.res=v.res;if(v.layout)d.layout=v.layout;}return d;}
async function save(){
 pullMeta();stat('저장 중…');try{localStorage.setItem(LSKEY,JSON.stringify(DATA));}catch(e){}
 var ok=false;if(sb){try{var r=await sb.from('app_state').upsert({key:CKEY,value:DATA,updated_at:new Date().toISOString()});ok=!(r&&r.error);if(r&&r.error)console.warn(r.error.message);}catch(e){console.warn(e);}}
 dirty=false;stat(ok?'✅ 저장됨 (전 PC 공유)':'💾 저장됨 (이 PC)');
}
async function boot(){
 el('eqdl').innerHTML=EQLIST.map(function(e){return '<option>'+esc(e)+'</option>';}).join('');
 ensure();
 try{var s=JSON.parse(localStorage.getItem(LSKEY));if(s){DATA=normalize(s);ensure();}}catch(e){}
 try{var p=new URLSearchParams(location.search).get('cat');if(p&&(CATS.indexOf(p)>=0||p==='layout'||p==='dash'))TAB=p;}catch(e){}
 render();
 if(!sb){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');return;}
 try{var probe=await sb.from('app_state').select('key').limit(1);if(probe&&probe.error){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');return;}
  el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';
  var r=await sb.from('app_state').select('value').eq('key',CKEY).maybeSingle();
  if(r&&r.data&&r.data.value&&!dirty){DATA=normalize(r.data.value);ensure();render();stat('☁️ 클라우드에서 불러옴');}else stat('준비됨');
  try{ sb.channel('safeins2').on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'key=eq.'+CKEY},p=>{if(dirty)return;var v=p&&p.new&&p.new.value;if(v){DATA=normalize(v);ensure();render();stat('☁️ 다른 PC 변경 반영됨');}}).subscribe(); }catch(e){}
 }catch(e){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');}
}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
boot();
</script>
</body></html>
