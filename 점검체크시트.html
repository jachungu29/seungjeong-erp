table{border-collapse:collapse;width:100%;min-width:840px}
th{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:8px 6px;white-space:nowrap;position:sticky;top:0;border-right:1px solid #1c5568}

th:last-child,td:last-child{border-right:0}
tr:nth-child(even) td{background:#f8fafc}
td.no{text-align:center;color:var(--mut);font-weight:700;width:36px}
td.item{font-weight:700;color:var(--navy)}

tr.bad td{background:#fdeeee}
input.act{width:100%;box-sizing:border-box;padding:5px 7px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:inherit}

}

  +'<div class="rpt-sub">㈜승정 · 점검일 '+(DATA.date||today())+' · 주기 '+DATA.cycle+' · 점검자 '+(DATA.insp||'')+' · 확인자 '+(DATA.conf||'')+'  |  양호 '+g+' · 주의 '+w+' · 불량 '+b+'</div>';
 el('printhead').innerHTML=html;
 var rf=el('rptfoot');if(rf)rf.textContent='㈜승정 · 설비·안전·소방 정기점검 · 출력 '+today();
 window.print();
}
function normalize(v){var d={date:'',cycle:'일일',insp:'',conf:'',res:{설비:[],안전:[],소방:[]}};if(v&&typeof v==='object'){d.date=v.date||'';d.cycle=v.cycle||'일일';d.insp=v.insp||'';d.conf=v.conf||'';if(v.res)['설비','안전','소방'].forEach(function(c){if(Array.isArray(v.res[c]))d.res[c]=v.res[c];});}return d;}
async function save(){
 DATA.date=el('m_date').value;DATA.cycle=el('m_cycle').value;DATA.insp=el('m_insp').value;DATA.conf=el('m_conf').value;
 stat('저장 중…');try{localStorage.setItem(LSKEY,JSON.stringify(DATA));}catch(e){}
 var ok=false;if(sb){try{var r=await sb.from('app_state').upsert({key:CKEY,value:DATA,updated_at:new Date().toISOString()});ok=!(r&&r.error);}catch(e){}}
 dirty=false;stat(ok?'✅ 저장됨 (전 PC 공유)':'💾 저장됨 (이 PC)');
}
async function boot(){
 initRes();
 try{var s=JSON.parse(localStorage.getItem(LSKEY));if(s){DATA=normalize(s);initRes();}}catch(e){}
 try{var p=new URLSearchParams(location.search).get('cat');if(p&&ITEMS[p])CAT=p;}catch(e){}
 render();
 if(!sb){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');return;}
 try{var probe=await sb.from('app_state').select('key').limit(1);if(probe&&probe.error){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');return;}
  el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';
  var r=await sb.from('app_state').select('value').eq('key',CKEY).maybeSingle();
  if(r&&r.data&&r.data.value&&!dirty){DATA=normalize(r.data.value);initRes();render();stat('☁️ 클라우드에서 불러옴');}else stat('준비됨');
  try{ sb.channel('safeins').on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'key=eq.'+CKEY},p=>{if(dirty)return;var v=p&&p.new&&p.new.value;if(v){DATA=normalize(v);initRes();render();stat('☁️ 다른 PC 변경 반영됨');}}).subscribe(); }catch(e){}
 }catch(e){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';stat('준비됨 (이 PC 저장)');}
}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
boot();
</script>
</body></html>
