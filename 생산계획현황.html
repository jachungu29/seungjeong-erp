<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>㈜승정 · 생산계획현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#003D54;--teal:#006E8A;--teal2:#00A8C8;--cyan-light:#E0F7FC;--cyan-bg:#B2EBF2;--gold:#F5A623;--gray1:#F5F9FA;--gray2:#E8EDEF;--gray3:#B0BEC5;--text:#1A2A30;--text2:#4A6572;--red:#C62828;--green:#2E7D32;--shadow:0 2px 8px rgba(0,61,84,.12);--shadow-lg:0 8px 24px rgba(0,61,84,.18);--radius:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh}
.app-header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg)}
.app-logo{display:flex;align-items:center;gap:12px}
.app-logo-icon{width:38px;height:38px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--navy)}
.app-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
.app-title .rev{font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:5px;margin-left:8px;font-weight:600;vertical-align:middle}
.app-subtitle{font-size:11px;opacity:.75;margin-top:1px}
.header-date{font-size:12px;opacity:.85}
.main-nav{background:#fff;border-bottom:2px solid var(--cyan-bg);display:flex;padding:0 20px;position:sticky;top:58px;z-index:99;box-shadow:0 2px 4px rgba(0,0,0,.06);overflow-x:auto}
.nav-tab{padding:13px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--teal);background:var(--cyan-light)}
.nav-tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.wrap{max-width:1500px;margin:0 auto;padding:18px}
.view{display:none}.view.active{display:block}
.subnav{display:flex;gap:6px;margin-bottom:14px;background:#fff;padding:6px;border-radius:10px;box-shadow:var(--shadow);width:fit-content}
.subtab{border:none;background:transparent;padding:8px 18px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:.15s}
.subtab:hover{background:var(--cyan-light);color:var(--teal)}
.subtab.active{background:var(--teal);color:#fff}
.subview{display:none}.subview.active{display:block}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:13px 16px;border-left:4px solid var(--teal2);box-shadow:var(--shadow);display:flex;flex-direction:column}
.stat-card.gold{border-color:var(--gold)}.stat-card.navy{border-color:var(--navy)}.stat-card.green{border-color:var(--green)}
.stat-label{font-size:10.5px;font-weight:600;color:var(--text2);letter-spacing:.3px}
.stat-value{font-size:23px;font-weight:900;color:var(--navy);margin-top:3px;line-height:1.1}
.stat-value.sm{font-size:18px}
.stat-unit{font-size:10.5px;color:var(--text2);margin-top:1px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-header{background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-sub{font-size:11px;opacity:.75}
.card-body{padding:14px 16px}
.tbl-wrap{overflow:auto;max-height:70vh}
table.pt{width:100%;border-collapse:collapse;font-size:12px}
.pt th{background:var(--teal);color:#fff;padding:9px 8px;font-weight:600;font-size:11.5px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:5}
.tbl-wrap::-webkit-scrollbar{height:14px;width:13px}
.tbl-wrap::-webkit-scrollbar-thumb{background:#7f97b5;border-radius:8px;border:3px solid #eef2f7}
.tbl-wrap::-webkit-scrollbar-thumb:hover{background:#5f7a9c}
.tbl-wrap::-webkit-scrollbar-track{background:#eef2f7}
.pt th.wk{background:var(--teal2)}.pt th.ref{background:#5B8AA6}
.pt td{padding:6px 9px;border:1px solid var(--gray2);text-align:center;white-space:nowrap}
.pt td.l{text-align:left}.pt td.r{text-align:right;font-variant-numeric:tabular-nums}
.pt td.ref{background:#F4F8Fa;color:var(--text2);font-size:11px}
.pt tr.clickrow{cursor:pointer}
.pt tr.clickrow:hover td{background:rgba(245,166,35,.10)}
.pt tr.clickrow td.nmcell::before{content:"▸ ";color:var(--gold);font-weight:900}
.pt td.ho{background:var(--cyan-bg);font-weight:700;color:var(--navy);text-align:left}
.pt td.ho.hoclick{cursor:pointer}.pt td.ho.hoclick:hover{background:#93D3E4}
.hohint{display:block;font-size:9.5px;color:var(--teal);font-weight:600;margin-top:2px}
.caltbl{font-size:11px}
.caltbl th.calh{min-width:32px;padding:4px 2px;font-size:10px;line-height:1.1}
.caltbl th.we,.caltbl td.we{background:#EFF1F4;color:var(--gray3)}
.caltbl td.calc{padding:2px}
.calin{width:38px;padding:3px 2px;border:1px solid var(--gray2);border-radius:3px;text-align:right;font-size:10.5px;font-family:inherit;color:var(--navy);font-weight:600;background:#fff}
.calin:focus{outline:none;border-color:var(--gold);background:#FFFdF2}
.calin.hin{width:42px;border-color:#F0C070;background:#FFFDF6}
.calscroll{border:1px solid var(--gray2);border-radius:8px;max-width:100%;margin-bottom:6px}
.calin.cin{width:44px;border-color:#8AB6D6;background:#EAF3FB}
.prisel{display:inline-flex;gap:2px;margin-right:5px;vertical-align:middle}
.pribtn{width:18px;height:18px;border:1px solid var(--gray3);background:#fff;color:var(--text2);border-radius:4px;font-size:10px;font-weight:800;cursor:pointer;padding:0;line-height:1}
.pribtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pribadge{display:inline-block;min-width:15px;text-align:center;background:var(--gold);color:var(--navy);border-radius:4px;font-size:10px;font-weight:800;padding:1px 4px;margin-right:4px}
.caltbl tr.caprow td{background:#E3EEF7;font-weight:700;color:var(--navy)}
.caltbl tr.caprow td.calc{background:#E3EEF7}
.caltbl tr.setuprow td{background:#FFF0E0;font-weight:700;color:#8A5000;font-size:10px}
.pt tr.wdrow td{background:#E8F5E9;font-weight:800;color:#2E7D32;border-top:2px solid #A5D6A7}
tr.shdrow td{background:#FFF6E0;font-weight:700;color:#B8860B}
tr.shdrow td.l{color:#B8860B}
tr.shnrow td{background:#EDE7F6;font-weight:700;color:#4527A0}
tr.shnrow td.l{color:#4527A0}
input.wrkin{width:46px;padding:2px 3px;border:1px solid #cbd5e1;border-radius:4px;font-size:10.5px;font-family:inherit;text-align:center;background:#fff;color:var(--text)}
tr.shdrow input.wrkin{border-color:#E6C200;background:#FFFDF3}
tr.shnrow input.wrkin{border-color:#B39DDB;background:#FAF8FF}
input.wrkin:focus{outline:none;border-color:var(--gold);background:#FFF9EC}
.mstbl input.mstin{width:100%;box-sizing:border-box;padding:5px 7px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:var(--text)}
.mstbl input.mstin:focus{outline:none;border-color:var(--teal);background:#F5FBFD}
.mstbl select.mstsel{width:100%;padding:5px 4px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:var(--text)}
.mstbl td{padding:5px 6px;vertical-align:middle}
.mstempty{color:#94a3b8;text-align:center;padding:18px !important;font-size:12.5px}
.mstbtn{background:var(--teal);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:6px}
.mstbtn:hover{background:var(--navy)}
.mstbtn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.mstbtn.ghost:hover{background:#EAF6F9;color:var(--navy)}
button.mstdel{background:#fff;color:#C62828;border:1px solid #E0A0A0;border-radius:5px;width:26px;height:26px;font-size:12px;cursor:pointer;font-weight:700}
button.mstdel:hover{background:#FDECEC}
.dtbl input.movr{width:82px;padding:3px 5px;border:1px solid #E0C48A;border-radius:4px;font-size:11px;font-family:inherit;background:#FFFDF6;color:var(--text)}
.dtbl input.movr.u{width:44px;text-align:center}
.dtbl input.movr.n{width:66px;text-align:right;font-weight:700;color:var(--navy)}
.dtbl input.movr:focus{outline:none;border-color:var(--gold);background:#FFF9EC}
.caltbl td.qcell{background:#F5FBFC;font-weight:700;color:var(--navy)}
.caltbl th.sat{background:#4A88C7}.caltbl th.sun{background:#C86A93}
.caltbl td.sat{background:#E6F0FA}.caltbl td.qcell.sat{background:#D6E7F7}
.caltbl td.sun{background:#FBE6EF}.caltbl td.qcell.sun{background:#F6D6E4}
.caltbl td.calc.sat input{background:#F0F6FC}.caltbl td.calc.sun input{background:#FCEFF4}
.calin.sin{width:42px;border-color:#9DC3E6;background:#F2F8FD}
.caltbl tr.shrow td{background:#EEF5FB}
.caltbl tr.caprow td{background:#DCEBF6;font-weight:700;color:var(--navy)}
.calq{font-size:9px;color:var(--teal);text-align:right;margin-top:2px;font-weight:700}
.caltbl th.calh small{color:#cfe6ee}
.pt tr.sub td{background:#E8F9FD;font-weight:700;border-top:2px solid var(--teal2)}
.pt tr.grand td{background:var(--navy);color:#fff;font-weight:800;font-size:12.5px}
.pt td.qty{font-weight:700;color:var(--navy)}
.pt td.amt{font-weight:600;color:var(--teal)}
.pt td.day{font-weight:700;color:var(--gold);background:#FFFdF5}
.pt td.wkc{padding:3px 4px;background:#FbFdFe}
.pt td.sumcell{font-weight:700;color:var(--teal);text-align:right}
.pt td.diffcell{text-align:center;font-weight:700;font-size:11px}
.diffcell .ok{color:var(--green)}
.diff-pos{color:#1565C0}.diff-neg{color:var(--red)}
.wkin{width:66px;padding:4px 6px;border:1px solid var(--gray2);border-radius:5px;font-size:11.5px;text-align:right;font-family:inherit;color:var(--navy);font-weight:600;background:#fff}
.wkin:focus{outline:none;border-color:var(--teal2);background:var(--cyan-light)}
.txtin{width:92px;padding:4px 6px;border:1px solid var(--gray2);border-radius:5px;font-size:11px;font-family:inherit;color:var(--text);background:#fff}
.txtin.w{width:70px}
.txtin:focus{outline:none;border-color:var(--teal2);background:var(--cyan-light)}
.wktoolbar{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);margin-bottom:12px;flex-wrap:wrap}
.wkstatus{font-size:11.5px;color:var(--teal);font-weight:700;min-width:60px}
.btn2{border:none;border-radius:7px;padding:8px 16px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.btn2.save{background:var(--gold);color:var(--navy)}.btn2.save:hover{background:#e09800}
.btn2.reset{background:#fff;color:var(--text2);border:1px solid var(--gray2)}.btn2.reset:hover{background:var(--gray1)}
.btn2.reset.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn2.close{background:#eceff1;color:var(--text2)}
/* 품목 상세(주간+일일) 편집 패널 */
.detailwrap{margin-bottom:14px}
.detail{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-lg)}
.dhead{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead .pill{background:var(--cyan-bg);color:var(--navy);border-radius:20px;padding:2px 12px;font-size:12px}
.dhint{font-size:11px;color:var(--text2);font-weight:400}
.dsec{font-size:12.5px;font-weight:700;color:var(--teal);margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.dtbl{width:auto;font-size:12px;border-collapse:collapse}
.dtbl th{background:var(--teal2);color:#fff;padding:6px 10px;font-size:11px;border:1px solid rgba(255,255,255,.2)}
.dtbl td{padding:4px 6px;border:1px solid var(--gray2);text-align:center}
.dweekblock{display:inline-flex;flex-direction:column;background:var(--gray1);border:1px solid var(--gray2);border-radius:9px;padding:9px 11px;margin:0 9px 9px 0;vertical-align:top}
.dwk{font-size:11.5px;font-weight:800;color:var(--navy);margin-bottom:6px}
.ddays{display:flex;gap:6px}
.dday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text2)}
.dday small{color:var(--gray3);margin-left:1px}
.dayin{width:54px;padding:3px 4px;border:1px solid var(--gray2);border-radius:4px;text-align:right;font-size:11px;font-family:inherit;color:var(--navy);font-weight:600;background:#fff}
.dayin:focus{outline:none;border-color:var(--gold);background:#FFFdF2}
.dwsum{font-size:11px;color:var(--teal);margin-top:7px;text-align:right;font-weight:700}
.dtot{font-size:13px;font-weight:800;color:var(--navy);margin-top:10px;padding-top:9px;border-top:1px dashed var(--gray2)}
.detailrow{display:none}
.matqty{font-size:13px;font-weight:700;color:var(--navy);margin:10px 0;background:var(--cyan-light);padding:11px 14px;border-radius:8px}
.matqty input{width:110px;padding:5px 9px;border:1.5px solid var(--teal2);border-radius:6px;font-family:inherit;font-size:14px;text-align:right;font-weight:800;color:var(--navy);margin:0 4px}
.dtbl td.r{text-align:right}.dtbl td.l{text-align:left}.dtbl td.qty{font-weight:700;color:var(--navy);text-align:right}.dtbl td.amt{font-weight:700;color:var(--teal);text-align:right}
.dtbl tr.guw td{background:var(--cyan-bg);font-weight:700;color:var(--navy)}
.dtbl tr.guo td{background:#FFF6E3}
.dtbl tr.gub td{background:#fff}
.bar{height:9px;border-radius:5px;background:var(--gray2);overflow:hidden;min-width:64px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal))}
.bar.hi>i{background:linear-gradient(90deg,#66BB6A,var(--green))}
.bar.lo>i{background:linear-gradient(90deg,#FFB74D,var(--gold))}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.acctgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:820px){.acctgrid{grid-template-columns:1fr}}
.acctcard{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
.acct-h{display:flex;align-items:center;gap:8px}
.acct-ic{font-size:20px}.acct-nm{font-size:14px;font-weight:800;color:var(--navy)}
.acct-pct{margin-left:auto;font-size:16px;font-weight:900}
.acct-q{font-size:28px;font-weight:900;color:var(--navy);margin:8px 0 7px}
.acct-q small{font-size:13px;color:var(--text2);font-weight:600}
.acct-bar{height:10px;border-radius:6px;background:var(--gray2);overflow:hidden;margin-bottom:8px}
.acct-bar>i{display:block;height:100%;border-radius:6px}
.acct-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2)}
.note{font-size:11px;color:var(--text2);background:var(--cyan-light);border:1px solid var(--cyan-bg);border-radius:7px;padding:8px 12px;margin-bottom:14px}
.note.warn{background:#FFF8E1;border-color:#FFE082;color:#8A6D00}
.note.click{background:#FFF3E0;border-color:#FFCC80;color:#8A5000;font-weight:600}
footer{color:var(--gray3);font-size:11px;text-align:center;margin:26px 0 12px}
</style></head><body>
<header class="app-header">
 <div class="app-logo"><div class="app-logo-icon">承</div>
  <div><div class="app-title">생산계획현황 <span class="rev">REV.1</span></div>
  <div class="app-subtitle">㈜승정 · 사출·조립 생산계획 · 월/주/일 계획 · 설비CAPA</div></div></div>
 <div class="header-date" id="hdrDate"></div>
</header>
<nav class="main-nav">
 <div class="nav-tab active" data-v="ov" onclick="tab('ov')"><span>📊</span> 종합현황</div>
 <div class="nav-tab" data-v="inj" onclick="tab('inj')"><span>🔩</span> 사출 월계획</div>
 <div class="nav-tab" data-v="asy" onclick="tab('asy')"><span>🔧</span> 조립 월계획</div>
 <div class="nav-tab" data-v="mat" onclick="tab('mat')"><span>🧱</span> 자재소요</div>
 <div class="nav-tab" data-v="capa" onclick="tab('capa')"><span>⚙️</span> 설비 CAPA</div>
 <div class="nav-tab" data-v="mst" onclick="tab('mst')"><span>📋</span> 기준정보</div>
</nav>
<div class="wrap">
 <div class="view active" id="v-ov"></div>
 <div class="view" id="v-inj"></div>
 <div class="view" id="v-asy"></div>
 <div class="view" id="v-mat"></div>
 <div class="view" id="v-capa"></div>
 <div class="view" id="v-mst"></div>
 <footer>㈜승정 ERP · 생산계획현황 REV.1 · 원본: 7월_생산계획현황_REV.1.xlsx</footer>

function autoAlloc(view,hoName){const items=D[view].filter(it=>it.ho===hoName);ensurePri(items);
 const sorted=items.slice().sort((a,b)=>priVal(a._k)-priVal(b._k));
 const need={};sorted.forEach(it=>{need[it._k]=(it.uph>0)?it.qty/it.uph:0;});
 let prevK=null;
 CAL.forEach(c=>{if(!isWork(c.day)){items.forEach(it=>PLAN_H[it._k+':'+c.day]=0);return;}
  let capLeft=capVal(c.day);
  sorted.forEach(it=>{const k=it._k;if(need[k]<=0.001){PLAN_H[k+':'+c.day]=0;return;}
   if(prevK&&prevK!==k)capLeft-=setupBetween(prevK,k); // 전환 시 준비시간 예약
   if(capLeft<=0.001){PLAN_H[k+':'+c.day]=0;return;}
   const hr=Math.round(Math.min(need[k],capLeft)*100)/100;PLAN_H[k+':'+c.day]=hr;need[k]-=hr;capLeft-=hr;if(hr>0.001)prevK=k;});});}
function setupForHo(view,hoName){const items=D[view].filter(it=>it.ho===hoName);ensurePri(items);

function renderMST(){const box=el('v-mst');if(!box)return;
 let h=`<div class="ovhead"><h2>📋 기준정보 <span class="ovsub">작업자·설비를 등록하면 생산계획(작업자 배정 등)에 자동 반영됩니다</span></h2></div>`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">👷 작업자 마스터</div><div class="card-sub">이름·담당설비·근무조 등록 → 작업자 배정칸에서 자동완성</div><div style="flex:1"></div><button class="mstbtn" onclick="mstAddWrk()">＋ 작업자 추가</button></div>`;
 h+=`<div class="tbl-wrap"><table class="pt mstbl"><tr><th style="width:38px">#</th><th class="l">이름</th><th class="l">담당 설비</th><th style="width:90px">근무조</th><th style="width:50px">삭제</th></tr>`;
 if(!MST_WRK.length)h+=`<tr><td colspan="5" class="mstempty">등록된 작업자가 없습니다. ＋작업자 추가를 눌러 입력하세요.</td></tr>`;
 MST_WRK.forEach((w,i)=>{h+=`<tr><td>${i+1}</td><td class="l"><input class="mstin" value="${esc(w.name||'')}" oninput="mstEditWrk(${i},'name',this.value)" placeholder="작업자 이름"></td><td class="l"><input class="mstin" list="eqdl" value="${esc(w.eq||'')}" oninput="mstEditWrk(${i},'eq',this.value)" placeholder="설비 선택/입력"></td><td><select class="mstsel" onchange="mstEditWrk(${i},'shift',this.value)">${SHIFTS.map(s=>`<option${w.shift===s?' selected':''}>${s}</option>`).join('')}</select></td><td><button class="mstdel" onclick="mstDelWrk(${i})">✕</button></td></tr>`;});
 h+=`</table></div></div>`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">🏭 설비 마스터</div><div class="card-sub">호기/라인 설비명 · 계정 · 비고</div><div style="flex:1"></div><button class="mstbtn ghost" onclick="mstSeedEqBtn()">↺ 데이터에서 불러오기</button><button class="mstbtn" onclick="mstAddEq()">＋ 설비 추가</button></div>`;
 h+=`<div class="tbl-wrap"><table class="pt mstbl"><tr><th style="width:38px">#</th><th class="l">설비명</th><th style="width:110px">계정</th><th class="l">비고</th><th style="width:50px">삭제</th></tr>`;
 if(!MST_EQ.length)h+=`<tr><td colspan="5" class="mstempty">등록된 설비가 없습니다.</td></tr>`;
 MST_EQ.forEach((e,i)=>{h+=`<tr><td>${i+1}</td><td class="l"><input class="mstin" value="${esc(e.name||'')}" oninput="mstEditEq(${i},'name',this.value)" placeholder="설비명"></td><td><select class="mstsel" onchange="mstEditEq(${i},'acct',this.value)">${ACCTS.map(a=>`<option${e.acct===a?' selected':''}>${a}</option>`).join('')}</select></td><td class="l"><input class="mstin" value="${esc(e.note||'')}" oninput="mstEditEq(${i},'note',this.value)" placeholder="비고"></td><td><button class="mstdel" onclick="mstDelEq(${i})">✕</button></td></tr>`;});
 h+=`</table></div></div>`;
 h+=`<datalist id="eqdl">${eqNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`;
 box.innerHTML=h;}
function mstDirty(){DIRTY=true;status('✏️ 기준정보 수정됨 · 저장 필요');}
function mstAddWrk(){MST_WRK.push({name:'',eq:'',shift:'주간'});mstDirty();renderMST();}
function mstDelWrk(i){MST_WRK.splice(i,1);mstDirty();renderMST();}
function mstEditWrk(i,f,v){if(MST_WRK[i]){MST_WRK[i][f]=v;mstDirty();}}
function mstAddEq(){MST_EQ.push({name:'',acct:'수직사출',note:''});mstDirty();renderMST();}
function mstDelEq(i){MST_EQ.splice(i,1);mstDirty();renderMST();}
function mstEditEq(i,f,v){if(MST_EQ[i]){MST_EQ[i][f]=v;mstDirty();}}
function mstSeedEqBtn(){const cur={};MST_EQ.forEach(e=>{if(e.name)cur[e.name]=1;});mstSeedEq().forEach(s=>{if(!cur[s.name])MST_EQ.push(s);});mstDirty();renderMST();}
function tab(v){document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
 document.querySelectorAll('.view').forEach(p=>p.classList.toggle('active',p.id==='v-'+v));if(v==='mat')renderMat();if(v==='mst')renderMST();window.scrollTo(0,0);}

const INJ_COLS=[{t:'호기',k:'ho'},{t:'고객',k:'cust',cls:'l'},{t:'품명',k:'nm',cls:'l'},{t:'품번',k:'pno',cls:'l'},{t:'금형번호',special:'mold'},{t:'재질',k:'mat'},{t:'단가',k:'price',f:'cm',cls:'r'},{t:'계획수량',k:'qty',f:'cm',cls:'r qty'},{t:'목표금액',k:'amt',f:'cm',cls:'r amt'},{t:'가동율',k:'capa',f:'bar'}];
const ASY_COLS=[{t:'라인',k:'ho'},{t:'고객',k:'cust',cls:'l'},{t:'구분',k:'mat'},{t:'품명',k:'nm',cls:'l'},{t:'품번',k:'pno',cls:'l'},{t:'금형번호',special:'mold'},{t:'단가',k:'price',f:'cm',cls:'r'},{t:'계획수량',k:'qty',f:'cm',cls:'r qty'},{t:'목표금액',k:'amt',f:'cm',cls:'r amt'},{t:'가동율',k:'capa',f:'bar'}];
initW();
renderOV();
renderSection('inj',D.inj,'호기',INJ_COLS);
renderSection('asy',D.asy,'라인',ASY_COLS);
renderCAPA();
renderMat();
renderMST();
el('hdrDate').textContent='기준: 2026-07';
cloudGet(CKEY).then(cd=>{if(!cd||DIRTY)return;let ch=false;const w=cd.w||cd,t=cd.t||{},dd=cd.do||{},hh=cd.h||{};
 ['inj','asy'].forEach(v=>D[v].forEach(r=>{if(w[r._k]&&w[r._k].length===5){PLAN_W[r._k]=w[r._k].map(Number);ch=true;}if(t[r._k]){PLAN_T[r._k]={mold:t[r._k].mold||'',worker:t[r._k].worker||''};ch=true;}}));
 if(Object.keys(dd).length){Object.assign(PLAN_DO,dd);ch=true;}
 if(Object.keys(hh).length){Object.assign(PLAN_H,hh);ch=true;}
 if(cd.s&&Object.keys(cd.s).length){Object.assign(PLAN_SHIFT,cd.s);ch=true;}
 if(cd.cap&&Object.keys(cd.cap).length){Object.assign(PLAN_CAP,cd.cap);ch=true;}
 if(cd.pri&&Object.keys(cd.pri).length){Object.assign(PLAN_PRI,cd.pri);ch=true;}
 if(cd.mov&&Object.keys(cd.mov).length){Object.assign(MAT_OVR,cd.mov);ch=true;}
 if(cd.wrk&&Object.keys(cd.wrk).length){Object.assign(PLAN_WRK,cd.wrk);ch=true;}
 if(Array.isArray(cd.mwrk)){MST_WRK=cd.mwrk;ch=true;}
 if(Array.isArray(cd.meq)&&cd.meq.length){MST_EQ=cd.meq;ch=true;}
 if(ch){rerender('inj');rerender('asy');renderMST();status('☁️ 저장본 불러옴');}
});
</script>
</body></html>
