<meta name="viewport" content="width=device-width,initial-scale=1">
<title>㈜승정 · 7월 생산계획현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#003D54;--teal:#006E8A;--teal2:#00A8C8;--cyan-light:#E0F7FC;--cyan-bg:#B2EBF2;--gold:#F5A623;--gray1:#F5F9FA;--gray2:#E8EDEF;--gray3:#B0BEC5;--text:#1A2A30;--text2:#4A6572;--red:#C62828;--green:#2E7D32;--shadow:0 2px 8px rgba(0,61,84,.12);--shadow-lg:0 8px 24px rgba(0,61,84,.18);--radius:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh}
.app-header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg)}
.app-logo{display:flex;align-items:center;gap:12px}
.app-logo-icon{width:38px;height:38px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--navy)}
.app-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
.app-title .rev{font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:5px;margin-left:8px;font-weight:600;vertical-align:middle}
.app-subtitle{font-size:11px;opacity:.75;margin-top:1px}
.header-date{font-size:12px;opacity:.85}
.main-nav{background:#fff;border-bottom:2px solid var(--cyan-bg);display:flex;padding:0 20px;position:sticky;top:58px;z-index:99;box-shadow:0 2px 4px rgba(0,0,0,.06);overflow-x:auto}
.nav-tab{padding:13px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--teal);background:var(--cyan-light)}
.nav-tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.view{display:none}.view.active{display:block}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:13px 16px;border-left:4px solid var(--teal2);box-shadow:var(--shadow);display:flex;flex-direction:column}
.stat-card.gold{border-color:var(--gold)}.stat-card.navy{border-color:var(--navy)}.stat-card.green{border-color:var(--green)}
.stat-label{font-size:10.5px;font-weight:600;color:var(--text2);letter-spacing:.3px}
.stat-value{font-size:24px;font-weight:900;color:var(--navy);margin-top:3px;line-height:1.1}
.stat-value.sm{font-size:19px}
.stat-unit{font-size:10.5px;color:var(--text2);margin-top:1px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-header{background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-sub{font-size:11px;opacity:.75}
.card-body{padding:14px 16px}
.tbl-wrap{overflow-x:auto}
table.pt{width:100%;border-collapse:collapse;font-size:12px}
.pt th{background:var(--teal);color:#fff;padding:9px 8px;font-weight:600;font-size:11.5px;text-align:center;white-space:nowrap;position:sticky;top:0}
.pt td{padding:6px 9px;border:1px solid var(--gray2);text-align:center;white-space:nowrap}
.pt td.l{text-align:left}.pt td.r{text-align:right;font-variant-numeric:tabular-nums}
.pt tr:hover td{background:rgba(0,168,200,.05)}
.pt td.ho{background:var(--cyan-bg);font-weight:700;color:var(--navy);text-align:left}
.pt tr.sub td{background:#E8F9FD;font-weight:700;border-top:2px solid var(--teal2)}
.pt tr.grand td{background:var(--navy);color:#fff;font-weight:800;font-size:12.5px}
.pt td.qty{font-weight:700;color:var(--navy)}
.pt td.amt{font-weight:600;color:var(--teal)}
.bar{height:9px;border-radius:5px;background:var(--gray2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal))}
.bar.hi>i{background:linear-gradient(90deg,#66BB6A,var(--green))}
.bar.lo>i{background:linear-gradient(90deg,#FFB74D,var(--gold))}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.note{font-size:11px;color:var(--text2);background:var(--cyan-light);border:1px solid var(--cyan-bg);border-radius:7px;padding:8px 12px;margin-bottom:14px}
footer{color:var(--gray3);font-size:11px;text-align:center;margin:26px 0 12px}
</style></head><body>

 const tot=p.find(x=>x.gu.includes('합계'))||{qty:0,amt:0};
 const matTot=m.find(x=>x.gu.includes('합계'))||{amt:0};
 let h=`<div class="note">📌 <b>종합현황</b>은 회사 공식 7월 목표입니다. 아래 <b>사출·조립 월계획</b> 탭은 품목별 상세 계획(rev.1)입니다.</div>`;
 h+=`<div class="stats-strip">
  <div class="stat-card navy"><div class="stat-label">총 생산목표</div><div class="stat-value">${cm(tot.qty)}</div><div class="stat-unit">EA</div></div>
  <div class="stat-card gold"><div class="stat-label">총 목표금액</div><div class="stat-value">${eok(tot.amt)}</div><div class="stat-unit">원</div></div>
  <div class="stat-card"><div class="stat-label">사출</div><div class="stat-value sm">${cm(inj.qty)}</div><div class="stat-unit">EA · ${eok(inj.amt)}원</div></div>
  <div class="stat-card"><div class="stat-label">조립</div><div class="stat-value sm">${cm(asy.qty)}</div><div class="stat-unit">EA · ${eok(asy.amt)}원</div></div>
  <div class="stat-card green"><div class="stat-label">자재 목표금액</div><div class="stat-value sm">${eok(matTot.amt)}</div><div class="stat-unit">원</div></div>
 </div>`;
 const qmax=tot.qty||1;
 h+=`<div class="split">`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">📦 생산목표 (사출·조립)</div></div><div class="card-body">
   <table class="pt"><tr><th>구분</th><th>목표수량(EA)</th><th>목표금액(원)</th><th style="width:120px">수량 비중</th></tr>`;
 p.forEach(x=>{const g=x.gu.includes('합계');h+=`<tr${g?' class="grand"':''}><td class="l"><b>${x.gu}</b></td><td class="r qty">${cm(x.qty)}</td><td class="r amt">${cm(x.amt)}</td><td>${g?'100%':`<div class="bar"><i style="width:${(x.qty/qmax*100).toFixed(1)}%"></i></div>`}</td></tr>`;});
 h+=`</table></div></div>`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">🧱 자재목표</div></div><div class="card-body">
   <table class="pt"><tr><th>구분</th><th>자재</th><th>목표수량</th><th>목표금액(원)</th></tr>`;
 m.forEach(x=>{const g=x.gu.includes('합계');h+=`<tr${g?' class="grand"':''}><td class="l">${x.gu||''}</td><td class="l">${x.kind||''}</td><td class="r">${cm(x.qty)}</td><td class="r amt">${cm(x.amt)}</td></tr>`;});
 h+=`</table></div></div></div>`;
 el('v-ov').innerHTML=h;
}

function renderPlan(view,rows,groupKey,groupLabel,cols){
 const groups=[];const map={};
 rows.forEach(r=>{const k=r[groupKey]||'-';if(!map[k]){map[k]={key:k,items:[]};groups.push(map[k]);}map[k].items.push(r);});
 let TQ=0,TA=0;
 h=`<div class="stats-strip">
   <div class="stat-card navy"><div class="stat-label">${groupLabel} 수</div><div class="stat-value">${groups.length}</div><div class="stat-unit">개</div></div>
   <div class="stat-card"><div class="stat-label">품목 수</div><div class="stat-value">${rows.length}</div><div class="stat-unit">품목</div></div>
   <div class="stat-card gold"><div class="stat-label">계획수량 합</div><div class="stat-value sm">${cm(rows.reduce((s,r)=>s+r.qty,0))}</div><div class="stat-unit">EA</div></div>
   <div class="stat-card green"><div class="stat-label">목표금액 합</div><div class="stat-value sm">${eok(rows.reduce((s,r)=>s+r.amt,0))}</div><div class="stat-unit">원</div></div>
 </div>`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">${view==='inj'?'🔩 사출':'🔧 조립'} 월생산계획 (호기·라인별)</div><div class="card-sub">품목별 계획수량·목표금액</div></div>
  <div class="tbl-wrap"><table class="pt"><tr>${cols.map(c=>`<th>${c.t}</th>`).join('')}</tr>`;
 groups.forEach(g=>{
  let gq=0,ga=0;
  g.items.forEach((r,i)=>{
   gq+=r.qty;ga+=r.amt;
   h+='<tr>';
   cols.forEach((c,ci)=>{
    if(ci===0){ if(i===0) h+=`<td class="ho" rowspan="${g.items.length}">${g.key}</td>`; return;}
    let v=r[c.k], cls=c.cls||'';
    if(c.f==='cm')v=cm(v); else if(c.f==='pct')v=pct(v); else if(c.f==='bar'){v=`<div class="bar ${r.capa>=0.7?'hi':r.capa<0.35?'lo':''}"><i style="width:${Math.min(100,r.capa*100).toFixed(0)}%"></i></div>`;}
    h+=`<td class="${cls}">${v}</td>`;
   });
   h+='</tr>';
  });
  h+=`<tr class="sub"><td class="l" colspan="${cols.length-3}">▸ ${g.key} 소계</td><td class="r qty">${cm(gq)}</td><td class="r amt">${cm(ga)}</td><td></td></tr>`;
  TQ+=gq;TA+=ga;
 });
 h+=`<tr class="grand"><td colspan="${cols.length-3}">합계</td><td class="r">${cm(TQ)}</td><td class="r">${cm(TA)}</td><td></td></tr>`;
 h+=`</table></div></div>`;
 el('v-'+view).innerHTML=h;
}

function renderCAPA(){
 const c=D.capa;
 const avg=c.reduce((s,x)=>s+x.rate,0)/(c.length||1);
 let h=`<div class="stats-strip">
   <div class="stat-card navy"><div class="stat-label">설비(호기) 수</div><div class="stat-value">${c.length}</div><div class="stat-unit">호기</div></div>
   <div class="stat-card gold"><div class="stat-label">평균 가동율(CAPA)</div><div class="stat-value sm">${pct(avg)}</div><div class="stat-unit">전 호기 평균</div></div>
   <div class="stat-card green"><div class="stat-label">총 소요인원</div><div class="stat-value sm">${c.reduce((s,x)=>s+x.man,0).toFixed(1)}</div><div class="stat-unit">명</div></div>
 </div>`;
 h+=`<div class="card"><div class="card-header"><div class="card-title">⚙️ 사출 설비별 CAPA 현황</div><div class="card-sub">호기별 가동율·소요일수·소요인원</div></div>
  <div class="tbl-wrap"><table class="pt"><tr><th>설비(호기)</th><th>생산소요일수</th><th>소요인원</th><th>가동율(CAPA율)</th><th style="width:180px">가동율</th></tr>`;
 c.forEach(x=>{h+=`<tr><td class="l ho">${x.ho}</td><td class="r">${x.days}</td><td class="r">${x.man}</td><td class="r qty">${pct(x.rate)}</td>
   <td><div class="bar ${x.rate>=0.7?'hi':x.rate<0.35?'lo':''}"><i style="width:${Math.min(100,x.rate*100).toFixed(0)}%"></i></div></td></tr>`;});
 h+=`</table></div></div>`;
 el('v-capa').innerHTML=h;
}

const ASY_COLS=[{t:'라인',k:'ho'},{t:'고객',k:'cust',cls:'l'},{t:'구분',k:'mat'},{t:'품명',k:'nm',cls:'l'},{t:'품번',k:'pno',cls:'l'},{t:'단가',k:'price',f:'cm',cls:'r'},{t:'계획수량',k:'qty',f:'cm',cls:'r qty'},{t:'목표금액',k:'amt',f:'cm',cls:'r amt'},{t:'가동율',k:'capa',f:'bar'}];

el('hdrDate').textContent='기준: 2026-07';
</script>
