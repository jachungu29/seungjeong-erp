<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APQP·PPAP 관리 (클라우드)</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png">
<style>
:root{--bg:#f0eee9;--card:#fff;--line:#e7e3db;--line2:#efece5;--txt:#1d1f24;--dim:#8b8f96;--faint:#a7abb2;--blue:#2f6feb;--green:#2f9e44;--amber:#d08700;--red:#d64545;--kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px;line-height:1.45}
.topbar{height:6px;background:#111318}.wrap{max-width:1200px;margin:0 auto;padding:18px 20px 90px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hd .ic{font-size:24px}.hd h1{font-size:20px;font-weight:800;margin:0}.hd .sub{font-size:12px;color:var(--dim)}
.hd .r{margin-left:auto;display:flex;gap:7px;align-items:center}.btn{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none}.btn:hover{border-color:var(--blue);color:var(--blue)}.st{font-size:11.5px;font-family:var(--mono)}
.banner{margin:14px 0 0;border:1px solid #d9e6f7;background:#f2f7fe;border-radius:11px;padding:10px 14px;font-size:12.5px;color:#2c5a9e}
.filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.filter input,.filter select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}.filter input.search{flex:1;min-width:160px}.filter .cnt{margin-left:auto;font-size:12.5px;color:var(--dim);font-weight:700}
.addbtn{background:#1f6feb;color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.editcard{background:#fffdf7;border:1px solid #f0d9a8;border-radius:13px;padding:15px 17px;margin-top:14px;display:none}.editcard.on{display:block}.editcard h3{margin:0 0 11px;font-size:14px;font-weight:800;color:#8a5a00}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:820px){.form{grid-template-columns:repeat(2,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:span 2}.fld label{font-size:11px;color:var(--dim)}.fld input,.fld select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px}
.elems{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}.elems .t{font-size:12px;font-weight:700;color:#8a5a00;margin-bottom:8px}
.elgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media(max-width:820px){.elgrid{grid-template-columns:repeat(2,1fr)}}
.elgrid label{display:flex;align-items:center;gap:7px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}
.frow{display:flex;gap:9px;margin-top:12px}.save{background:#1f6feb;color:#fff;border:none;border-radius:9px;padding:10px 20px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}.clr{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}th{color:var(--dim);font-size:11px;position:sticky;top:0;background:#faf8f4}tbody tr:hover{background:#f7fbff}
.code{font-family:var(--mono);font-size:11.5px;color:var(--faint)}.pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px}
.s-승인{background:rgba(47,158,68,.14);color:var(--green)}.s-제출{background:rgba(47,111,235,.13);color:var(--blue)}.s-준비중{background:#eef0f3;color:var(--dim)}.s-조건부{background:rgba(208,135,0,.16);color:var(--amber)}.s-반려{background:rgba(214,69,69,.14);color:var(--red)}
.prog{display:inline-block;width:60px;height:7px;background:#efece6;border-radius:4px;overflow:hidden;vertical-align:middle}.prog i{display:block;height:100%;background:var(--green)}
.act button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;color:var(--faint);margin-left:3px}.act button:hover{border-color:var(--blue);color:var(--blue)}.act button.del:hover{border-color:var(--red);color:var(--red)}.empty{color:var(--faint);text-align:center;padding:24px}
</style></head><body>
<div class="topbar"></div>
<div class="wrap">
 <div class="hd"><span class="ic">📋</span>
  <div><h1>APQP·PPAP 관리</h1><div class="sub">사전제품품질기획(APQP 5단계) + 양산부품승인(PPAP 18요소) · 클라우드 저장(전 PC 공유)</div></div>
  <div class="r"><span class="st" id="st">클라우드 …</span><a class="btn" href="index2.html">← 메인</a></div>
 </div>
 <div class="banner">📡 <b>실데이터</b> — 품번별 APQP 단계와 PPAP 제출요소(18)를 관리합니다. 저장 시 클라우드(Supabase)에 기록되어 전 PC에서 공유됩니다.</div>

 <div class="filter">
  <input class="search" id="fSearch" placeholder="🔍 품번·품명·고객·차종 검색" oninput="render()">
  <select id="fStatus" onchange="render()"><option value="">PPAP 상태 전체</option><option>준비중</option><option>제출</option><option>승인</option><option>조건부</option><option>반려</option></select>
  <button class="addbtn" onclick="newRow()">＋ 신규</button><span class="cnt" id="cnt"></span>
 </div>

 <div class="editcard" id="editCard">
  <h3 id="editTitle">＋ APQP·PPAP 신규</h3>
  <div class="form">
   <div class="fld"><label>품번</label><input id="e_part" placeholder="예: 1211-K48070"></div>
   <div class="fld wide"><label>품명</label><input id="e_name" placeholder="예: BODY KA4"></div>
   <div class="fld"><label>고객</label><input id="e_cust" placeholder="예: 현대모비스"></div>
   <div class="fld"><label>차종/프로그램</label><input id="e_prog" placeholder="예: NX4"></div>
   <div class="fld"><label>APQP 현단계</label><select id="e_phase"><option>1. 계획·정의</option><option>2. 제품설계·개발</option><option>3. 공정설계·개발</option><option>4. 제품·공정검증</option><option>5. 양산·피드백</option></select></div>
   <div class="fld"><label>PPAP 제출수준</label><select id="e_level"><option>Level 1</option><option>Level 2</option><option selected>Level 3</option><option>Level 4</option><option>Level 5</option></select></div>
   <div class="fld"><label>PPAP 상태</label><select id="e_status"><option>준비중</option><option>제출</option><option>승인</option><option>조건부</option><option>반려</option></select></div>
   <div class="fld"><label>제출일</label><input type="date" id="e_sub"></div>
   <div class="fld"><label>승인일</label><input type="date" id="e_app"></div>
   <div class="fld"><label>담당</label><input id="e_mgr"></div>
   <div class="fld wide"><label>비고</label><input id="e_note"></div>
  </div>
  <div class="elems"><div class="t">PPAP 18 제출요소 (완료 체크)</div><div class="elgrid" id="elemBox"></div></div>
  <div class="frow"><button class="save" onclick="saveForm()">저장</button><button class="clr" onclick="closeForm()">취소</button></div>
 </div>

 <div class="tblwrap"><table><thead><tr><th>품번</th><th>품명</th><th>고객</th><th>차종</th><th>APQP 단계</th><th>PPAP 수준</th><th>상태</th><th>PPAP 진척</th><th>제출/승인</th><th>담당</th><th></th></tr></thead>
 <tbody id="rows"><tr><td colspan="11" class="empty">불러오는 중…</td></tr></tbody></table></div>
</div>

<script src="_lib/supabase.js"></script>
<script src="_lib/cloud.js"></script>
<script>
var PPAP_ELEMS=["1. 설계기록","2. 공학변경 문서","3. 고객 공학승인","4. DFMEA","5. 공정흐름도","6. PFMEA","7. 관리계획서","8. 측정시스템분석(MSA)","9. 치수 측정결과","10. 재료/성능 시험결과","11. 초기공정연구(SPC)","12. 공인시험기관 문서","13. 외관승인보고서(AAR)","14. 샘플 제품","15. 마스터 샘플","16. 검사 치구","17. 고객별 요구사항 기록","18. 부품제출보증서(PSW)"];
var ROWS=[], KEY='apqp_register', EDIT=-1;
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function setSt(t,c){var e=document.getElementById("st");e.textContent=t;e.style.color=(c==="g"?"#2f9e44":c==="r"?"#d64545":"#8b8f96");}
document.getElementById("elemBox").innerHTML=PPAP_ELEMS.map(function(n,i){return '<label><input type="checkbox" id="el_'+i+'"> '+esc(n)+'</label>';}).join("");

function doneCount(el){return (el||[]).filter(Boolean).length;}
function filtered(){var q=(document.getElementById("fSearch").value||"").toLowerCase(),stt=document.getElementById("fStatus").value;
 return ROWS.map(function(r,i){return{r:r,i:i};}).filter(function(o){var r=o.r;if(stt&&r.status!==stt)return false;
  if(q){var h=(r.part+" "+r.name+" "+r.cust+" "+r.prog).toLowerCase();if(h.indexOf(q)<0)return false;}return true;});}
function render(){var box=document.getElementById("rows"),list=filtered();
 document.getElementById("cnt").textContent="총 "+ROWS.length+"건 · 표시 "+list.length;
 if(!list.length){box.innerHTML='<tr><td colspan="11" class="empty">해당 품목이 없습니다.</td></tr>';return;}
 box.innerHTML=list.map(function(o){var r=o.r,i=o.i,dc=doneCount(r.elems),pct=Math.round(dc/18*100);
  return '<tr><td><span class="code">'+esc(r.part)+'</span></td><td>'+esc(r.name)+'</td><td>'+esc(r.cust)+'</td><td>'+esc(r.prog)+'</td>'+
   '<td>'+esc(r.phase)+'</td><td>'+esc(r.level)+'</td><td><span class="pill s-'+esc(r.status)+'">'+esc(r.status)+'</span></td>'+
   '<td><span class="prog"><i style="width:'+pct+'%"></i></span> '+dc+'/18</td>'+
   '<td style="font-size:11px;color:var(--faint)">'+esc(r.sub||"-")+' / '+esc(r.app||"-")+'</td><td>'+esc(r.mgr)+'</td>'+
   '<td class="act" style="text-align:right;white-space:nowrap"><button onclick="editRow('+i+')">편집</button><button class="del" onclick="delRow('+i+')">✕</button></td></tr>';
 }).join("");}
function openForm(t){document.getElementById("editTitle").textContent=t;document.getElementById("editCard").classList.add("on");window.scrollTo({top:0,behavior:"smooth"});}
function closeForm(){document.getElementById("editCard").classList.remove("on");EDIT=-1;}
function setF(id,v){var e=document.getElementById(id);if(e)e.value=v==null?"":v;}
function getF(id){var e=document.getElementById(id);return e?(e.value||"").trim():"";}
function setElems(el){for(var i=0;i<18;i++){document.getElementById("el_"+i).checked=!!(el&&el[i]);}}
function getElems(){var a=[];for(var i=0;i<18;i++)a.push(document.getElementById("el_"+i).checked);return a;}
function newRow(){EDIT=-1;["e_part","e_name","e_cust","e_prog","e_sub","e_app","e_mgr","e_note"].forEach(function(id){setF(id,"");});
 setF("e_phase","1. 계획·정의");setF("e_level","Level 3");setF("e_status","준비중");setElems(null);openForm("＋ APQP·PPAP 신규");}
function editRow(i){var r=ROWS[i];if(!r)return;EDIT=i;setF("e_part",r.part);setF("e_name",r.name);setF("e_cust",r.cust);setF("e_prog",r.prog);
 setF("e_phase",r.phase);setF("e_level",r.level);setF("e_status",r.status);setF("e_sub",r.sub);setF("e_app",r.app);setF("e_mgr",r.mgr);setF("e_note",r.note);setElems(r.elems);openForm("✏️ APQP·PPAP 편집");}
function saveForm(){var rec={part:getF("e_part"),name:getF("e_name"),cust:getF("e_cust"),prog:getF("e_prog"),phase:getF("e_phase"),level:getF("e_level"),status:getF("e_status"),sub:getF("e_sub"),app:getF("e_app"),mgr:getF("e_mgr"),note:getF("e_note"),elems:getElems()};
 if(!rec.part&&!rec.name){alert("품번 또는 품명을 입력하세요.");return;}
 if(EDIT>=0)ROWS[EDIT]=rec;else ROWS.unshift(rec);closeForm();saveCloud();render();}
function delRow(i){if(!confirm("이 항목을 삭제할까요?"))return;ROWS.splice(i,1);saveCloud();render();}
var _t=null;function saveCloud(){if(!window.SB)return;clearTimeout(_t);_t=setTimeout(function(){window.SB.from("app_state").upsert({key:KEY,value:ROWS,src:(window.__CID||""),updated_at:new Date().toISOString()}).then(function(r){setSt(r&&r.error?"저장 실패":"클라우드 저장됨 ✓",r&&r.error?"r":"g");}).catch(function(){setSt("저장 실패","r");});},400);}
async function load(){if(!window.SB){setSt("로컬 모드","r");render();return;}setSt("불러오는 중…");
 try{var r=await window.SB.from("app_state").select("value").eq("key",KEY).maybeSingle();if(r.error){setSt("연결 확인 필요","r");render();return;}
  if(r.data&&r.data.value){ROWS=r.data.value;}setSt("클라우드 연결됨 ✓","g");render();}catch(e){setSt("연결 확인 필요","r");render();}}
load();
try{if(window.SB)window.SB.channel("apqp_rt").on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"key=eq."+KEY},function(p){var row=(p&&p.new)||{};if(row.src===window.__CID)return;if(row.value){ROWS=row.value;render();}}).subscribe();}catch(e){}
</script>
</body></html>
