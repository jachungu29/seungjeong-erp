 // edges

 E.forEach(function(e){var p=N[e[0]],o=N[e[1]];if(!showLeaf&&(p.lv>2||o.lv>2))return;var hl=(hover>=0&&(e[0]===hover||e[1]===hover));ctx.strokeStyle=hl?"rgba(88,166,255,.55)":"rgba(120,130,150,.13)";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(o.x,o.y);ctx.stroke();});
 // nodes
 N.forEach(function(n){if(!showLeaf&&n.lv>2)return;var r=radius(n);var isH=hover===n.i;var nb=hover>=0&&E.some(function(e){return (e[0]===hover&&e[1]===n.i)||(e[1]===hover&&e[0]===n.i);});var match=q&&n.label.toLowerCase().indexOf(q)>=0;
  ctx.globalAlpha=(hover<0||isH||nb||match)?1:0.28;
  ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.2832);ctx.fillStyle=n.todo?"#3a424f":n.col;ctx.fill();
  if(isH||match){ctx.lineWidth=2/view.z;ctx.strokeStyle="#fff";ctx.stroke();}
  ctx.globalAlpha=1;});
 // labels
 N.forEach(function(n){if(!showLeaf&&n.lv>2)return;var isH=hover===n.i;var nb=hover>=0&&E.some(function(e){return (e[0]===hover&&e[1]===n.i)||(e[1]===hover&&e[0]===n.i);});var match=q&&n.label.toLowerCase().indexOf(q)>=0;
  var showLbl=n.lv<=1||isH||nb||match||(n.lv===2&&view.z>0.9);
  if(!showLbl)return;var r=radius(n);ctx.globalAlpha=(hover<0||isH||nb||match||n.lv<=1)?1:0.3;
  ctx.font=(n.lv===0?"800 "+(15)+"px":n.lv===1?"700 "+(12.5)+"px":"500 11px")+" var(--kr),sans-serif";
  ctx.fillStyle=isH?"#fff":n.lv<=1?"#e6edf3":"#aeb8c7";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(n.label,n.x,n.y+r+2);ctx.globalAlpha=1;});
 ctx.restore();
}
function loop(){step();draw();requestAnimationFrame(loop);}
// interaction
function toWorld(mx,my){return {x:(mx-view.x)/view.z,y:(my-view.y)/view.z};}
function pick(mx,my){var w=toWorld(mx,my),best=-1,bd=1e9;N.forEach(function(n){if(!showLeaf&&n.lv>2)return;var dx=n.x-w.x,dy=n.y-w.y;var d=dx*dx+dy*dy;var rr=(radius(n)+6);if(d<rr*rr&&d<bd){bd=d;best=n.i;}});return best;}
var down=false,dragNode=-1,lx=0,ly=0,moved=false;
cv.addEventListener("mousedown",function(e){down=true;moved=false;lx=e.clientX;ly=e.clientY;dragNode=pick(e.clientX,e.clientY);if(dragNode>=0){N[dragNode].fix=true;}cv.classList.add("drag");});
window.addEventListener("mousemove",function(e){var mx=e.clientX,my=e.clientY;if(down){var dx=mx-lx,dy=my-ly;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(dragNode>=0){var w=toWorld(mx,my);N[dragNode].x=w.x;N[dragNode].y=w.y;N[dragNode].vx=0;N[dragNode].vy=0;alpha=Math.max(alpha,.3);}else{view.x+=dx;view.y+=dy;}lx=mx;ly=my;}else{hover=pick(mx,my);}});
window.addEventListener("mouseup",function(){if(dragNode>=0){N[dragNode].fix=false;}down=false;dragNode=-1;cv.classList.remove("drag");});
cv.addEventListener("wheel",function(e){e.preventDefault();var f=e.deltaY<0?1.12:0.89;var mx=e.clientX,my=e.clientY;var wx=(mx-view.x)/view.z,wy=(my-view.y)/view.z;view.z=Math.max(0.15,Math.min(4,view.z*f));view.x=mx-wx*view.z;view.y=my-wy*view.z;},{passive:false});
document.getElementById("q").addEventListener("input",function(e){q=(e.target.value||"").trim().toLowerCase();});
document.getElementById("leafBtn").addEventListener("click",function(){showLeaf=!showLeaf;this.classList.toggle("on",showLeaf);this.textContent=showLeaf?"소분류 표시 ✓":"소분류 숨김";alpha=Math.max(alpha,.5);});
document.getElementById("fitBtn").addEventListener("click",function(){view={x:W/2,y:H/2,z:.5};alpha=1;});
document.getElementById("reloadBtn").addEventListener("click",function(){build();view={x:W/2,y:H/2,z:.5};});
window.addEventListener("focus",function(){build();});
build();loop();
