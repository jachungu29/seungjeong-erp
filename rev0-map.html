<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--kr);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.tt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;margin:0}
.rev{font-family:var(--mono);font-size:12px;background:var(--blue);color:#fff;padding:2px 9px;border-radius:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.save{font-size:11.5px;color:#16a34a;font-family:var(--mono)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 15px;min-width:90px}
.kpi b{display:block;font-size:21px;color:var(--blue);font-weight:800}
.kpi span{font-size:11px;color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 18px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:3px;display:inline-block}
.grid{columns:2;column-gap:16px}
@media(max-width:760px){.grid{columns:1}}
.cat{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 0 16px}
.cath{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dot{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.num{font-family:var(--mono);font-size:11px;color:#fff;background:#334155;border-radius:5px;padding:1px 6px}
.cath h2{font-size:15.5px;font-weight:800;margin:0;flex:1}
.cnt{font-size:11px;color:var(--dim);font-family:var(--mono)}
.mid{margin:8px 0}
.midh{font-size:11.5px;color:#475569;font-weight:700;margin-bottom:5px;border-left:3px solid #cbd5e1;padding-left:7px;display:flex;align-items:center;gap:6px}
.midh b{color:#94a3b8;font-family:var(--mono);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding-left:8px}
.chip{font-size:11.5px;border-radius:7px;padding:3px 8px;border:1px solid;display:inline-flex;align-items:center;gap:5px}
.chip i{font-style:normal;font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:4px;cursor:default}
.chip.live{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}.chip.live i{background:#16a34a;color:#fff}
.chip.todo{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}.chip.todo i{background:#cbd5e1;color:#fff}
.chip.bom{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;font-weight:700}.chip.bom i{background:#2563eb;color:#fff}
.eb{border:1px solid #dbe3ef;background:#fff;border-radius:5px;padding:0 5px;font-size:10px;cursor:pointer;color:#64748b;margin-left:2px;line-height:1.6}
.eb:hover{border-color:var(--blue);color:var(--blue)}
.eb.d:hover{border-color:#dc2626;color:#dc2626}
.editing .cat{border-color:#c7d7ef}
.addbtn{border:1px dashed #93b4e8;background:#f0f6ff;color:#2563eb;border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer;margin-left:6px}
footer{color:#94a3b8;font-family:var(--mono);font-size:11px;text-align:center;margin-top:26px}
.hf{display:none}
</style></head><body><div class="wrap">

var STRUCT=load(), EDIT=false;
function save(){try{localStorage.setItem("SJ_MAP_STRUCT",JSON.stringify(STRUCT));}catch(e){}flash();}
function mapSaveNow(){save();try{if(window.Cloud&&Cloud.set)Cloud.set("map_struct",STRUCT);}catch(e){}alert("구조도가 저장되었습니다. REV-0 앱·설계메뉴·설계그래프에 반영됩니다. (앱은 Ctrl+Shift+R 후 적용)");}
function flash(){var s=document.getElementById("save");if(s){s.textContent="저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});s.style.opacity=1;}}
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var STCYCLE={live:"todo",todo:"bom",bom:"live"};var STLAB={live:"작동",todo:"준비중",bom:"BOM"};

function stats(){var cat=STRUCT.length,mid=0,scr=0,live=0,todo=0;STRUCT.forEach(function(c){mid+=c.mids.length;c.mids.forEach(function(m){m.items.forEach(function(it){scr++;if(it.st==="todo")todo++;else live++;});});});return{cat:cat,mid:mid,scr:scr,live:live,todo:todo};}
function _renum(){STRUCT.forEach(function(c,i){c.num=(i+1<10?"0":"")+(i+1);});}

function render(){
 _renum();var s=stats();
 document.getElementById("k_cat").textContent=s.cat;document.getElementById("k_mid").textContent=s.mid;
 document.getElementById("k_scr").textContent=s.scr;document.getElementById("k_live").textContent=s.live;document.getElementById("k_todo").textContent=s.todo;
 var h="";
 STRUCT.forEach(function(c,ci){
  h+='<section class="cat"><div class="cath"><span class="dot" style="background:'+esc(c.color)+'"></span><span class="num">'+esc(c.num)+'</span><h2>'+esc(c.label)+'</h2>';
  if(EDIT){h+='<span class="cnt"><button class="eb" onclick="catMove('+ci+',-1)">▲</button><button class="eb" onclick="catMove('+ci+',1)">▼</button><button class="eb" onclick="catRen('+ci+')">✎</button><button class="eb" onclick="midAdd('+ci+')">＋중</button><button class="eb d" onclick="catDel('+ci+')">🗑</button></span>';}
  else{var n=0;c.mids.forEach(function(m){n+=m.items.length;});h+='<span class="cnt">'+n+' 화면</span>';}
  h+='</div>';
  c.mids.forEach(function(m,mi){
   h+='<div class="mid"><div class="midh">'+esc(m.hdr)+' <b>'+m.items.length+'</b>';
   if(EDIT){h+='<span style="margin-left:auto"><button class="eb" onclick="midMove('+ci+','+mi+',-1)">▲</button><button class="eb" onclick="midMove('+ci+','+mi+',1)">▼</button><button class="eb" onclick="midRen('+ci+','+mi+')">✎</button><button class="eb" onclick="itemAdd('+ci+','+mi+')">＋화면</button><button class="eb d" onclick="midDel('+ci+','+mi+')">🗑</button></span>';}
   h+='</div><div class="chips">';
   m.items.forEach(function(it,ii){
    h+='<span class="chip '+it.st+'">'+esc(it.name)+'<i'+(EDIT?' onclick="itemSt('+ci+','+mi+','+ii+')" style="cursor:pointer" title="상태 변경"':'')+'>'+STLAB[it.st]+'</i>';
    if(EDIT){h+='<button class="eb" onclick="itemRen('+ci+','+mi+','+ii+')">✎</button><button class="eb" onclick="itemMove('+ci+','+mi+','+ii+',-1)">◀</button><button class="eb" onclick="itemMove('+ci+','+mi+','+ii+',1)">▶</button><button class="eb d" onclick="itemDel('+ci+','+mi+','+ii+')">✕</button>';}
    h+='</span>';
   });
   h+='</div></div>';
  });
  h+='</section>';
 });
 if(EDIT)h+='<button class="btn" style="width:100%;border-style:dashed;color:#2563eb" onclick="catAdd()">＋ 대분류 추가</button>';
 document.getElementById("grid").innerHTML=h;
 document.getElementById("editBtn").textContent=EDIT?"편집 끝":"✎ 편집";
 document.getElementById("editBtn").classList.toggle("on",EDIT);
 document.body.classList.toggle("editing",EDIT);
}
function toggleEdit(){EDIT=!EDIT;render();}

function catRen(ci){var v=prompt("대분류 이름:",STRUCT[ci].label);if(v===null||!v.trim())return;STRUCT[ci].label=v.trim();save();render();}
function catAdd(){var v=prompt("새 대분류 이름:");if(!v||!v.trim())return;STRUCT.push({num:"",label:v.trim(),color:"#8b929c",mids:[]});save();render();}
function catDel(ci){if(!confirm('대분류 "'+STRUCT[ci].label+'" 삭제?'))return;STRUCT.splice(ci,1);save();render();}
function catMove(ci,d){var j=ci+d;if(j<0||j>=STRUCT.length)return;var t=STRUCT[ci];STRUCT[ci]=STRUCT[j];STRUCT[j]=t;save();render();}
function midAdd(ci){var v=prompt("새 중분류 이름:");if(!v||!v.trim())return;STRUCT[ci].mids.push({hdr:v.trim(),items:[]});save();render();}
function midRen(ci,mi){var v=prompt("중분류 이름:",STRUCT[ci].mids[mi].hdr);if(v===null||!v.trim())return;STRUCT[ci].mids[mi].hdr=v.trim();save();render();}
function midDel(ci,mi){if(!confirm('중분류 "'+STRUCT[ci].mids[mi].hdr+'" 삭제?'))return;STRUCT[ci].mids.splice(mi,1);save();render();}
function midMove(ci,mi,d){var a=STRUCT[ci].mids,j=mi+d;if(j<0||j>=a.length)return;var t=a[mi];a[mi]=a[j];a[j]=t;save();render();}
function itemAdd(ci,mi){var v=prompt("새 화면 이름:");if(!v||!v.trim())return;STRUCT[ci].mids[mi].items.push({name:v.trim(),st:"todo"});save();render();}
function itemRen(ci,mi,ii){var it=STRUCT[ci].mids[mi].items[ii];var v=prompt("화면 이름:",it.name);if(v===null||!v.trim())return;it.name=v.trim();save();render();}
function itemSt(ci,mi,ii){var it=STRUCT[ci].mids[mi].items[ii];it.st=STCYCLE[it.st]||"live";save();render();}
function itemDel(ci,mi,ii){STRUCT[ci].mids[mi].items.splice(ii,1);save();render();}
function itemMove(ci,mi,ii,d){var a=STRUCT[ci].mids[mi].items,j=ii+d;if(j<0||j>=a.length)return;var t=a[ii];a[ii]=a[j];a[j]=t;save();render();}

function doExport(){var b=new Blob([JSON.stringify(STRUCT,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="승정_설계구조_"+new Date().toISOString().slice(0,10)+".json";a.click();}
function doImport(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d)&&d.length){STRUCT=d;save();render();alert("불러왔습니다.");}else alert("형식 오류");}catch(e){alert("읽기 오류: "+e.message);}inp.value="";};r.readAsText(f);}
function doReset(){if(!confirm("기본 구조로 되돌릴까요? (편집 내용 사라짐)"))return;STRUCT=JSON.parse(JSON.stringify(_DEF));save();render();}
render();
</script>
</body></html>
