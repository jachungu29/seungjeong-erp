<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설비·안전·소방 종합 대시보드 · 승정</title>
<style>
:root{--navy:#0b3d5c;--teal:#0d6e8c;--gold:#F5A623;--bg:#f3f5f8;--card:#fff;--line:#e6ebf1;--mut:#64748b;--eq:#1565c0;--sf:#e08a00;--fr:#C62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#1c2430;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#0e2a3d,#0d6e8c);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{font-size:11.5px;opacity:.85}
.spacer{flex:1}
.cloud{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);font-weight:600}
.cloud.on{background:#1e8e4e}.cloud.off{background:#7a8699}
.rf{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.prn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.wrap{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
.sect{font-size:13px;font-weight:800;color:var(--navy);margin:4px 0 9px;display:flex;align-items:center;gap:8px}
.sect::before{content:"";width:4px;height:15px;background:var(--teal);border-radius:2px}
.sect .r{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-top:3px solid var(--teal)}
.kpi .t{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy);margin:4px 0 2px;line-height:1}
.kpi .v small{font-size:14px;font-weight:700;color:var(--mut)}
.kpi .d{font-size:11.5px;font-weight:700}
.kpi.green{border-top-color:#1e8e4e}.kpi.green .v{color:#1e8e4e}
.kpi.red{border-top-color:var(--fr)}.kpi.red .v{color:var(--fr)}
.kpi.gold{border-top-color:var(--gold)}.kpi.gold .v{color:#b8860b}
.kpi.blue{border-top-color:var(--eq)}.kpi.blue .v{color:var(--eq)}
.catcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.catcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid #ccc}
.catcard.설비이상{border-left-color:var(--eq)}.catcard.안전{border-left-color:var(--sf)}.catcard.소방{border-left-color:var(--fr)}
.catcard .cn{font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px}
.catcard .row{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px}
.catcard .row b{font-size:16px}
.catcard .lab{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--navy)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar .nm{width:88px;font-weight:800;font-size:13px}
.bar .track{flex:1;height:26px;background:#eef1f5;border-radius:7px;overflow:hidden;display:flex}
.bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;min-width:2px}
.seg.a{background:#1e8e4e}.seg.b{background:var(--gold)}.seg.c{background:var(--fr)}
.seg.접수{background:#64748b}.seg.조치중{background:var(--gold)}.seg.완료{background:#1e8e4e}
.legend{font-size:11.5px;color:var(--mut);margin-top:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;padding:7px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 7px;font-size:12px}
tr:nth-child(even) td{background:#f8fafc}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:800;color:#fff}
.pill.접수{background:#64748b}.pill.조치중{background:var(--gold)}.pill.완료{background:#1e8e4e}
.pill.불량{background:var(--fr)}.pill.주의{background:var(--gold)}
.pill.설비이상{background:var(--eq)}.pill.안전{background:var(--sf)}.pill.소방{background:var(--fr)}
.empty{text-align:center;color:#1e8e4e;padding:18px;font-weight:800}
.noacc{cursor:pointer}
@media print{.rf,.prn,.cloud{display:none!important}header{position:static}}
</style></head><body>
<header>
 <h1>🛡️ 설비·안전·소방 종합 대시보드</h1>
 <span class="sub" id="asof"></span>
 <span class="cloud" id="cloud">● 연결 확인 중</span>
 <span class="spacer"></span>
 <button class="prn" onclick="window.print()">🖨️ 인쇄</button>
 <button class="rf" onclick="reload()">↻ 새로고침</button>
</header>
<div class="wrap">
 <div class="sect">전사 안전 핵심지표 <span class="r">신고·점검 실시간 집계</span></div>
 <div class="kpis" id="kpis"></div>
 <div class="sect">분류별 현황 (설비이상 · 안전 · 소방)</div>
 <div class="catcards" id="catcards"></div>
 <div class="grid2">
  <div class="panel"><h3>📊 신고 상태 분포</h3><div id="statusChart"></div><div class="legend">■ <span style="color:#64748b">접수</span> ■ <span style="color:#b8860b">조치중</span> ■ <span style="color:#1e8e4e">완료</span></div></div>
  <div class="panel"><h3>🔍 정기점검 결과 분포</h3><div id="inspChart"></div><div class="legend">■ <span style="color:#1e8e4e">양호</span> ■ <span style="color:#b8860b">주의</span> ■ <span style="color:#C62828">불량</span></div></div>
 </div>
 <div class="sect">🚨 미조치 · 진행중 신고 <span class="r" id="rptCnt"></span></div>
 <div class="panel" style="margin-bottom:18px"><div class="tbl-wrap"><table id="rptTbl"></table></div></div>
 <div class="sect">🛠️ 정기점검 조치 필요 내역 <span class="r" id="inspCnt"></span></div>
 <div class="panel"><div class="tbl-wrap"><table id="inspTbl"></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://gyasbmiordkxcfpwgvio.supabase.co", SB_KEY="sb_publishable_oMdTYbr11auTzSaYwY9Jew_qbKO3SbF";
let sb=null; try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cm=n=>{n=Math.round(+n||0);return n.toLocaleString('en-US');};
const CATS=["설비이상","안전","소방"];
const CICON={설비이상:"🔧",안전:"🦺",소방:"🔥"};
let REPORTS=[], INSPECT=null, CFG={noAccSince:""};
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysSince(dstr){if(!dstr)return null;var a=new Date(),b=new Date(dstr);if(isNaN(b))return null;return Math.max(0,Math.floor((a-b)/86400000));}
async function getKey(k){if(!sb)return null;try{var r=await sb.from('app_state').select('value').eq('key',k).maybeSingle();return r&&r.data?r.data.value:null;}catch(e){return null;}}
function normRep(v){return Array.isArray(v)?v:(v&&Array.isArray(v.rows)?v.rows:[]);}
function render(){
 el('asof').textContent='기준 '+today()+' · '+REPORTS.length+'건 신고';
 // ===== 집계 =====
 var byCat={},byStat={접수:0,조치중:0,완료:0};
 CATS.forEach(function(c){byCat[c]={tot:0,open:0,done:0};});
 REPORTS.forEach(function(r){var c=CATS.indexOf(r.cat)>=0?r.cat:'설비이상';byCat[c].tot++;var s=r.status||'접수';if(byStat[s]==null)byStat[s]=0;byStat[s]++;if(s==='완료')byCat[c].done++;else byCat[c].open++;});
 var totRep=REPORTS.length, openRep=byStat['접수']+byStat['조치중'], doneRep=byStat['완료'];
 var doneRate=totRep?Math.round(doneRep/totRep*100):100;
 // 점검
 var ig=0,iw=0,ib=0,itot=0,acts=[];
 if(INSPECT&&INSPECT.res){CATS_INS.forEach(function(c){var res=INSPECT.res[c]||[];var items=(INSPECT.items&&INSPECT.items[c])||[];res.forEach(function(x,i){itot++;if(x.r==='양호')ig++;else if(x.r==='주의')iw++;else if(x.r==='불량')ib++;if(x.r==='불량'||x.r==='주의')acts.push({c:c,item:(items[i]&&items[i].t)||'',loc:x.loc,r:x.r,a:x.a});});});}
 var inspRate=itot?Math.round(ig/itot*100):0;
 var noAcc=daysSince(CFG.noAccSince);
 // ===== KPI =====
 el('kpis').innerHTML=''+
  kpi('green','🛡️ 무재해 일수',(noAcc!=null?noAcc:'-'),'일',(CFG.noAccSince?('기준 '+CFG.noAccSince):'클릭해 기준일 설정'),'noacc" onclick="setNoAcc()')+
  kpi('red','🚨 미조치 신고',openRep,'건','접수 '+byStat['접수']+' · 조치중 '+byStat['조치중'],'')+
  kpi('blue','📋 누적 신고',totRep,'건','완료 '+doneRep+'건','')+
  kpi('green','✅ 조치완료율',doneRate,'%','신고 처리율','')+
  kpi('red','🔍 점검 불량',ib,'건','주의 '+iw+'건','')+
  kpi('green','📊 점검 양호율',(itot?inspRate:'-'),'%','점검 '+itot+'항목','');
 // ===== 분류 카드 =====
 el('catcards').innerHTML=CATS.map(function(c){var b=byCat[c];var ic=inspBad(c);
  return '<div class="catcard '+c+'"><div class="cn">'+CICON[c]+' '+c+'</div>'+
   '<div class="row"><span class="lab">신고 누적</span><b>'+b.tot+' 건</b></div>'+
   '<div class="row"><span class="lab">미조치</span><b style="color:'+(b.open?'#C62828':'#1e8e4e')+'">'+b.open+' 건</b></div>'+
   '<div class="row"><span class="lab">점검 불량/주의</span><b style="color:'+(ic?'#C62828':'#1e8e4e')+'">'+ic+' 건</b></div></div>';}).join('');
 // ===== 상태 차트 =====
 var st=byStat,stTot=Math.max(1,st['접수']+st['조치중']+st['완료']);
 el('statusChart').innerHTML='<div class="bar"><div class="nm">신고 상태</div><div class="track">'+
   seg('접수',st['접수'],stTot)+seg('조치중',st['조치중'],stTot)+seg('완료',st['완료'],stTot)+'</div></div>'+
   (totRep?'':'<div style="color:#94a3b8;padding:8px 0">아직 신고 데이터가 없습니다 (휴대폰 신고 시 집계).</div>');
 // 점검 차트
 var it=Math.max(1,ig+iw+ib);
 el('inspChart').innerHTML='<div class="bar"><div class="nm">점검 결과</div><div class="track">'+
   segc('a',ig,it)+segc('b',iw,it)+segc('c',ib,it)+'</div></div>'+
   (itot?'':'<div style="color:#94a3b8;padding:8px 0">점검 데이터가 없습니다 (정기점검 체크시트에서 저장 시 집계).</div>');
 // ===== 미조치 신고 목록 =====
 var open=REPORTS.filter(function(r){return (r.status||'접수')!=='완료';}).sort(function(a,b){return String(b.createdAt||'').localeCompare(String(a.createdAt||''));});
 el('rptCnt').textContent=open.length+'건';
 var h='<tr><th style="width:80px">분류</th><th>내용</th><th style="width:120px">위치</th><th style="width:74px">상태</th><th style="width:90px">담당</th><th style="width:100px">일시</th></tr>';
 if(!open.length)h+='<tr><td colspan="6" class="empty">✅ 미조치 신고 없음</td></tr>';
 open.forEach(function(r){h+='<tr><td><span class="pill '+(r.cat||'설비이상')+'">'+esc(r.cat||'-')+'</span></td><td>'+esc(r.content||r.sub||'-')+'</td><td>'+esc(r.loc||'-')+'</td><td><span class="pill '+(r.status||'접수')+'">'+esc(r.status||'접수')+'</span></td><td>'+esc(r.mgr||'-')+'</td><td>'+esc((r.at||r.createdAt||'').slice(0,10))+'</td></tr>';});
 el('rptTbl').innerHTML=h;
 // ===== 점검 조치 목록 =====
 el('inspCnt').textContent=acts.length+'건';
 var ih='<tr><th style="width:64px">구분</th><th>점검항목</th><th style="width:130px">위치/설비</th><th style="width:64px">결과</th><th>조치사항</th></tr>';
 if(!acts.length)ih+='<tr><td colspan="5" class="empty">✅ 점검 이상 항목 없음 (전체 양호)</td></tr>';
 acts.sort(function(a,b){return (a.r==='불량'?0:1)-(b.r==='불량'?0:1);});
 acts.forEach(function(a){ih+='<tr><td><b>'+esc(a.c)+'</b></td><td>'+esc(a.item)+'</td><td>'+esc(a.loc||'-')+'</td><td><span class="pill '+a.r+'">'+a.r+'</span></td><td>'+esc(a.a||'(조치 미입력)')+'</td></tr>';});
 el('inspTbl').innerHTML=ih;
}
const CATS_INS=["설비","안전","소방"];
function inspBad(cat){if(!INSPECT||!INSPECT.res)return 0;var m={"설비이상":"설비","안전":"안전","소방":"소방"};var res=INSPECT.res[m[cat]]||[];return res.filter(function(x){return x.r==='불량'||x.r==='주의';}).length;}
function kpi(cls,t,v,u,d,extra){return '<div class="kpi '+cls+' '+extra+'"><div class="t">'+t+'</div><div class="v">'+(typeof v==='number'?cm(v):v)+' <small>'+u+'</small></div><div class="d" style="color:#94a3b8">'+d+'</div></div>';}
function seg(cls,n,tot){return n?'<div class="seg '+cls+'" style="width:'+(n/tot*100)+'%">'+n+'</div>':'';}
function segc(cls,n,tot){return n?'<div class="seg '+cls+'" style="width:'+(n/tot*100)+'%">'+n+'</div>':'';}
async function setNoAcc(){var v=prompt('무재해 기준 시작일(YYYY-MM-DD)을 입력하세요. 오늘까지의 일수가 계산됩니다.',CFG.noAccSince||today());if(v==null)return;CFG.noAccSince=v.trim();if(sb){try{await sb.from('app_state').upsert({key:'safety_dash_cfg',value:CFG,updated_at:new Date().toISOString()});}catch(e){}}render();}
async function reload(){el('cloud').textContent='● 불러오는 중…';await load();el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';}
async function load(){
 var a=await Promise.all([getKey('safety_reports'),getKey('safety_inspect_v2'),getKey('safety_dash_cfg')]);
 REPORTS=normRep(a[0]); INSPECT=a[1]||null; CFG=a[2]||{noAccSince:''};
 render();
}
async function boot(){
 render();
 if(!sb){el('cloud').textContent='● 로컬 모드(연결 안됨)';el('cloud').className='cloud off';return;}
 try{var probe=await sb.from('app_state').select('key').limit(1);if(probe&&probe.error){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';return;}
  el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';
  await load();
  try{['safety_reports','safety_inspect_v2'].forEach(function(k){sb.channel('sd_'+k).on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'key=eq.'+k},function(){load();}).subscribe();});}catch(e){}
 }catch(e){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';}
}
boot();
</script>
</body></html>
