<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설비·안전·소방 종합 대시보드 · 승정</title>
<style>
:root{--navy:#0b3d5c;--teal:#0d6e8c;--gold:#F5A623;--bg:#f3f5f8;--card:#fff;--line:#e6ebf1;--mut:#64748b;--eq:#1565c0;--sf:#e08a00;--fr:#C62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#1c2430;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#0e2a3d,#0d6e8c);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{font-size:11.5px;opacity:.85}
.spacer{flex:1}
.cloud{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);font-weight:600}
.cloud.on{background:#1e8e4e}.cloud.off{background:#7a8699}
.rf,.prn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.prn{background:rgba(255,255,255,.15);color:#fff}
.wrap{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
.sect{font-size:13px;font-weight:800;color:var(--navy);margin:4px 0 9px;display:flex;align-items:center;gap:8px}
.sect::before{content:"";width:4px;height:15px;background:var(--teal);border-radius:2px}
.sect .r{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-top:3px solid var(--teal)}
.kpi .t{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy);margin:4px 0 2px;line-height:1}
.kpi .v small{font-size:14px;font-weight:700;color:var(--mut)}
.kpi .d{font-size:11.5px;font-weight:700;color:#94a3b8}
.kpi.green{border-top-color:#1e8e4e}.kpi.green .v{color:#1e8e4e}
.kpi.red{border-top-color:var(--fr)}.kpi.red .v{color:var(--fr)}
.kpi.gold{border-top-color:var(--gold)}.kpi.gold .v{color:#b8860b}
.kpi.blue{border-top-color:var(--eq)}.kpi.blue .v{color:var(--eq)}
/* 항목별 구분 카드(클릭 필터) */
.catcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.catcards{grid-template-columns:1fr}}
.catcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-top:5px solid #ccc;cursor:pointer;transition:.12s}
.catcard:hover{box-shadow:0 3px 12px rgba(0,0,0,.09)}
.catcard.on{outline:3px solid rgba(13,110,140,.4)}
.catcard.설비이상{border-top-color:var(--eq)}.catcard.안전{border-top-color:var(--sf)}.catcard.소방{border-top-color:var(--fr)}
.catcard .cn{font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px}
.catcard .big{font-size:28px;font-weight:800;margin:6px 0 2px}
.catcard.설비이상 .big{color:var(--eq)}.catcard.안전 .big{color:var(--sf)}.catcard.소방 .big{color:var(--fr)}
.catcard .row{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px}
.catcard .row b{font-size:15px}.catcard .lab{color:var(--mut)}
.catcard .flt{font-size:10.5px;color:var(--teal);font-weight:800;margin-top:6px}
/* 차트 */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px;position:relative}
.panel h3{margin:0 0 4px;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.lchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;border:1.5px solid #dfe5ec;cursor:pointer;user-select:none}
.lchip .sw{width:12px;height:12px;border-radius:3px}
.lchip.off{opacity:.4;text-decoration:line-through}
svg.chart{width:100%;height:auto;display:block}
.gline{stroke:#eef1f5;stroke-width:1}
.axlbl{font-size:11px;fill:#94a3b8}
.dot{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:#0e2a3d;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;display:none;z-index:20;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;padding:7px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 7px;font-size:12px}
tr:nth-child(even) td{background:#f8fafc}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:800;color:#fff}
.pill.접수{background:#64748b}.pill.조치중{background:var(--gold)}.pill.완료{background:#1e8e4e}
.pill.불량{background:var(--fr)}.pill.주의{background:var(--gold)}
.pill.설비이상{background:var(--eq)}.pill.안전{background:var(--sf)}.pill.소방{background:var(--fr)}
.empty{text-align:center;color:#1e8e4e;padding:18px;font-weight:800}
@media print{.rf,.prn,.cloud{display:none!important}header{position:static}#tip{display:none!important}}
</style></head><body>
<header>
 <h1>🛡️ 설비·안전·소방 종합 대시보드</h1>
 <span class="sub" id="asof"></span>
 <span class="cloud" id="cloud">● 연결 확인 중</span>
 <span class="spacer"></span>
 <button class="prn" onclick="window.print()">🖨️ 인쇄</button>
 <button class="rf" onclick="reload()">↻ 새로고침</button>
</header>
<div class="wrap">
 <div class="sect">전사 안전 핵심지표 <span class="r">신고·점검 실시간 집계</span></div>
 <div class="kpis" id="kpis"></div>

 <div class="sect">항목별 현황 <span class="r">카드 클릭 → 아래 목록·차트 필터</span></div>
 <div class="catcards" id="catcards"></div>

 <div class="panel" id="chartPanel">
  <h3>📈 월별 신고 발생 추이 <span style="font-size:11px;color:#94a3b8;font-weight:600">· 점(●) 위에 마우스 · 범례 클릭으로 선 켜기/끄기</span></h3>
  <div class="legend" id="legend"></div>
  <div id="chart"></div>
  <div id="tip"></div>
 </div>

 <div class="sect">🚨 미조치 · 진행중 신고 <span class="r" id="rptCnt"></span></div>
 <div class="panel"><div class="tbl-wrap"><table id="rptTbl"></table></div></div>
 <div class="sect">🛠️ 정기점검 조치 필요 내역 <span class="r" id="inspCnt"></span></div>
 <div class="panel"><div class="tbl-wrap"><table id="inspTbl"></table></div></div>
</div>
<script src="supabase.js"></script>
<script>
const SB_URL="https://gyasbmiordkxcfpwgvio.supabase.co", SB_KEY="sb_publishable_oMdTYbr11auTzSaYwY9Jew_qbKO3SbF";
let sb=null; try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cm=n=>{n=Math.round(+n||0);return n.toLocaleString('en-US');};
const CATS=["설비이상","안전","소방"];
const CICON={설비이상:"🔧",안전:"🦺",소방:"🔥"};
const CCOLOR={설비이상:"#1565c0",안전:"#e08a00",소방:"#C62828"};
const INSMAP={설비이상:"설비",안전:"안전",소방:"소방"};
let REPORTS=[], INSPECT=null, CFG={noAccSince:""};
let HIDE={설비이상:false,안전:false,소방:false}, FILTER=null;
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysSince(dstr){if(!dstr)return null;var a=new Date(),b=new Date(dstr);if(isNaN(b))return null;return Math.max(0,Math.floor((a-b)/86400000));}
function last6(){var arr=[],d=new Date();for(var i=5;i>=0;i--){var m=new Date(d.getFullYear(),d.getMonth()-i,1);arr.push(m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'));}return arr;}
async function getKey(k){if(!sb)return null;try{var r=await sb.from('app_state').select('value').eq('key',k).maybeSingle();return r&&r.data?r.data.value:null;}catch(e){return null;}}
function normRep(v){return Array.isArray(v)?v:(v&&Array.isArray(v.rows)?v.rows:[]);}
function inspBad(cat){if(!INSPECT||!INSPECT.res)return 0;var res=INSPECT.res[INSMAP[cat]]||[];return res.filter(function(x){return x.r==='불량'||x.r==='주의';}).length;}
function kpi(cls,t,v,u,d,extra){return '<div class="kpi '+cls+'" '+extra+'><div class="t">'+t+'</div><div class="v">'+(typeof v==='number'?cm(v):v)+' <small>'+u+'</small></div><div class="d">'+d+'</div></div>';}

function render(){
 el('asof').textContent='기준 '+today()+' · 신고 '+REPORTS.length+'건'+(FILTER?(' · 필터: '+FILTER):'');
 var byCat={},byStat={접수:0,조치중:0,완료:0};
 CATS.forEach(function(c){byCat[c]={tot:0,open:0,done:0};});
 REPORTS.forEach(function(r){var c=CATS.indexOf(r.cat)>=0?r.cat:'설비이상';byCat[c].tot++;var s=r.status||'접수';if(byStat[s]==null)byStat[s]=0;byStat[s]++;if(s==='완료')byCat[c].done++;else byCat[c].open++;});
 var totRep=REPORTS.length, openRep=byStat['접수']+byStat['조치중'], doneRep=byStat['완료'];
 var doneRate=totRep?Math.round(doneRep/totRep*100):100;
 var ib=0,iw=0,ig=0,itot=0;
 if(INSPECT&&INSPECT.res){CATS.forEach(function(c){var res=INSPECT.res[INSMAP[c]]||[];res.forEach(function(x){itot++;if(x.r==='양호')ig++;else if(x.r==='주의')iw++;else if(x.r==='불량')ib++;});});}
 var inspRate=itot?Math.round(ig/itot*100):0;
 var noAcc=daysSince(CFG.noAccSince);
 el('kpis').innerHTML=
  kpi('green','🛡️ 무재해 일수',(noAcc!=null?noAcc:'-'),'일',(CFG.noAccSince?('기준 '+CFG.noAccSince):'클릭해 기준일 설정'),'onclick="setNoAcc()" style="cursor:pointer"')+
  kpi('red','🚨 미조치 신고',openRep,'건','접수 '+byStat['접수']+' · 조치중 '+byStat['조치중'],'')+
  kpi('blue','📋 누적 신고',totRep,'건','완료 '+doneRep+'건','')+
  kpi('green','✅ 조치완료율',doneRate,'%','신고 처리율','')+
  kpi('red','🔍 점검 불량',ib,'건','주의 '+iw+'건','')+
  kpi('green','📊 점검 양호율',(itot?inspRate:'-'),'%','점검 '+itot+'항목','');
 el('catcards').innerHTML=CATS.map(function(c){var b=byCat[c];var ic=inspBad(c);
  return '<div class="catcard '+c+(FILTER===c?' on':'')+'" onclick="setFilter(\''+c+'\')"><div class="cn">'+CICON[c]+' '+c+'</div>'+
   '<div class="big">'+b.tot+' <span style="font-size:14px;color:#94a3b8">신고</span></div>'+
   '<div class="row"><span class="lab">미조치</span><b style="color:'+(b.open?'#C62828':'#1e8e4e')+'">'+b.open+' 건</b></div>'+
   '<div class="row"><span class="lab">점검 불량/주의</span><b style="color:'+(ic?'#C62828':'#1e8e4e')+'">'+ic+' 건</b></div>'+
   '<div class="flt">'+(FILTER===c?'● 필터 적용중 (클릭 해제)':'○ 클릭해 이 항목만 보기')+'</div></div>';}).join('');
 buildChart();
 renderLists();
}
/* ===== 꺾은선 차트 (상호작용) ===== */
function smoothPath(P,ymin,ymax){
 if(!P.length)return'';
 var rd=function(n){return Math.round(n*10)/10;};
 var cy=function(y){return ymin==null?y:Math.max(ymin,Math.min(ymax,y));};
 if(P.length===1)return'M'+rd(P[0][0])+','+rd(P[0][1]);
 if(P.length===2)return'M'+rd(P[0][0])+','+rd(P[0][1])+' L'+rd(P[1][0])+','+rd(P[1][1]);
 var d='M'+rd(P[0][0])+','+rd(P[0][1]);
 for(var i=0;i<P.length-1;i++){
  var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
  var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=cy(p1[1]+(p2[1]-p0[1])/6);
  var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=cy(p2[1]-(p3[1]-p1[1])/6);
  d+=' C'+rd(c1x)+','+rd(c1y)+' '+rd(c2x)+','+rd(c2y)+' '+rd(p2[0])+','+rd(p2[1]);
 }
 return d;
}
function buildChart(){
 var months=last6();
 var ser={};CATS.forEach(function(c){ser[c]=months.map(function(){return 0;});});
 REPORTS.forEach(function(r){var mo=String(r.at||r.createdAt||'').slice(0,7);var c=CATS.indexOf(r.cat)>=0?r.cat:'설비이상';var i=months.indexOf(mo);if(i>=0)ser[c][i]++;});
 var maxV=1;CATS.forEach(function(c){if(!HIDE[c])ser[c].forEach(function(v){if(v>maxV)maxV=v;});});
 var top=Math.ceil(maxV*1.25)||1;
 var W=900,H=300,pL=42,pR=18,pT=14,pB=38,pw=W-pL-pR,ph=H-pT-pB;
 var X=function(i){return pL+(months.length>1?i*(pw/(months.length-1)):pw/2);};
 var Y=function(v){return pT+ph-(v/top)*ph;};
 var g='';
 for(var k=0;k<=4;k++){var gy=pT+ph-k/4*ph,gv=Math.round(top*k/4);g+='<line class="gline" x1="'+pL+'" y1="'+gy+'" x2="'+(W-pR)+'" y2="'+gy+'"/><text class="axlbl" x="'+(pL-6)+'" y="'+(gy+4)+'" text-anchor="end">'+gv+'</text>';}
 months.forEach(function(mo,i){g+='<text class="axlbl" x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle">'+mo.slice(2)+'</text>';});
 CATS.forEach(function(c){if(HIDE[c])return;var col=CCOLOR[c];
  var P=ser[c].map(function(v,i){return [X(i),Y(v)];});
  g+='<path d="'+smoothPath(P,pT,pT+ph)+'" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  ser[c].forEach(function(v,i){g+='<circle class="dot" cx="'+X(i)+'" cy="'+Y(v)+'" r="5" fill="'+col+'" stroke="#fff" stroke-width="1.5" onmouseover="showTip(event,\''+c+'\',\''+months[i]+'\','+v+')" onmouseout="hideTip()"/>';});
 });
 el('chart').innerHTML='<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
 el('legend').innerHTML=CATS.map(function(c){return '<span class="lchip'+(HIDE[c]?' off':'')+'" onclick="toggleSer(\''+c+'\')"><span class="sw" style="background:'+CCOLOR[c]+'"></span>'+CICON[c]+' '+c+'</span>';}).join('')+
  '<span style="font-size:11px;color:#94a3b8;align-self:center">'+(REPORTS.length?'':'· 신고가 쌓이면 월별 추이가 그려집니다')+'</span>';
}
function toggleSer(c){HIDE[c]=!HIDE[c];buildChart();}
function showTip(ev,c,mo,v){var t=el('tip');var p=el('chartPanel').getBoundingClientRect();t.innerHTML='<span style="color:'+CCOLOR[c]+'">●</span> '+c+' · '+mo+' · <b>'+v+'건</b>';t.style.display='block';t.style.left=(ev.clientX-p.left+12)+'px';t.style.top=(ev.clientY-p.top-10)+'px';}
function hideTip(){el('tip').style.display='none';}
function setFilter(c){FILTER=(FILTER===c)?null:c;render();}
function setNoAcc(){var v=prompt('무재해 기준 시작일(YYYY-MM-DD). 오늘까지 일수가 계산됩니다.',CFG.noAccSince||today());if(v==null)return;CFG.noAccSince=v.trim();if(sb){sb.from('app_state').upsert({key:'safety_dash_cfg',value:CFG,updated_at:new Date().toISOString()}).then(function(){},function(){});}render();}
/* ===== 목록 (필터 적용) ===== */
function renderLists(){
 var reps=REPORTS.filter(function(r){return !FILTER||r.cat===FILTER;});
 var open=reps.filter(function(r){return (r.status||'접수')!=='완료';}).sort(function(a,b){return String(b.createdAt||b.at||'').localeCompare(String(a.createdAt||a.at||''));});
 el('rptCnt').textContent=open.length+'건'+(FILTER?(' ('+FILTER+')'):'');
 var h='<tr><th style="width:80px">항목분류</th><th>내용</th><th style="width:110px">위치</th><th style="width:70px">상태</th><th style="width:84px">조치자</th><th style="width:96px">조치일자</th><th style="width:96px">신고일시</th></tr>';
 if(!open.length)h+='<tr><td colspan="7" class="empty">✅ 미조치 신고 없음</td></tr>';
 open.forEach(function(r){var ad=r.actAt||r.actionAt||r.doneAt||r.actDate||'';h+='<tr><td><span class="pill '+(r.cat||'설비이상')+'">'+esc(r.cat||'-')+'</span></td><td>'+esc(r.content||r.sub||'-')+'</td><td>'+esc(r.loc||'-')+'</td><td><span class="pill '+(r.status||'접수')+'">'+esc(r.status||'접수')+'</span></td><td>'+esc(r.mgr||'-')+'</td><td>'+esc(String(ad).slice(0,10)||'-')+'</td><td>'+esc(String(r.at||r.createdAt||'').slice(0,10))+'</td></tr>';});
 el('rptTbl').innerHTML=h;
 var acts=[];
 if(INSPECT&&INSPECT.res){CATS.forEach(function(c){if(FILTER&&FILTER!==c)return;var res=INSPECT.res[INSMAP[c]]||[];var items=(INSPECT.items&&INSPECT.items[INSMAP[c]])||[];res.forEach(function(x,i){if(x.r==='불량'||x.r==='주의')acts.push({c:c,item:(items[i]&&items[i].t)||'',loc:x.loc,r:x.r,a:x.a,actBy:x.actBy,actDate:x.actDate});});});}
 el('inspCnt').textContent=acts.length+'건'+(FILTER?(' ('+FILTER+')'):'');
 var ih='<tr><th style="width:64px">항목분류</th><th>점검항목</th><th style="width:120px">위치/설비</th><th style="width:60px">결과</th><th>조치사항</th><th style="width:80px">조치자</th><th style="width:96px">조치일자</th></tr>';
 if(!acts.length)ih+='<tr><td colspan="7" class="empty">✅ 점검 이상 항목 없음</td></tr>';
 acts.sort(function(a,b){return (a.r==='불량'?0:1)-(b.r==='불량'?0:1);});
 acts.forEach(function(a){ih+='<tr><td><b>'+esc(a.c)+'</b></td><td>'+esc(a.item)+'</td><td>'+esc(a.loc||'-')+'</td><td><span class="pill '+a.r+'">'+a.r+'</span></td><td>'+esc(a.a||'(조치 미입력)')+'</td><td>'+esc(a.actBy||'-')+'</td><td>'+esc(a.actDate||'-')+'</td></tr>';});
 el('inspTbl').innerHTML=ih;
}
async function reload(){el('cloud').textContent='● 불러오는 중…';await load();el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';}
async function load(){var a=await Promise.all([getKey('safety_reports'),getKey('safety_inspect_v2'),getKey('safety_dash_cfg')]);REPORTS=normRep(a[0]);INSPECT=a[1]||null;CFG=a[2]||{noAccSince:''};render();}
async function boot(){
 render();
 if(!sb){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';return;}
 try{var probe=await sb.from('app_state').select('key').limit(1);if(probe&&probe.error){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';return;}
  el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';await load();
  try{['safety_reports','safety_inspect_v2'].forEach(function(k){sb.channel('sd_'+k).on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'key=eq.'+k},function(){load();}).subscribe();});}catch(e){}
 }catch(e){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';}
}
boot();
</script>
</body></html>
