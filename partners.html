<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 ERP · 업체 관리 (고객사·공급사 통합)</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--panel3:#21262d;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;--kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px}header .sub{color:var(--dim);font-size:11.5px}
header .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel3);color:var(--txt);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--blue)}.btn.pri{background:#1f6feb;border-color:#1f6feb;color:#fff}.btn.sm{padding:3px 9px;font-size:11px}.btn.d{color:var(--red);border-color:#5c2326}
.btn.on{border-color:var(--blue);color:var(--blue)}
.search{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--txt);width:200px}
.wrap{padding:16px 18px 60px;max-width:1000px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel3);color:var(--dim);border:none;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:#1f6feb;color:#fff}
.st{font-size:12px;color:var(--dim);font-family:var(--mono);margin-left:auto}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.list{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
table.list th{background:var(--panel3);font-size:11px;color:var(--dim)}
table.list tr:hover td{background:var(--panel2)}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.g-고객사{background:rgba(88,166,255,.18);color:var(--blue)}.g-공급사{background:rgba(210,153,34,.18);color:var(--amber)}.g-외주{background:rgba(139,148,158,.2);color:var(--dim)}
.code{font-family:var(--mono);color:var(--faint)}
.empty{padding:26px;text-align:center;color:var(--faint)}
/* 표형식 양식(고객사·공급사 공통) */
.ctbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ctbl th,.ctbl td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle}
.ctbl th{background:var(--panel3);width:130px;text-align:left;white-space:nowrap;font-weight:700;color:var(--dim)}
.ctbl td input,.ctbl td select{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:6px;color:var(--txt);font:inherit;font-size:12.5px;padding:5px 7px}
.ctbl td input:focus,.ctbl td select:focus{border-color:var(--blue);outline:none}
.ctbl tr.csec th{background:#182338;color:var(--blue);text-align:center;letter-spacing:2px;font-size:11.5px}
.warn{display:none;background:#3a2417;border:1px solid #5c4a15;border-radius:10px;padding:14px 16px;color:#f0c674;font-size:13px;line-height:1.7;margin-bottom:14px}
.warn.on{display:block}.warn code{display:block;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--txt)}
</style></head><body>
<header>
 <h1>승정 ERP · 업체 관리</h1><span class="sub">고객사·공급사·외주 — <b style="color:var(--blue)">동일 양식</b></span>
 <span class="sp">
  <input class="search" id="q" placeholder="업체명·대표·담당자 검색…" oninput="render()">
  <a class="btn" href="index2.html">← 메인</a>
 </span>
</header>
<div class="wrap">
 <div class="warn" id="warn"></div>
 <div id="page"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://gyasbmiordkxcfpwgvio.supabase.co","sb_publishable_oMdTYbr11auTzSaYwY9Jew_qbKO3SbF");
/* 고객사·공급사 공통 양식 항목 (완전히 동일) */
var CF=[
 {sec:"기본 정보"},
 {k:"gubun",l:"구분",t:"gubun"},{k:"name",l:"업체명(상호)"},
 {k:"bizno",l:"사업자등록번호"},{k:"ceo",l:"대표자"},
 {k:"item",l:"품목"},{k:"bizType",l:"업태"},
 {k:"bizItem",l:"종목"},{k:"tel",l:"대표 전화"},
 {k:"fax",l:"팩스"},{k:"addr",l:"주소",wide:1},
 {sec:"결제 · 세금계산서"},
 {k:"pay",l:"결제조건"},{k:"taxEmail",l:"세금계산서 이메일"},
 {sec:"담당자 연락처"},
 {k:"mgrName",l:"담당자"},{k:"mgrRole",l:"담당업무"},
 {k:"mgrMobile",l:"연락처(휴대폰)"},{k:"mgrEmail",l:"이메일"},
 {sec:"기타"},
 {k:"status",l:"거래상태",t:"status"},{k:"remark",l:"비고",wide:1}
];
var COLS=CF.filter(function(f){return f.k;}).map(function(f){return f.k;});
var GUBUN=["고객사","공급사","외주"], PRE={"고객사":"CUST","공급사":"VEND","외주":"OUT"};
var ROWS=[], VIEW="list", EDIT=null, FILT="전체", EB={};
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function eatt(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function _f(id){for(var i=0;i<ROWS.length;i++)if(ROWS[i].id===id)return ROWS[i];return null;}
function nextCode(g){var pre=PRE[g]||"CUST",mx=0;ROWS.forEach(function(r){var m=(""+(r.code||"")).match(new RegExp(pre+"-(\\d+)"));if(m){var n=+m[1];if(n>mx)mx=n;}});return pre+"-"+("00"+(mx+1)).slice(-3);}

async function boot(){ var r=await sb.from("partners").select("*").order("id");
 if(r.error){ showWarn(); return; }
 document.getElementById("warn").classList.remove("on"); ROWS=r.data||[]; render();
 try{ sb.channel("pt_rt").on("postgres_changes",{event:"*",schema:"public",table:"partners"},function(){ if(VIEW==="list") reload(); }).subscribe(); }catch(e){}
}
async function reload(){ var r=await sb.from("partners").select("*").order("id"); if(r.error)return; ROWS=r.data||[]; render(); }
function showWarn(){ var w=document.getElementById("warn"); w.classList.add("on");
 w.innerHTML='⚠ <b>업체 저장칸(partners 표)이 아직 없습니다.</b> Supabase → SQL Editor 에 아래를 붙여넣고 Run 하세요:'+
 '<code>create table if not exists partners (\n  id bigserial primary key, code text, gubun text default \'고객사\',\n  name text, bizno text, ceo text, item text, bizType text, bizItem text,\n  tel text, fax text, addr text, pay text, taxEmail text,\n  mgrName text, mgrRole text, mgrMobile text, mgrEmail text,\n  status text default \'거래중\', remark text, updated_at timestamptz default now());\nalter table partners enable row level security;\ndrop policy if exists "allow all" on partners;\ncreate policy "allow all" on partners for all to anon using(true) with check(true);\nalter table partners replica identity full;\ndo $$ begin begin alter publication supabase_realtime add table partners;\n  exception when duplicate_object then null; end; end $$;</code>';
 document.getElementById("page").innerHTML='<div class="empty">위 SQL 실행 후 새로고침(F5) 하세요.</div>';
}

function setFilt(g){FILT=g;render();}
function render(){
 if(VIEW==="edit"){ renderForm(); return; }
 var q=(document.getElementById("q").value||"").trim().toLowerCase();
 var list=ROWS.filter(function(r){ if(FILT!=="전체"&&(r.gubun||"고객사")!==FILT)return false;
   if(!q)return true; return ((r.name||"")+" "+(r.ceo||"")+" "+(r.mgrName||"")+" "+(r.code||"")).toLowerCase().indexOf(q)>=0; });
 var cnt={고객사:0,공급사:0,외주:0}; ROWS.forEach(function(r){var g=r.gubun||"고객사";if(cnt[g]!=null)cnt[g]++;});
 var h='<div class="bar"><div class="seg">'+["전체","고객사","공급사","외주"].map(function(g){return '<button class="'+(FILT===g?"on":"")+'" onclick="setFilt(\''+g+'\')">'+g+(g!=="전체"?" "+(cnt[g]||0):" "+ROWS.length)+'</button>';}).join('')+'</div>'+
   '<button class="btn pri" onclick="startNew()">＋ 업체 등록</button><span class="st" id="stt"></span></div>';
 if(!list.length){ h+='<div class="empty">업체가 없습니다. <b>＋ 업체 등록</b>으로 추가하세요.</div>'; document.getElementById("page").innerHTML=h; return; }
 h+='<div class="scroll"><table class="list"><thead><tr><th>구분</th><th>코드</th><th>업체명</th><th>대표</th><th>담당자</th><th>연락처</th><th>상태</th><th>관리</th></tr></thead><tbody>';
 list.forEach(function(r){ var g=r.gubun||"고객사";
  h+='<tr><td><span class="pill g-'+esc(g)+'">'+esc(g)+'</span></td><td class="code">'+esc(r.code)+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.ceo)+'</td><td>'+esc(r.mgrName)+'</td><td>'+esc(r.mgrMobile)+'</td><td>'+esc(r.status||"거래중")+'</td>'+
   '<td style="white-space:nowrap"><button class="btn sm" onclick="startEdit('+r.id+')">편집</button> <button class="btn sm d" onclick="del('+r.id+')">삭제</button></td></tr>';
 });
 h+='</tbody></table></div>';
 document.getElementById("page").innerHTML=h;
}
function cell(f){
 var v=EB[f.k];
 if(f.t==="gubun") return '<select onchange="EB.gubun=this.value">'+GUBUN.map(function(g){return '<option'+((v||"고객사")===g?" selected":"")+'>'+g+'</option>';}).join('')+'</select>';
 if(f.t==="status") return '<select onchange="EB.status=this.value">'+["거래중","중지"].map(function(x){return '<option'+((v||"거래중")===x?" selected":"")+'>'+x+'</option>';}).join('')+'</select>';
 return '<input value="'+eatt(v)+'" oninput="EB[\''+f.k+'\']=this.value">';
}
function renderForm(){
 var isNew=(EDIT===null);
 var h='<div class="bar"><button class="btn" onclick="cancel()">← 목록</button><b style="font-size:15px">'+(isNew?"신규 업체 등록":"업체 수정")+'</b>'+
   '<span class="st">코드 '+(isNew?nextCode(EB.gubun||"고객사")+" (자동)":esc(EB.code))+'</span></div>';
 h+='<table class="ctbl"><tbody>'; var pend=[];
 function flush(){ if(pend.length){ h+='<tr>'; pend.forEach(function(f){h+='<th>'+esc(f.l)+'</th><td>'+cell(f)+'</td>';}); if(pend.length===1)h+='<th></th><td></td>'; h+='</tr>'; pend=[]; } }
 CF.forEach(function(f){ if(f.sec){flush();h+='<tr class="csec"><th colspan="4">'+esc(f.sec)+'</th></tr>';return;}
   if(f.wide){flush();h+='<tr><th>'+esc(f.l)+'</th><td colspan="3">'+cell(f)+'</td></tr>';return;} pend.push(f); if(pend.length===2)flush(); });
 flush(); h+='</tbody></table>';
 h+='<div class="bar" style="margin-top:12px"><button class="btn pri" onclick="save()">💾 저장</button><button class="btn" onclick="cancel()">취소</button>'+
   (isNew?'':'<button class="btn sm d" style="margin-left:auto" onclick="del('+EDIT+')">삭제</button>')+'</div>';
 document.getElementById("page").innerHTML=h;
}
function startNew(){ EDIT=null; EB={gubun:(FILT!=="전체"?FILT:"고객사"),status:"거래중"}; VIEW="edit"; render(); }
function startEdit(id){ var r=_f(id); if(!r)return; EDIT=id; EB={}; COLS.forEach(function(k){EB[k]=r[k];}); if(!EB.gubun)EB.gubun="고객사"; if(!EB.status)EB.status="거래중"; VIEW="edit"; render(); }
function cancel(){ VIEW="list"; EDIT=null; EB={}; render(); }
async function save(){
 if(!EB.name||!String(EB.name).trim()){alert("업체명은 필수입니다.");return;}
 var rec={}; COLS.forEach(function(k){rec[k]=(EB[k]==null?"":String(EB[k]));}); rec.updated_at=new Date().toISOString();
 if(EDIT===null){ rec.code=nextCode(rec.gubun||"고객사"); var res=await sb.from("partners").insert(rec).select(); if(res.error){alert("저장 실패: "+res.error.message);return;} ROWS.push(res.data[0]); }
 else{ var r2=await sb.from("partners").update(rec).eq("id",EDIT); if(r2.error){alert("저장 실패: "+r2.error.message);return;} var r=_f(EDIT); if(r)for(var k in rec)r[k]=rec[k]; }
 VIEW="list"; EDIT=null; EB={}; render();
}
async function del(id){ var r=_f(id); if(!confirm("이 업체를 삭제할까요?"+(r?("\n"+(r.name||"")):"")))return; var res=await sb.from("partners").delete().eq("id",id); if(res.error){alert("삭제 실패: "+res.error.message);return;} ROWS=ROWS.filter(function(x){return x.id!==id;}); VIEW="list"; EDIT=null; render(); }
boot();
</script>
</body></html>
