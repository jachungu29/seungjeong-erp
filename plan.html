<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생산계획현황 · 클라우드</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#eef1f6;color:#1c2430;font-family:Pretendard,"Malgun Gothic",sans-serif}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
#load .sp{width:38px;height:38px;border:4px solid #c7d3e6;border-top-color:#2563eb;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#load .t{font-size:14px;color:#5b6472}
#load .s{font-family:Consolas,monospace;font-size:12px;color:#8a93a3}
#err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:6}
#err.on{display:flex}#err h2{margin:0;font-size:18px}#err p{color:#5b6472;font-size:14px;max-width:440px;margin:0}
#err a{background:#2563eb;color:#fff;text-decoration:none;font-weight:800;padding:10px 20px;border-radius:10px;font-size:14px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frame.on{display:block}
</style></head><body>
<div id="load"><div class="sp"></div><div class="t">클라우드에서 생산계획현황을 불러오는 중…</div><div class="s" id="st">연결 중</div></div>
<div id="err"><div style="font-size:40px">📥</div><h2>업로드된 생산계획 자료가 없습니다</h2><p id="emsg">먼저 생산계획 HTML을 클라우드에 올려주세요.</p><a href="apps.html">＋ 앱 파일 삽입 화면 열기</a></div>
<iframe id="frame"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://gyasbmiordkxcfpwgvio.supabase.co","sb_publishable_oMdTYbr11auTzSaYwY9Jew_qbKO3SbF");
function st(t){var e=document.getElementById("st");if(e)e.textContent=t;}
function fail(msg){document.getElementById("load").style.display="none";if(msg)document.getElementById("emsg").textContent=msg;document.getElementById("err").classList.add("on");}
async function boot(){
 st("앱 목록 조회 중");
 var r=await sb.from("custom_pages").select("id,title,slug,updated_at").order("updated_at",{ascending:false});
 if(r.error){fail("클라우드 연결 오류: "+r.error.message);return;}
 var list=r.data||[];
 if(!list.length){fail();return;}
 // 제목/슬러그에 'prod' 또는 '생산계획'이 든 것을 우선 선택 (BOM 은 제외)
 var pick=list.filter(function(p){var s=((p.title||"")+" "+(p.slug||"")).toLowerCase();return s.indexOf("prod")>=0||s.indexOf("생산계획")>=0;})[0];
 if(!pick){fail("생산계획 자료를 찾지 못했습니다. (custom_pages 에 PROD_PLAN 없음)");return;}
 st("불러오는 중: "+(pick.title||"생산계획"));
 var d=await sb.from("custom_pages").select("html,title").eq("id",pick.id).single();
 if(d.error||!d.data||!d.data.html){fail("내용을 읽지 못했습니다.");return;}
 var f=document.getElementById("frame");
 f.onload=function(){document.getElementById("load").style.display="none";f.classList.add("on");document.title=(d.data.title||"생산계획")+" · 클라우드";};
 f.srcdoc=d.data.html;
 setTimeout(function(){if(document.getElementById("load").style.display!=="none"){document.getElementById("load").style.display="none";f.classList.add("on");}},2500);
}
boot();
</script>
</body></html>
