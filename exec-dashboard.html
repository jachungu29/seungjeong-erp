<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 ERP · 경영자 대시보드</title>
<style>
:root{
 --bg:#f0eee9;--card:#ffffff;--line:#e7e3db;--line2:#efece5;
 --txt:#1d1f24;--dim:#8b8f96;--faint:#a7abb2;
 --blue:#2f6feb;--green:#2f9e44;--amber:#d08700;--red:#d64545;--slate:#4b5563;
 --kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px;line-height:1.5}
.topbar{position:sticky;top:0;z-index:5;height:6px;background:#111318}
.wrap{max-width:1180px;margin:0 auto;padding:26px 26px 90px}
.crumb{font-size:12px;color:var(--dim)}
h1{font-size:26px;font-weight:800;margin:6px 0 4px}
.lead{color:var(--dim);font-size:13px}
.hd-r{float:right;margin-top:-30px}
.btn{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.sec h2{font-size:15px;font-weight:800;margin:0}
.sec .tag{margin-left:auto;font-size:11px;color:var(--faint)}
/* KPI 카드 */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--slate);border-radius:12px;padding:15px 16px}
.kpi .lbl{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;margin:8px 0 4px;line-height:1.05}
.kpi .val small{font-size:13px;font-weight:700;color:var(--dim);margin-left:2px}
.kpi .sub{font-size:11.5px}
.kpi.b{border-left-color:var(--blue)} .kpi.g{border-left-color:var(--green)}
.kpi.r{border-left-color:var(--red)}
.kpi.b .sub{color:var(--blue)} .kpi.g .sub{color:var(--green)} .kpi.r .sub{color:var(--red)}
/* 부서 스코어카드 */
.scards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
@media(max-width:980px){.scards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.scards{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.sc .top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.sc .ico{width:38px;height:38px;border-radius:10px;background:#20242c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sc .nm{font-size:15px;font-weight:800}
.sc .team{font-size:11px;color:var(--faint);margin-top:1px}
.sc .stt{margin-left:auto;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.stt .dt{width:8px;height:8px;border-radius:50%}
.st-양호 .dt{background:var(--green)} .st-양호{color:var(--green)}
.st-주의 .dt{background:var(--amber)} .st-주의{color:var(--amber)}
.st-위험 .dt{background:var(--red)} .st-위험{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{color:var(--dim);font-size:11px;font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line2)}
tbody td{padding:8px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.metric{color:var(--txt)} td.act{font-weight:800} td.tgt{color:var(--faint);font-size:11.5px}
td.rate{width:88px}
.mini{height:6px;background:#efece6;border-radius:4px;overflow:hidden;display:inline-block;width:52px;vertical-align:middle}
.mini i{display:block;height:100%;border-radius:4px}
.rate .pct{font-size:10.5px;color:var(--dim);margin-left:6px}
td.dot{text-align:center;width:26px}
.dt2{display:inline-block;width:9px;height:9px;border-radius:50%}
.d-r{background:var(--red)} .d-a{background:var(--amber)} .d-g{background:var(--green)} .d-b{background:var(--blue)}
.sc .more{display:flex;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--dim)}
.sc .more a{margin-left:auto;color:var(--blue);text-decoration:none;font-weight:700}
/* 경영 분석 */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 4px;font-size:14px;font-weight:800;display:flex;align-items:baseline}
.panel h3 .t{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
.brow{display:flex;align-items:center;gap:11px;margin:13px 0;font-size:12.5px}
.brow .nm{width:74px;color:var(--txt)}
.brow .tr{flex:1;height:14px;background:#efece6;border-radius:7px;overflow:hidden}
.brow .fl{height:100%;border-radius:7px}
.brow .n{width:40px;text-align:right;font-family:var(--mono);font-weight:800}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{color:var(--dim);font-size:11px;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2)}
.dtable td{padding:9px 6px;border-bottom:1px solid var(--line2)}
.empty{color:var(--faint);font-size:12.5px;padding:14px 6px}
.live{font-size:10px;font-weight:700;color:var(--green);background:rgba(47,158,68,.12);border-radius:20px;padding:1px 7px;margin-left:6px}
</style></head><body>
<div class="topbar"></div>
<div class="wrap">
 <div class="hd-r">
  <span class="btn" id="stBtn">클라우드 …</span>
  <button class="btn" onclick="loadReal()">🔄 새로고침</button>
  <a class="btn" href="index2.html">← 메인</a>
 </div>
 <div class="crumb">대시보드 / 경영자 대시보드</div>
 <h1>경영자 대시보드</h1>
 <div class="lead">전사·부서별 KPI 실시간 집계 · <span id="asof">2026-06-01</span> 기준</div>

 <div class="sec"><h2>전사 핵심 경영지표</h2><span class="tag">실시간</span></div>
 <div class="kpis" id="kpiTop"></div>

 <div class="sec"><h2>경영 요약 · 등록 현황</h2><span class="tag">실데이터 기반</span></div>
 <div class="kpis" id="kpiReg"></div>

 <div class="sec"><h2>부서별 KPI 스코어카드</h2><span class="tag">지표 · 실적 · 목표 · 달성률 · 상태</span></div>
 <div class="scards" id="scards"></div>

 <div class="sec"><h2>경영 분석</h2></div>
 <div class="row2">
  <div class="panel"><h3>부서별 종합 달성률 <span class="t">목표 대비 %</span></h3><div id="deptAch"></div></div>
  <div class="panel"><h3>불량코드 Top 5 <span class="t">금주</span></h3><div id="defTop"></div></div>
 </div>

 <div class="sec"></div>
 <div class="panel">
  <h3>납기 임박 수주 (D-3 이내) <span class="t">생산부 · 영업 공유</span></h3>
  <table class="dtable"><thead><tr><th>수주번호</th><th>거래처</th><th>고객 품번</th><th>수량</th><th>납기</th><th>상태</th></tr></thead>
  <tbody id="dueRows"><tr><td colspan="6" class="empty">D-3 이내 납기 작업지시 없음</td></tr></tbody></table>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script>
/* ============================================================
   경영자 대시보드 — 첨부 화면 그대로.
   · 대부분 지표는 각 부서 시스템 값(기본치).
   · BOM(등록 완제품)·활성 거래처는 클라우드(Supabase) 실데이터로 자동 반영.
   ============================================================ */

/* 전사 핵심 경영지표 (6) : [아이콘,라벨,값,단위,보조,색] */
var TOP=[
 ["🏭","금일 생산실적","0","EA","지시 64,242 · 달성 0%","r"],
 ["📈","종합설비효율","0.0","%","가동율 100%","r"],
 ["⚠️","공정 불량률","100.00","%","불량 7EA","r"],
 ["🚚","납기준수율","0","%","작업지시 12건","r"],
 ["📊","금월 수주금액","₩3.6","억","수주 6건","b"],
 ["🛡️","무재해 일수","142","일","연속 · 목표 365","g"]
];
/* 경영 요약·등록 현황 (6) : id로 실데이터 덮어씀 */
var REG=[
 ["📋","수주잔량(미납)","770,000","EA","6건 수주","b","regBacklog"],
 ["💳","미납 수주금액","₩3.6","억","미생산 잔액","b","regUnpaid"],
 ["🏢","활성 거래처","6","사","CUST 등록","g","regPartner"],
 ["🧊","등록 완제품(BOM)","93","품번","BOM 최상위","g","regBom"],
 ["⚙️","보유 설비","4","대","설비대장","g","regFac"],
 ["📐","금형·계측기","3 · 47","EA","금형/계측기","g","regMold"]
];
/* 부서별 스코어카드 : 상태색 st-양호/주의/위험, 행 [지표,실적,목표,달성%,dot] dot=r/a/g/b */
var DEPT=[
 {nm:"생산부",team:"생산관리팀 · 생산운영팀",ico:"⚙️",st:"주의",n:4,rows:[
   ["생산계획 달성률","0.0%","100%",0,"r"],["일 생산실적","0","64,242",0,"r"],
   ["라인 가동률","99.5%","90%",100,"g"],["납기 준수율","0%","98%",0,"r"]]},
 {nm:"품질부",team:"품질보증(QM) · 품질관리",ico:"📋",st:"위험",n:5,rows:[
   ["공정 불량률","100.00%","1.50%",2,"r"],["출하검사 합격","99.4%","99.5%",99,"g"],
   ["수입검사 합격","98.1%","98.0%",100,"g"],["고객 클레임","2 건","0",40,"r"],
   ["8D 시정 진행","3 건","0",55,"a"]]},
 {nm:"생산기술부",team:"설비 · 금형 · 기술개발",ico:"🛠️",st:"주의",n:5,rows:[
   ["설비종합효율","0.0%","88%",0,"r"],["MTBF 고장간격","312h","350h",89,"a"],
   ["MTTR 수리시간","1.8h","1.5h",83,"r"],["PM 이행률","92%","100%",92,"a"],
   ["금형타수 경고","2 set","0",60,"a"]]},
 {nm:"원가관리부",team:"원가팀 · 원가분석",ico:"🧮",st:"주의",n:4,rows:[
   ["표준대비 실제","103.2%","100%",78,"r"],["재료비율","61.5%","60%",88,"a"],
   ["불량 손실액","₩1.14M","₩0.8M",70,"r"],["가공비 절감","2.1%","3.0%",70,"a"]]},
 {nm:"관리부",team:"인사 · 경리 · 공장관리",ico:"🧑‍💼",st:"양호",n:5,rows:[
   ["재직 인원","218명","–",100,"b"],["출근율","97.3%","97%",100,"g"],
   ["평균 잔업","18.5h","20h",93,"g"],["비자 만료임박","4 명","0",50,"a"],
   ["채권 회수율","95%","95%",100,"g"]]},
 {nm:"안전·환경",team:"3정5S · 안전 · 소방 · ESG · CFT",ico:"🛡️",st:"양호",n:5,rows:[
   ["무재해 일수","142일","–",100,"g"],["안전점검 이행","100%","100%",100,"g"],
   ["3정5S 점수","88점","90",98,"a"],["소방점검","적합","–",100,"g"],
   ["ESG·CFT 개선","7 건","5",100,"g"]]}
];
/* 부서별 종합 달성률 */
var ACH=[["생산부",0,"#d64545"],["품질부",2,"#d64545"],["생산기술부",0,"#d64545"],
 ["원가관리부",84,"#d08700"],["관리부",98,"#2f9e44"],["안전·환경",100,"#2f9e44"]];
/* 불량코드 Top5 */
var DEF=[["M15",1,"#d64545"],["M08",1,"#d64545"],["M09",1,"#d08700"],["M11",1,"#d08700"],["P08",1,"#d08700"]];

function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function kpiHTML(a){
 return a.map(function(k){
  return '<div class="kpi '+k[5]+'"'+(k[6]?' id="'+k[6]+'"':'')+'>'+
   '<div class="lbl">'+k[0]+' '+esc(k[1])+'</div>'+
   '<div class="val">'+esc(k[2])+' <small>'+esc(k[3])+'</small></div>'+
   '<div class="sub">'+esc(k[4])+'</div></div>';
 }).join("");
}
function rateColor(p){return p>=100?"#2f9e44":p>=80?"#d08700":"#d64545";}
function scHTML(d){
 var rows=d.rows.map(function(r){
  return '<tr><td class="metric">'+esc(r[0])+'</td><td class="act">'+esc(r[1])+'</td>'+
   '<td class="tgt">'+esc(r[2])+'</td>'+
   '<td class="rate"><span class="mini"><i style="width:'+r[3]+'%;background:'+rateColor(r[3])+'"></i></span><span class="pct">'+r[3]+'%</span></td>'+
   '<td class="dot"><span class="dt2 d-'+r[4]+'"></span></td></tr>';
 }).join("");
 return '<div class="sc"><div class="top"><div class="ico">'+d.ico+'</div>'+
  '<div><div class="nm">'+esc(d.nm)+'</div><div class="team">'+esc(d.team)+'</div></div>'+
  '<div class="stt st-'+d.st+'"><span class="dt"></span>'+d.st+'</div></div>'+
  '<table><thead><tr><th>지표</th><th>실적</th><th>목표</th><th>달성률</th><th style="text-align:center">상태</th></tr></thead>'+
  '<tbody>'+rows+'</tbody></table>'+
  '<div class="more">'+d.n+'개 핵심지표 <a href="legacy.html" target="_blank">상세 보기 ›</a></div></div>';
}
function barHTML(arr,max){
 return arr.map(function(a){var pct=max?Math.round(a[1]/max*100):a[1];
  return '<div class="brow"><span class="nm">'+esc(a[0])+'</span>'+
   '<span class="tr"><span class="fl" style="width:'+pct+'%;background:'+a[2]+'"></span></span>'+
   '<span class="n" style="color:'+a[2]+'">'+a[1]+(max?'':'%')+'</span></div>';
 }).join("");
}
/* 렌더 */
document.getElementById("kpiTop").innerHTML=kpiHTML(TOP);
document.getElementById("kpiReg").innerHTML=kpiHTML(REG);
document.getElementById("scards").innerHTML=DEPT.map(scHTML).join("");
document.getElementById("deptAch").innerHTML=barHTML(ACH,0);      /* 값 자체가 % */
document.getElementById("defTop").innerHTML=barHTML(DEF,1);       /* count → 100% 기준 */

/* ===== 클라우드 실데이터 반영 (BOM 최상위 · 활성 거래처) ===== */
function setCardVal(id,val,sub){
 var el=document.getElementById(id);if(!el)return;
 var v=el.querySelector(".val"),s=el.querySelector(".sub");
 if(v){var unit=v.querySelector("small");v.firstChild.nodeValue=val+" ";}
 if(sub&&s)s.innerHTML=sub+' <span class="live">실시간</span>';
}
async function loadReal(){
 var btn=document.getElementById("stBtn");
 if(!window.SB){btn.textContent="로컬 모드";btn.style.color="#a7abb2";return;}
 btn.textContent="불러오는 중…";
 try{
  var bom=await window.SB.from("bom").select("lv");
  var par=await window.SB.from("partners").select("gubun");
  var ok=false;
  if(bom&&!bom.error){var d=bom.data||[],lv0=0;d.forEach(function(x){if((parseInt(x.lv,10)||0)===0)lv0++;});
   setCardVal("regBom",lv0,"BOM 최상위");ok=true;}
  if(par&&!par.error){var p=par.data||[],cust=0;p.forEach(function(x){var g=x.gubun||"고객사";if(g!=="공급사"&&g!=="외주")cust++;});
   setCardVal("regPartner",p.length,"CUST "+cust);ok=true;}
  btn.textContent=ok?"클라우드 연결됨 ✓":"연결 확인 필요";
  btn.style.color=ok?"#2f9e44":"#d64545";
 }catch(e){btn.textContent="연결 확인 필요";btn.style.color="#d64545";}
}
loadReal();
try{ if(window.SB) window.SB.channel("exec_rt")
  .on("postgres_changes",{event:"*",schema:"public",table:"bom"},loadReal)
  .on("postgres_changes",{event:"*",schema:"public",table:"partners"},loadReal).subscribe(); }catch(e){}
</script>
</body></html>
