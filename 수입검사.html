<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수입검사 · 승정 ERP</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png">
<style>
:root{--navy:#003D54;--teal:#006E8A;--gold:#F5A623;--bg:#eef1f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#1c2430;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
header{position:fixed;top:0;left:0;right:0;height:50px;z-index:20;background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;padding:0 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:8px;margin-left:14px}
.tab{border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:7px 15px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--navy);border-color:#fff}
.frwrap{position:fixed;top:50px;left:0;right:0;bottom:0}
.frwrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.hide{display:none!important}
</style></head><body>
<header>
 <h1>🔎 수입검사</h1>
 <div class="tabs">
  <button class="tab on" id="t-doc" onclick="sel('doc')">📋 업무 절차서</button>
  <button class="tab" id="t-meas" onclick="sel('meas')">🔬 측정/검사 입력</button>
 </div>
</header>
<div class="frwrap" id="pane-doc"><iframe id="docfr" title="수입검사 업무 절차서" src="수입검사절차서.html"></iframe></div>
<div class="frwrap hide" id="pane-meas"><iframe id="measfr" title="SPC/CPK 측정관리" data-src="SPC측정관리.html?tab=input"></iframe></div>
<script>
function sel(t){
 var doc=t==='doc';
 document.getElementById('t-doc').classList.toggle('on',doc);
 document.getElementById('t-meas').classList.toggle('on',!doc);
 document.getElementById('pane-doc').classList.toggle('hide',!doc);
 document.getElementById('pane-meas').classList.toggle('hide',doc);
 if(!doc){var fr=document.getElementById('measfr');if(!fr.src)fr.src=fr.getAttribute('data-src');}
}
try{if(new URLSearchParams(location.search).get('view')==='meas')sel('meas');}catch(e){}
</script>
</body></html>
