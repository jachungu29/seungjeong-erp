const CUSTS = ['전체','현담산업','현담테크','쌍신전자','TSMOST'];
const GUBUNS = ['전체','원재료','부품'];
let selCust='전체', selGubun='전체', kw='';

function count(cust, gubun){
  return DATA.filter(d =>
    (cust==='전체'||d.cust===cust) && (gubun==='전체'||d.gubun===gubun)).length;
}
function mkBtns(el, list, getSel, setSel, isCust){
  el.innerHTML='';
  list.forEach(v=>{
    const b=document.createElement('button');
    b.className='sw'+(getSel()===v?' on':'');
    const n = isCust ? count(v, selGubun) : count(selCust, v);
    b.innerHTML = v + '<span class="cnt">'+n+'건</span>';
    b.onclick=()=>{ setSel(v); render(); };
    el.appendChild(b);
  });
}
function render(){
  mkBtns(document.getElementById('custBtns'), CUSTS, ()=>selCust, v=>selCust=v, true);
  mkBtns(document.getElementById('gubunBtns'), GUBUNS, ()=>selGubun, v=>selGubun=v, false);
  const q = kw.trim().toLowerCase();
  const rows = DATA.filter(d=>{
    if(selCust!=='전체' && d.cust!==selCust) return false;
    if(selGubun!=='전체' && d.gubun!==selGubun) return false;
    if(q){
      const hay=(d.ship+' '+d.pno+' '+d.pname+' '+d.vendor+' '+d.mat).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const tb=document.getElementById('tb');
  tb.innerHTML = rows.map(d=>`
    <tr>
      <td>${d.no}</td>
      <td>${d.cust}</td>
      <td><span class="${d.gubun==='원재료'?'tag-raw':'tag-part'}">${d.gubun}</span></td>
      <td class="l">${d.ship}</td>
      <td>${d.pno}</td>
      <td class="l">${d.pname}</td>
      <td>${d.form}</td>
      <td>${d.mat}</td>
      <td>${d.unit}</td>
      <td>${d.vendor}</td>
      <td><span class="badge ${d.yn==='有'?'yu':'mu'}">${d.yn}</span></td>
      <td>${d.itype}</td>
      <td>${d.doc}</td>
      <td>${d.ncr}</td>
    </tr>`).join('');
  document.getElementById('empty').style.display = rows.length? 'none':'block';
  document.getElementById('info').innerHTML =
    `조회 결과 <b>${rows.length}</b> 건 <span style="margin-left:8px;">( ${selCust} · ${selGubun} )</span>`;
}
document.getElementById('q').addEventListener('input', e=>{ kw=e.target.value; render(); });
render();
</script>
