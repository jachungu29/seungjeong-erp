<style>
:root{--navy:#003D54;--teal:#006E8A;--gold:#F5A623;--bg:#eef1f6;--card:#fff;--text:#1c2430;--line:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.cloud{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);font-weight:600}
.cloud.on{background:#1e8e4e}.cloud.off{background:#7a8699}
.status{font-size:12px;opacity:.95;min-width:90px;text-align:right}
.savebtn{background:var(--gold);color:#3a2a00;border:0;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.savebtn:hover{filter:brightness(1.06)}.savebtn:active{transform:translateY(1px)}
.wrap{padding:16px 20px 60px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;color:var(--navy);margin-top:2px}
.kpi .u{font-size:11px;color:var(--mut)}
.kpi.gold{border-left-color:var(--gold)}.kpi.gold .v{color:#b8860b}
.acctsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ac{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:10px;padding:10px 12px}
.ac .an{font-size:13px;font-weight:800;color:var(--navy)}
.ac .av{font-size:12px;color:var(--mut);margin-top:3px}
.ac .am{font-size:15px;font-weight:800;color:#b8860b;margin-top:2px}
.ac-수직사출{border-top-color:#006E8A}.ac-수평사출{border-top-color:#1565C0}.ac-이중사출{border-top-color:#7C3AED}.ac-조립{border-top-color:#F5A623}
.ac{cursor:pointer;transition:.12s}.ac:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}.ac.on{box-shadow:0 0 0 2px var(--teal) inset}
.segtog{display:inline-flex;gap:3px;background:#e8eef4;border-radius:9px;padding:3px;flex-wrap:wrap}
.segbtn{border:0;background:transparent;color:var(--mut);font-family:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.segbtn:hover{color:var(--navy)}
.segbtn.on{background:var(--teal);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segbtn .sgc{font-size:10.5px;font-weight:800;background:rgba(0,0,0,.12);color:inherit;border-radius:10px;padding:0 6px;min-width:16px;text-align:center}
.segbtn.on .sgc{background:rgba(255,255,255,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ptitle{font-size:15px;font-weight:800;color:var(--navy)}
.psub{font-size:12px;color:var(--mut)}
.addbtn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.addbtn:hover{background:var(--navy)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1080px}
th{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;padding:9px 8px;white-space:nowrap;position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:middle}
tr:nth-child(even) td{background:#f8fafc}tr:hover td{background:#eef7fb}
td.idx{color:var(--mut);font-weight:700;width:32px}
input.f,select.f{width:100%;box-sizing:border-box;padding:6px 7px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:inherit;background:#fff;color:var(--text)}
input.f:focus,select.f:focus{outline:none;border-color:var(--teal);background:#f5fbfd}
input.f.r{text-align:right}
td.amt{font-weight:800;color:var(--navy);white-space:nowrap}
.st-접수{color:#0369a1;font-weight:700}.st-생산중{color:#b8860b;font-weight:700}.st-납품완료{color:#0d7a52;font-weight:700}.st-변경{color:#9333ea;font-weight:700}.st-취소{color:#C62828;font-weight:700}
.delbtn{background:#fff;color:#C62828;border:1px solid #E0A0A0;border-radius:6px;width:28px;height:28px;font-size:13px;cursor:pointer;font-weight:700}
.delbtn:hover{background:#FDECEC}
.empty{text-align:center;color:#94a3b8;padding:26px !important;font-size:13px}
tr.total td{background:#eef4f8 !important;font-weight:800;color:var(--navy);border-top:2px solid #b8d4e0}
.hint{font-size:11px;color:var(--mut);margin-top:8px}

function acctOptions(v){return ACCTS.map(a=>`<option${v===a?' selected':''}>${a}</option>`).join('');}
function setFilter(f){FILTER=f;render();}
function render(){
 let TQ=0,TA=0; const bya={};
 ROWS.forEach(r=>{const a=amtOf(r);TQ+=(parseFloat(r.qty)||0);TA+=a;const ac=r.acct||'(미분류)';bya[ac]=bya[ac]||{c:0,q:0,a:0};bya[ac].c++;bya[ac].q+=(parseFloat(r.qty)||0);bya[ac].a+=a;});
 const cnt={'전체':ROWS.length}; ACCTS.forEach(a=>cnt[a]=ROWS.filter(r=>(r.acct||'')===a).length);
 el('segtog').innerHTML=['전체'].concat(ACCTS).map(f=>`<button class="segbtn${FILTER===f?' on':''}" onclick="setFilter('${f}')">${f}<span class="sgc">${cnt[f]||0}</span></button>`).join('');
 let h=`<tr><th style="width:30px">#</th><th style="width:116px">수주번호</th><th style="width:118px">수주일자</th><th style="width:116px">거래처</th><th style="width:100px">구분</th><th style="width:132px">품번(BOM)</th><th>품명</th><th style="width:84px">수량</th><th style="width:80px">단가</th><th style="width:108px">금액</th><th style="width:118px">납기일</th><th style="width:94px">진행상태</th><th>변경사유</th><th>비고</th><th style="width:42px">삭제</th></tr>`;
 const vis=[]; ROWS.forEach((r,i)=>{if(FILTER==='전체'||(r.acct||'')===FILTER)vis.push({r:r,i:i});});
 if(!vis.length)h+=`<tr><td colspan="15" class="empty">${ROWS.length?('“'+FILTER+'” 구분의 수주가 없습니다.'):'등록된 수주가 없습니다. ＋신규 수주를 눌러 입력하세요.'}</td></tr>`;
 let tq=0,ta=0,dc=0;
 vis.forEach(function(o){var r=o.r,i=o.i,a=amtOf(r);tq+=(parseFloat(r.qty)||0);ta+=a;dc++;
  h+=`<tr><td class="idx">${dc}</td>`+
   `<td><input class="f" value="${esc(r.no)}" oninput="ed(${i},'no',this.value)"></td>`+
   `<td><input class="f" type="date" value="${esc(r.date)}" onchange="ed(${i},'date',this.value)"></td>`+
   `<td><input class="f" list="custdl" value="${esc(r.cust)}" oninput="ed(${i},'cust',this.value)" placeholder="거래처"></td>`+
   `<td><select class="f" onchange="ed(${i},'acct',this.value)"><option value="">-</option>${acctOptions(r.acct)}</select></td>`+
   `<td><input class="f" list="pnodl" value="${esc(r.pno)}" onchange="pickPno(${i},this.value)" placeholder="완제품 품번"></td>`+
   `<td><input class="f" value="${esc(r.name)}" oninput="ed(${i},'name',this.value)" placeholder="품명(자동)"></td>`+
   `<td><input class="f r cell-qty" data-i="${i}" value="${esc(r.qty)}" oninput="ed(${i},'qty',this.value)" onkeydown="cellKey(event,${i},'qty')" inputmode="numeric" title="Enter/↓ 다음행 · ↑ 윗행"></td>`+
   `<td><input class="f r cell-price" data-i="${i}" value="${esc(r.price)}" oninput="ed(${i},'price',this.value)" onkeydown="cellKey(event,${i},'price')" inputmode="numeric" title="Enter/↓ 다음행 · ↑ 윗행"></td>`+
   `<td class="amt">${cm(a)}</td>`+
   `<td><input class="f" type="date" value="${esc(r.due)}" onchange="ed(${i},'due',this.value)"></td>`+
   `<td><select class="f st-${esc(r.status||'접수')}" onchange="ed(${i},'status',this.value)">${STATUSES.map(s=>`<option${r.status===s?' selected':''}>${s}</option>`).join('')}</select></td>`+
   `<td><input class="f" value="${esc(r.reason)}" oninput="ed(${i},'reason',this.value)" placeholder="변경 시 사유"></td>`+
   `<td><input class="f" value="${esc(r.memo)}" oninput="ed(${i},'memo',this.value)"></td>`+
   `<td><button class="delbtn" onclick="del(${i})">✕</button></td></tr>`;});
 if(vis.length)h+=`<tr class="total"><td colspan="7">${FILTER==='전체'?'합계':FILTER} ${vis.length}건</td><td class="idx" style="text-align:right;color:var(--navy)">${cm(tq)}</td><td></td><td class="amt">${cm(ta)}</td><td colspan="5"></td></tr>`;
 el('tbl').innerHTML=h;
 el('k-cnt').textContent=cm(ROWS.length);el('k-qty').textContent=cm(TQ);el('k-amt').textContent=cm(TA);
 const prog=ROWS.filter(r=>r.status==='접수'||r.status==='생산중'||r.status==='변경').length;
 const done=ROWS.filter(r=>r.status==='납품완료').length;
 el('k-prog').textContent=cm(prog)+' / '+cm(done);
 let sh='';ACCTS.forEach(a=>{const b=bya[a]||{c:0,q:0,a:0};sh+=`<div class="ac ac-${a}${FILTER===a?' on':''}" onclick="setFilter('${a}')" title="이 구분만 보기"><div class="an">${a}</div><div class="av">${cm(b.c)}건 · ${cm(b.q)} EA</div><div class="am">${cm(b.a)}원</div></div>`;});
 el('acctsum').innerHTML=sh;
}
function pickPno(i,v){if(!ROWS[i])return;ROWS[i].pno=v;const f=FGMAP[v];if(f){ROWS[i].name=f.name;ROWS[i].acct=f.acct;if(f.price!=null)ROWS[i].price=String(f.price);if(FGC[v])ROWS[i].cust=FGC[v];}markDirty();render();}
function focusCell(field,idx){setTimeout(function(){var e=document.querySelector('#tbl input.cell-'+field+'[data-i="'+idx+'"]');if(e){e.focus();if(e.select)e.select();}},0);}
function cellKey(ev,i,field){
 if(ev.key==='Enter'||ev.key==='ArrowDown'){ev.preventDefault();if(i>=ROWS.length-1)addRow();focusCell(field,i+1);}
 else if(ev.key==='ArrowUp'){ev.preventDefault();if(i>0)focusCell(field,i-1);}
}
function addRow(){ROWS.push({no:nextNo(),date:'',cust:'',pno:'',name:'',qty:'',price:'',due:'',status:'접수',reason:'',memo:''});markDirty();render();}
function del(i){if(!confirm('이 수주를 삭제할까요?'))return;ROWS.splice(i,1);markDirty();render();}
function ed(i,f,v){if(!ROWS[i])return;ROWS[i][f]=v;markDirty();if(f==='qty'||f==='price'||f==='status')render();}

function normalize(d){return Array.isArray(d)?d:(d&&Array.isArray(d.rows)?d.rows:[]);}
async function save(){
 status('저장 중…');
 try{localStorage.setItem(LSKEY,JSON.stringify(ROWS));}catch(e){}
 let ok=false;
 if(sb){try{const r=await sb.from('app_state').upsert({key:CKEY,value:ROWS,updated_at:new Date().toISOString()});ok=!(r&&r.error);if(r&&r.error)console.warn(r.error.message);}catch(e){console.warn(e);}}
 dirty=false;status(ok?'✅ 저장됨 (전 PC 공유)':'💾 저장됨 (이 PC)');
}
async function boot(){
 el('pnodl').innerHTML=FG.map(x=>'<option value="'+esc(x.pno)+'">'+esc(x.name)+' · '+x.acct+(FGC[x.pno]?(' · '+FGC[x.pno]):'')+'</option>').join('');
 el('custdl').innerHTML=Array.from(new Set(Object.values(FGC))).map(c=>'<option value="'+esc(c)+'"></option>').join('');
 try{const s=JSON.parse(localStorage.getItem(LSKEY));if(s)ROWS=normalize(s);}catch(e){}
 render();
 if(!sb){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';status('준비됨 (이 PC 저장)');return;}
 try{
  const probe=await sb.from('app_state').select('key').limit(1);
  if(probe&&probe.error){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';status('준비됨 (이 PC 저장)');return;}
  el('cloud').textContent='● 클라우드 공유';el('cloud').className='cloud on';
  const r=await sb.from('app_state').select('value').eq('key',CKEY).maybeSingle();
  if(r&&r.data&&r.data.value&&!dirty){ROWS=normalize(r.data.value);render();status('☁️ 클라우드에서 불러옴');}
  else status('준비됨');
  try{ sb.channel('spo').on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'key=eq.'+CKEY},p=>{if(dirty)return;const v=p&&p.new&&p.new.value;if(v){ROWS=normalize(v);render();status('☁️ 다른 PC 변경 반영됨');}}).subscribe(); }catch(e){}
 }catch(e){el('cloud').textContent='● 로컬 모드';el('cloud').className='cloud off';status('준비됨 (이 PC 저장)');}
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
boot();
</script>
</body></html>
