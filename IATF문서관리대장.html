<style>

.kpi.g{border-left-color:var(--good)}.kpi.o{border-left-color:var(--warn)}.kpi.b{border-left-color:var(--teal)}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
.toolbar input.q{flex:1;min-width:180px}
.addbtn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.hint{margin-left:auto;font-size:11.5px;color:#94a3b8}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:920px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
thead th{background:var(--navy);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;position:sticky;top:0}
td .f{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 7px;font:inherit;font-size:12.5px;background:#fff}
td .f:focus{outline:none;border-color:var(--teal)}
td.no{text-align:center;color:#64748b;font-weight:700;width:34px}
.ch{font-family:monospace;font-weight:700;color:var(--teal);width:52px;text-align:center}
.dno{font-family:monospace;font-weight:700;width:120px}
select.st{font-weight:800}
select.st.s-유효{color:var(--good)}select.st.s-개정중{color:var(--warn)}select.st.s-폐기{color:var(--bad)}
tr.dead td{background:#fbeeee}
.delx{background:#fff;border:1px solid #f0c4c4;color:var(--bad);border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer}
.foot-hint{font-size:11.5px;color:#64748b;margin-top:8px}
.empty{text-align:center;color:#94a3b8;padding:24px}
@media print{header button,.toolbar .addbtn,.delx{display:none}.tbl-wrap{overflow:visible}}

 ['-','','다기능평가시스템','-','2026-04-20','유효','신규'],
 ['-','','품질측정실 운영방안','-','2026-04-20','유효','신규']
].map(function(a){return {ch:a[0],dno:a[1],name:a[2],rev:a[3],date:a[4],status:a[5],note:a[6]};});}
function stat(m,c){el('st').textContent=m;el('st').style.color=c||'#fff';}
function markDirty(){dirty=true;stat('✏️ 수정됨 · 저장 필요','#ffe08a');}
async function load(){
 if(!sb){ROWS=seed();stat('⚠ 로컬 모드','#ffd0d0');render();return;}
 try{var r=await sb.from('app_state').select('value').eq('key',KEY).maybeSingle();
  if(r.error){ROWS=seed();stat('⚠ 로컬 모드','#ffd0d0');}
  else if(r.data&&Array.isArray(r.data.value)&&r.data.value.length){ROWS=r.data.value;stat('클라우드 연결됨 ✓','#bff0c8');}
  else {ROWS=seed();stat('클라우드 연결됨 ✓ (초기 목록)','#bff0c8');}
 }catch(e){ROWS=seed();stat('⚠ 로컬 모드','#ffd0d0');}
 render();
}
async function save(){
 if(!sb){alert('클라우드 미연결 — 저장할 수 없습니다');return;}
 try{ await sb.from('app_state').upsert({key:KEY,value:ROWS,updated_at:new Date().toISOString()});
  dirty=false;stat('저장됨 ✓ '+new Date().toLocaleTimeString(),'#bff0c8'); }
 catch(e){ stat('저장 실패, 다시 시도','#ffd0d0'); }
}
function addRow(){ROWS.push({ch:'',dno:'',name:'',rev:'',date:'',status:'유효',note:''});markDirty();render();}
function delRow(i){if(!confirm('이 문서 행을 삭제할까요?'))return;ROWS.splice(i,1);markDirty();render();}
function setV(i,k,v){ROWS[i][k]=v;markDirty();if(k==='status'||k==='ch')render();}
function match(r,q){if(!q)return true;q=q.toLowerCase();return ((r.dno||'')+' '+(r.name||'')).toLowerCase().indexOf(q)>=0;}
function noteCell(n){var m=String(n||'').match(/https?:\/\/\S+/);if(m)return '<a href="'+esc(m[0])+'" target="_blank" style="color:var(--teal);font-weight:700">📎 원본 열기</a>';return esc(n||'');}
function render(){
 var q=el('q').value.trim(), fch=el('fch').value, fst=el('fst').value;
 var tot=ROWS.length, good=0,mid=0;var chs={};
 ROWS.forEach(function(r){if(r.status==='유효')good++;else if(r.status==='개정중')mid++;if(r.ch)chs[r.ch]=1;});
 el('kpis').innerHTML='<div class="kpi"><div class="l">총 문서</div><div class="v">'+tot+'</div></div>'+
  '<div class="kpi g"><div class="l">유효</div><div class="v">'+good+'</div></div>'+
  '<div class="kpi o"><div class="l">개정중</div><div class="v">'+mid+'</div></div>'+
  '<div class="kpi b"><div class="l">장(章)</div><div class="v">'+Object.keys(chs).length+'</div></div>';
 var sel=el('fch'),cur=sel.value;var order=Object.keys(chs).sort(function(a,b){return parseFloat(a)-parseFloat(b)||a.localeCompare(b);});
 sel.innerHTML='<option value="">장(章) 전체</option>'+order.map(function(c){return '<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>';}).join('');
 var shown=0,h='';
 ROWS.forEach(function(r,i){
  if(!match(r,q))return; if(fch&&r.ch!==fch)return; if(fst&&r.status!==fst)return; shown++;
  h+='<tr class="'+(r.status==='폐기'?'dead':'')+'"><td class="no">'+(i+1)+'</td>'+
   '<td><input class="f ch" value="'+esc(r.ch)+'" oninput="setV('+i+',\'ch\',this.value)"></td>'+
   '<td><input class="f dno" value="'+esc(r.dno)+'" oninput="setV('+i+',\'dno\',this.value)" placeholder="SJQ..."></td>'+
   '<td><input class="f" value="'+esc(r.name)+'" oninput="setV('+i+',\'name\',this.value)" placeholder="문서명"></td>'+
   '<td><input class="f" value="'+esc(r.rev)+'" oninput="setV('+i+',\'rev\',this.value)" placeholder="Rev"></td>'+
   '<td><input class="f" type="date" value="'+esc(r.date)+'" onchange="setV('+i+',\'date\',this.value)"></td>'+
   '<td><select class="f st s-'+esc(r.status)+'" onchange="setV('+i+',\'status\',this.value)">'+STAT.map(function(o){return '<option'+(r.status===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></td>'+
   '<td><input class="f" value="'+esc(r.note)+'" oninput="setV('+i+',\'note\',this.value)" placeholder="비고·원본 URL"></td>'+
   '<td style="text-align:center"><button class="delx" onclick="delRow('+i+')">✕</button></td></tr>';
 });
 if(!shown)h='<tr><td colspan="9" class="empty">'+(tot?'검색 결과가 없습니다.':'문서가 없습니다.')+'</td></tr>';
 el('body').innerHTML=h;
 el('cnt').textContent=shown+' / '+tot+'건';
}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
load();

</script>
