function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function seedRows(){
 return (typeof SEED_DOCS!=="undefined"?SEED_DOCS:[]).map(function(d){
  var nt=((d.note||"").replace("구버젼","구버전").replace(/\s+/g," ").trim());
  var st=/구버전/.test(nt)?"구버전":"";
  return {clause:d.clause||"",code:d.code||"",name:d.name||"",rev:d.rev||"",date:d.date||"",
    mgr:"",status:st,audit:"",loc:"",note:nt,file:d.file||"",ext:d.ext||""};
 });
}
function major(cl){ if(!cl)return"공통"; var h=String(cl).split(/[.\-]/)[0]; if(h==="0"||h==="1")return"공통"; return h; }

function fillKpis(){
 var tot=ROWS.length, chk=0, gu=0, need=0;
 ROWS.forEach(function(r){ if(r.audit==="확인")chk++; if(r.status==="구버전")gu++; if(r.audit==="보완필요")need++; });
 var K=[["총 문서",tot,""],["심사확인",chk,"var(--green)"],["보완필요",need,"var(--red)"],["구버전",gu,"var(--gray)"],["미확인",tot-chk-need,"var(--amber)"]];
 document.getElementById("kpis").innerHTML=K.map(function(k){return '<div class="kpi"><div class="l">'+k[0]+'</div><div class="v"'+(k[2]?' style="color:'+k[2]+'"':'')+'>'+k[1]+'</div></div>';}).join("");
}
function filtered(){
 var q=(document.getElementById("fSearch").value||"").toLowerCase();
 var mj=document.getElementById("fMajor").value, stt=document.getElementById("fStatus").value, au=document.getElementById("fAudit").value;
 return ROWS.map(function(r,i){return{r:r,i:i};}).filter(function(o){var r=o.r;
  if(mj&&major(r.clause)!==mj)return false;
  if(stt&&(r.status||"")!==stt)return false;
  if(au==="__none"){ if(r.audit)return false; } else if(au&&(r.audit||"")!==au)return false;
  if(q){var hay=(r.clause+" "+r.code+" "+r.name+" "+r.mgr+" "+r.note).toLowerCase();if(hay.indexOf(q)<0)return false;}
  return true;
 });
}
function render(){

 }).join("");
}

function editRow(i){var r=ROWS[i];if(!r)return;EDIT=i;
 setF("e_clause",r.clause);setF("e_code",r.code);setF("e_name",r.name);setF("e_rev",r.rev);setF("e_date",r.date);
 setF("e_mgr",r.mgr);setF("e_status",r.status);setF("e_audit",r.audit);setF("e_loc",r.loc);setF("e_file",r.file);setF("e_note",r.note);
 openForm("✏️ 문서 편집");window.scrollTo({top:0,behavior:"smooth"});}
function saveForm(){
 var rec={clause:getF("e_clause"),code:getF("e_code"),name:getF("e_name"),rev:getF("e_rev"),date:getF("e_date"),
  mgr:getF("e_mgr"),status:getF("e_status"),audit:getF("e_audit"),loc:getF("e_loc"),file:getF("e_file"),note:getF("e_note")};
 if(!rec.name&&!rec.code){alert("문서번호 또는 문서명 중 하나는 입력하세요.");return;}
 if(EDIT>=0)ROWS[EDIT]=rec; else ROWS.push(rec);
 closeForm();saveCloud();render();
}
function delRow(i){if(!confirm("이 문서를 대장에서 삭제할까요?"))return;ROWS.splice(i,1);saveCloud();render();}

function exportCsv(){
 var head=["조항","문서번호","문서명","Rev","제개정일","담당","상태","심사확인","보관위치","비고","원본파일"];
 var lines=[head.join(",")];
 ROWS.forEach(function(r){
  var row=[r.clause,r.code,r.name,r.rev,r.date,r.mgr,r.status,r.audit,r.loc,r.note,r.file].map(function(v){
   v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; });
  lines.push(row.join(","));
 });
 var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="IATF16949_문서관리대장_2026.csv";a.click();
}

/* 클라우드 (app_state 키 iatf_docs_2026) */
var _saveT=null;
function saveCloud(){
 if(!window.SB)return;
 clearTimeout(_saveT);
 _saveT=setTimeout(function(){
  window.SB.from("app_state").upsert({key:KEY,value:ROWS,src:(window.__CID||""),updated_at:new Date().toISOString()})
   .then(function(r){ setSt(r&&r.error?"저장 실패":"클라우드 저장됨 ✓", r&&r.error?"r":"g"); })
   .catch(function(){setSt("저장 실패","r");});
 },400);
}
async function load(){
 if(!window.SB){setSt("로컬 모드 — 미연결","r");ROWS=seedRows();render();return;}
 setSt("불러오는 중…");
 try{
  var r=await window.SB.from("app_state").select("value").eq("key",KEY).maybeSingle();
  if(r.error){ setSt("연결 확인 필요","r"); ROWS=seedRows(); render(); return; }
  if(r.data&&r.data.value&&r.data.value.length){ ROWS=r.data.value; setSt("클라우드 연결됨 ✓","g"); render(); }
  else { ROWS=seedRows(); setSt("기본 대장 저장 중…"); saveCloud(); render(); setSt("클라우드 연결됨 ✓","g"); }
 }catch(e){ setSt("연결 확인 필요","r"); ROWS=seedRows(); render(); }
}
load();
try{ if(window.SB) window.SB.channel("iatf_docs_rt")
  .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"key=eq."+KEY},function(p){
    var row=(p&&p.new)||{}; if(row.src===window.__CID)return; if(row.value){ROWS=row.value;render();}
  }).subscribe(); }catch(e){}
</script>
