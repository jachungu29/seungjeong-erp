<style>
:root{

 --blue:#2f6feb;--green:#2f9e44;--amber:#d08700;--red:#d64545;
 --kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px;line-height:1.45}
.topbar{height:6px;background:#111318}
.wrap{max-width:1200px;margin:0 auto;padding:18px 20px 90px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd .ic{font-size:24px}
.hd h1{font-size:20px;font-weight:800;margin:0}
.hd .sub{font-size:12px;color:var(--dim)}
.hd .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.btn{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.st{font-size:11.5px;font-family:var(--mono)}
.banner{margin:14px 0 0;border:1px solid #d9e6f7;background:#f2f7fe;border-radius:11px;padding:10px 14px;font-size:12.5px;color:#2c5a9e}
/* 필터 */
.filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.filter input,.filter select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--txt);font:inherit;font-size:13px}
.filter input.search{flex:1;min-width:180px}
.filter .cnt{margin-left:auto;font-size:12.5px;color:var(--dim);font-weight:700}
.addbtn{background:#1f6feb;color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
/* 편집 폼 */
.editcard{background:#fffdf7;border:1px solid #f0d9a8;border-radius:13px;padding:15px 17px;margin-top:14px;display:none}
.editcard.on{display:block}
.editcard h3{margin:0 0 11px;font-size:14px;font-weight:800;color:#8a5a00}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.form{grid-template-columns:repeat(2,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.wide{grid-column:span 2}
.fld label{font-size:11px;color:var(--dim)}
.fld input,.fld select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font:inherit;font-size:13.5px}
.frow{display:flex;gap:9px;margin-top:12px}
.save{background:#1f6feb;color:#fff;border:none;border-radius:9px;padding:10px 20px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.clr{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer}
/* 표 */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{color:var(--dim);font-size:11px;position:sticky;top:0;background:#faf8f4;z-index:1}
tbody tr:hover{background:#f7fbff}
td .code{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
td .refbadge{font-size:9.5px;font-weight:700;background:#eef0f3;color:var(--dim);border-radius:20px;padding:1px 7px;margin-left:5px}
.pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px}

.act button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;color:var(--faint);margin-left:3px}
.act button:hover{border-color:var(--blue);color:var(--blue)}
.act button.del:hover{border-color:var(--red);color:var(--red)}
.empty{color:var(--faint);text-align:center;padding:24px}

  <button class="addbtn" onclick="newRow()">＋ 새 문서</button>
  <span class="cnt" id="cnt"></span>
 </div>

   <div class="fld wide"><label>프로세스명</label><input id="e_procName" placeholder="예: 제조설비관리 프로세스"></div>
   <div class="fld"><label>부서</label><input id="e_dept" placeholder="예: 생산팀"></div>

   <div class="fld"><label>개정(REV)</label><input id="e_rev" placeholder="예: A0"></div>

   <div class="fld"><label>담당</label><input id="e_mgr" placeholder="담당자"></div>
   <div class="fld"><label>상태</label><select id="e_status"><option value="">-</option><option>유효</option><option>개정중</option><option>폐기</option></select></div>
   <div class="fld wide"><label>비고</label><input id="e_note" placeholder="선택 입력"></div>
  </div>
  <div class="frow"><button class="save" onclick="saveForm()">저장</button><button class="clr" onclick="closeForm()">취소</button></div>

function seedRows(){
 var rows=[];
 try{ for(var pk in SEED_GROUPS){var g=SEED_GROUPS[pk]; (g.docs||[]).forEach(function(d){
   rows.push({proc:g.code||pk, procName:g.name||"", dept:g.dept||"", code:d.code||"", name:d.name||"", ref:!!d.ref, rev:"", revDate:"", mgr:"", status:"", note:""});
 }); } }catch(e){}
 return rows;
}

function fillDeptOptions(){
 var set={}; ROWS.forEach(function(r){if(r.dept)set[r.dept]=1;});
 var sel=document.getElementById("fDept"),cur=sel.value;
 sel.innerHTML='<option value="">부서 전체</option>'+Object.keys(set).sort().map(function(d){return '<option>'+esc(d)+'</option>';}).join("");
 sel.value=cur;
}

function filtered(){
 var q=(document.getElementById("fSearch").value||"").toLowerCase();
 var dp=document.getElementById("fDept").value, stt=document.getElementById("fStatus").value;
 return ROWS.map(function(r,i){return {r:r,i:i};}).filter(function(o){var r=o.r;
  if(dp&&r.dept!==dp)return false;
  if(stt&&(r.status||"")!==stt)return false;
  if(q){var hay=(r.code+" "+r.name+" "+r.proc+" "+r.procName+" "+r.mgr).toLowerCase();if(hay.indexOf(q)<0)return false;}
  return true;
 });
}

function render(){
 var box=document.getElementById("rows");
 fillDeptOptions();
 var list=filtered();
 document.getElementById("cnt").textContent="총 "+ROWS.length+"건 · 표시 "+list.length;
 if(!list.length){box.innerHTML='<tr><td colspan="10" class="empty">해당하는 문서가 없습니다.</td></tr>';return;}
 box.innerHTML=list.map(function(o){var r=o.r,i=o.i;
  return '<tr><td>'+esc(r.proc)+'<div style="font-size:11px;color:var(--faint)">'+esc(r.procName)+'</div></td>'+
   '<td>'+esc(r.dept)+'</td>'+
   '<td><span class="code">'+esc(r.code)+'</span>'+(r.ref?'<span class="refbadge">참조</span>':'')+'</td>'+
   '<td>'+esc(r.name)+'</td>'+
   '<td>'+esc(r.rev)+'</td><td>'+esc(r.revDate)+'</td><td>'+esc(r.mgr)+'</td>'+
   '<td>'+(r.status?'<span class="pill s-'+esc(r.status)+'">'+esc(r.status)+'</span>':'')+'</td>'+
   '<td>'+esc(r.note)+'</td>'+
   '<td class="act" style="text-align:right;white-space:nowrap"><button onclick="editRow('+i+')">편집</button><button class="del" onclick="delRow('+i+')">✕</button></td></tr>';
 }).join("");
}

/* 편집/추가 폼 */
function openForm(title){document.getElementById("editTitle").textContent=title;document.getElementById("editCard").classList.add("on");}
function closeForm(){document.getElementById("editCard").classList.remove("on");EDIT=-1;}
function setF(id,v){document.getElementById(id).value=v==null?"":v;}
function getF(id){return (document.getElementById(id).value||"").trim();}
function newRow(){EDIT=-1;["e_proc","e_procName","e_dept","e_code","e_name","e_rev","e_revDate","e_mgr","e_note"].forEach(function(id){setF(id,"");});setF("e_ref","");setF("e_status","");openForm("＋ 문서 추가");window.scrollTo({top:0,behavior:"smooth"});}
function editRow(i){var r=ROWS[i];if(!r)return;EDIT=i;
 setF("e_proc",r.proc);setF("e_procName",r.procName);setF("e_dept",r.dept);setF("e_code",r.code);setF("e_name",r.name);
 setF("e_ref",r.ref?"1":"");setF("e_rev",r.rev);setF("e_revDate",r.revDate);setF("e_mgr",r.mgr);setF("e_status",r.status);setF("e_note",r.note);
 openForm("✏️ 문서 편집");window.scrollTo({top:0,behavior:"smooth"});}
function saveForm(){
 var rec={proc:getF("e_proc"),procName:getF("e_procName"),dept:getF("e_dept"),code:getF("e_code"),name:getF("e_name"),
  ref:getF("e_ref")==="1",rev:getF("e_rev"),revDate:getF("e_revDate"),mgr:getF("e_mgr"),status:getF("e_status"),note:getF("e_note")};
 if(!rec.code&&!rec.name){alert("문서번호 또는 문서명 중 하나는 입력하세요.");return;}
 if(EDIT>=0)ROWS[EDIT]=rec; else ROWS.unshift(rec);
 closeForm();saveCloud();render();
}
function delRow(i){if(!confirm("이 문서를 대장에서 삭제할까요?"))return;ROWS.splice(i,1);saveCloud();render();}

/* 클라우드 저장/불러오기 (app_state 키) */
var _saveT=null;
function saveCloud(){
 if(!window.SB)return;
 clearTimeout(_saveT);
 _saveT=setTimeout(function(){
  window.SB.from("app_state").upsert({key:KEY,value:ROWS,src:(window.__CID||""),updated_at:new Date().toISOString()})
   .then(function(r){ if(r&&r.error){setSt("저장 실패","r");} else {setSt("클라우드 저장됨 ✓","g");} })
   .catch(function(){setSt("저장 실패","r");});
 },400);
}
async function load(){
 if(!window.SB){setSt("로컬 모드 — 클라우드 미연결","r");ROWS=seedRows();render();return;}
 setSt("불러오는 중…");
 try{
  var r=await window.SB.from("app_state").select("value").eq("key",KEY).maybeSingle();
  if(r.error){ setSt("연결 확인 필요","r"); ROWS=seedRows(); render(); return; }
  TABLE_OK=true;
  if(r.data&&r.data.value&&r.data.value.length){ ROWS=r.data.value; setSt("클라우드 연결됨 ✓","g"); render(); }
  else { ROWS=seedRows(); setSt("기본 대장 저장 중…"); saveCloud(); render(); setSt("클라우드 연결됨 ✓","g"); }
 }catch(e){ setSt("연결 확인 필요","r"); ROWS=seedRows(); render(); }
}
load();
try{ if(window.SB) window.SB.channel("iatf_reg_rt")
  .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"key=eq."+KEY},function(p){
    var row=(p&&p.new)||{}; if(row.src===window.__CID)return; if(row.value){ROWS=row.value;render();}
  }).subscribe(); }catch(e){}
</script>
</body></html>
