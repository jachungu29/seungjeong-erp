<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>승정 ERP</title>
<link rel="manifest" href="manifest-erp.json">
<meta name="theme-color" content="#003D54">
<link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#0e2a3d,#081722 60%,#050f18);
 color:#eaf1f6;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;-webkit-tap-highlight-color:transparent}
.stage{max-width:440px;padding:30px 24px}
.logo{width:150px;height:150px;border-radius:34px;box-shadow:0 18px 50px rgba(0,0,0,.5);cursor:pointer;transition:.18s;background:#fff}
.logo:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 22px 60px rgba(47,116,198,.35)}
.logo:active{transform:scale(.97)}
h1{font-size:30px;font-weight:800;letter-spacing:2px;margin:22px 0 4px}
.sub{color:#9fb6c6;font-size:13.5px;margin-bottom:30px}
.enter{display:inline-block;background:linear-gradient(90deg,#006E8A,#003D54);color:#fff;text-decoration:none;
 font-size:17px;font-weight:800;padding:15px 40px;border-radius:14px;cursor:pointer;border:0;font-family:inherit;box-shadow:0 6px 20px rgba(0,110,138,.35)}
.enter:hover{filter:brightness(1.08)}.enter:active{transform:translateY(1px)}
.hint{margin-top:16px;font-size:12px;color:#7c93a4}
.install{margin-top:22px}
.installbtn{background:transparent;color:#bcd3e0;border:1.5px solid #2c4a5c;border-radius:11px;padding:11px 20px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
.installbtn:hover{border-color:#4f7f97;color:#fff}
.installed{font-size:12px;color:#5aa06f;margin-top:18px;display:none}
.foot{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:#4a5f6e}
</style></head><body>
<div class="stage">
 <img class="logo" src="로고/승정로고_투명.svg" alt="승정 로고" onclick="go()" onerror="this.src='sj-icon.png'">
 <h1>승정 ERP</h1>
 <div class="sub">㈜승정 통합 관리 시스템 · 클라우드</div>
 <button class="enter" onclick="go()">ERP 시작하기 →</button>
 <div class="hint">로고 또는 위 버튼을 누르면 시작합니다.</div>
 <div class="install">
  <button class="installbtn" id="installBtn" onclick="doInstall()">💻 이 컴퓨터에 앱으로 설치</button>
 </div>
 <div class="installed" id="installedMsg">✅ 설치됨 — 바탕화면/시작에서 승정 로고로 실행하세요.</div>
</div>
<div class="foot">SEUNGJEONG ERP · GitHub Pages + Supabase</div>
<script>
function go(){location.href='index2.html';}
/* 앱 설치 (PWA) */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
 var b=document.getElementById('installBtn');if(b)b.style.display='inline-block';});
function doInstall(){ if(!deferred){alert('브라우저 주소창의 "앱 설치" 아이콘(⊕)을 눌러 설치하세요. (엣지: ⋯ → 앱 → 이 사이트를 앱으로 설치)');return;}
 deferred.prompt(); deferred.userChoice.then(function(c){ if(c&&c.outcome==='accepted'){document.getElementById('installBtn').style.display='none';document.getElementById('installedMsg').style.display='block';} deferred=null; }); }
window.addEventListener('appinstalled',()=>{var m=document.getElementById('installedMsg');if(m)m.style.display='block';var b=document.getElementById('installBtn');if(b)b.style.display='none';});
/* 서비스워커 등록(설치 가능 + 오프라인 껍데기) */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
/* 이미 설치된 앱으로 열렸으면(standalone) 자동으로 ERP 진입 */
if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches){ /* 표지 유지: 자동진입 원하면 아래 주석 해제 */ /* setTimeout(go,900); */ }
</script>
</body></html>
