<title>설계 메뉴 · 구조도 연동</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png"><style>:root{--bg:#0d1117;--panel:#161b22;--line:#2a3242;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--mono:Consolas,monospace;--kr:Pretendard,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 80px}
h1{font-size:23px;font-weight:800;margin:0 0 3px}
.lead{color:var(--dim);font-size:13px;margin-bottom:14px}
.lead a{color:var(--blue);text-decoration:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{flex:1;min-width:160px;background:#0b1420;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font:inherit;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 13px;font:inherit;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}
.stat{color:var(--faint);font-size:12px;font-family:var(--mono);margin-left:auto}
.src{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:6px;margin-left:6px}
.src.edit{background:#123524;color:#3fb950}.src.def{background:#1c2333;color:#8b949e}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
mark{background:#3b5bdb;color:#fff;border-radius:3px;padding:0 2px}
footer{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;margin-top:26px}
.l1{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:9px;overflow:hidden;border-left:4px solid var(--mc,#58a6ff)}
.l1-h{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;user-select:none}
.l1-h:hover{background:#1b2230}
.l1-h .num{font-family:var(--mono);font-size:12px;color:#0b1420;background:var(--mc,#58a6ff);padding:2px 8px;border-radius:6px;font-weight:800}
.l1-h .lb{font-size:16px;font-weight:800}
.l1-h .cnt{color:var(--faint);font-size:12px;font-family:var(--mono);margin-left:auto}
.chev{color:var(--faint);transition:.15s;font-size:12px;display:inline-block}
.l1.open>.l1-h .chev{transform:rotate(90deg)}
.l1-body{display:none;padding:2px 12px 12px 18px}.l1.open>.l1-body{display:block}
.l2{border-left:2px solid var(--line);margin:6px 0 6px 6px;padding-left:8px}
.l2-h{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;user-select:none;border-radius:8px}
.l2-h:hover{background:#1b2230}.l2-h .lb{font-weight:700;font-size:14px;color:#cfe0ff}.l2-h .cnt{color:var(--faint);font-size:11.5px;font-family:var(--mono);margin-left:auto}
.l2.open>.l2-h .chev{transform:rotate(90deg)}
.l2-body{display:none;padding:2px 0 6px 16px}.l2.open>.l2-body{display:block}
.l3{display:flex;align-items:center;gap:6px;padding:5px 10px;color:var(--dim);font-size:13px;border-radius:7px}
.l3:hover{background:#151b26;color:var(--txt)}

function getStruct(){try{var s=JSON.parse(localStorage.getItem("SJ_MAP_STRUCT"));if(s&&s.length){window._SRC="edit";return s;}}catch(e){}window._SRC="def";return _DEF;}
function stColor(st){st=(st||"").toLowerCase();if(st==="live"||st==="done"||st==="ok")return "var(--green)";if(st==="wip"||st==="dev"||st==="doing")return "var(--amber)";if(st==="todo"||st==="plan")return "var(--faint)";return "var(--blue)";}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function stats(S){var m=0,i=0;S.forEach(function(c){(c.mids||[]).forEach(function(x){m++;(x.items||[]).forEach(function(){i++;});});});return {l1:S.length,l2:m,l3:i};}

function build(){var S=getStruct();var st=stats(S);var out="";

  out+='<div class="l1" style="--mc:'+col+'"><div class="l1-h" onclick="tog(this)"><i class="chev">&#9654;</i><span class="num">'+esc(g.num||"")+'</span><span class="lb">'+esc(g.label||"")+'</span><span class="cnt">中 '+mids.length+' · 小 '+cnt+'</span></div><div class="l1-body">';

   out+='<div class="l2"><div class="l2-h" onclick="tog(this)"><i class="chev">&#9654;</i><span class="lb">'+esc(m.hdr||"(기타)")+'</span><span class="cnt">'+its.length+'</span></div><div class="l2-body">';
   its.forEach(function(it){out+='<div class="l3"><span class="dot" style="background:'+stColor(it.st)+'"></span><span class="t3">'+esc(it.name||it.label||"")+'</span></div>';});
   out+='</div></div>';});
  out+='</div></div>';});
 document.getElementById("tree").innerHTML=out;
 document.getElementById("stat").innerHTML=st.l1+' 대분류 · '+st.l2+' 중분류 · '+st.l3+' 소분류';
 var s=document.getElementById("src");s.className='src '+(window._SRC==='edit'?'edit':'def');s.textContent=window._SRC==='edit'?'구조도 편집본 반영중':'기본 구조 (구조도 미편집)';
