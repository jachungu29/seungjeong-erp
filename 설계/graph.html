<title>설계 그래프 · 구조도 연동</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png"><style>:root{--bg:#0d1117;--panel:#161b22;--line:#2a3242;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--mono:Consolas,monospace;--kr:Pretendard,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 80px}
h1{font-size:23px;font-weight:800;margin:0 0 3px}
.lead{color:var(--dim);font-size:13px;margin-bottom:14px}
.lead a{color:var(--blue);text-decoration:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{flex:1;min-width:160px;background:#0b1420;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font:inherit;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:9px 13px;font:inherit;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}
.stat{color:var(--faint);font-size:12px;font-family:var(--mono);margin-left:auto}
.src{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:6px;margin-left:6px}
.src.edit{background:#123524;color:#3fb950}.src.def{background:#1c2333;color:#8b949e}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
mark{background:#3b5bdb;color:#fff;border-radius:3px;padding:0 2px}
footer{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;margin-top:26px}
.cols{display:flex;gap:12px;align-items:flex-start}
.col{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;max-height:70vh;overflow-y:auto}
.col-h{position:sticky;top:0;background:#1c2333;padding:9px 13px;font-size:12px;font-weight:700;color:var(--dim);border-bottom:1px solid var(--line);font-family:var(--mono)}
.node{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;border-bottom:1px solid #1a2130}
.node:hover{background:#1b2230}
.node.sel{background:#12243a;border-left:3px solid var(--blue)}
.node .num{font-family:var(--mono);font-size:11px;color:#0b1420;padding:1px 6px;border-radius:5px;font-weight:800}
.node .nm{font-weight:600;font-size:13.5px}
.node .ct{color:var(--faint);font-size:11px;font-family:var(--mono);margin-left:auto}
.node.leaf{cursor:default}.node.leaf:hover{background:transparent}
.empty{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
@media(max-width:760px){.cols{flex-direction:column}.col{width:100%}}
.col-h{display:flex;align-items:center;gap:6px}
.addb{margin-left:auto;display:none;background:#123524;color:#3fb950;border:1px solid #1c6b3f;border-radius:6px;min-width:22px;height:20px;font-size:14px;line-height:1;cursor:pointer;padding:0}
body.editon .addb{display:inline-block}
.addb:hover{background:#1c6b3f;color:#fff}
.node .acts{margin-left:auto;display:none;gap:1px;flex-shrink:0}
body.editon .node:hover .acts{display:flex}
.nbtn{background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:12px;padding:1px 4px;border-radius:4px}
.nbtn:hover{color:#fff;background:#2a3242}

function delNode(lv,i){var list=LIST(lv);if(!list||!list[i])return;var o=list[i];var nm=(lv===1?o.label:lv===2?o.hdr:o.name)||"";if(!confirm('"'+nm+'" 삭제할까요? 하위 항목도 함께 삭제됩니다.'))return;list.splice(i,1);if(SEL[lv-1]>=list.length)SEL[lv-1]=Math.max(0,list.length-1);for(var k=lv;k<5;k++)SEL[k]=0;DIRTY=true;render();}function moveNode(lv,i,dir){var list=LIST(lv);if(!list)return;var j=i+dir;if(j<0||j>=list.length)return;var t=list[i];list[i]=list[j];list[j]=t;if(SEL[lv-1]===i)SEL[lv-1]=j;else if(SEL[lv-1]===j)SEL[lv-1]=i;DIRTY=true;render();}function _nameOf(o){return o.label!=null?o.label:(o.hdr!=null?o.hdr:(o.name!=null?o.name:""));}function _kidsOf(o){return o.mids||o.items||o.subs||[];}function _toLv(o,lv){var nm=_nameOf(o),ch=_kidsOf(o).map(function(c){return _toLv(c,lv+1);});if(lv===1)return {num:o.num||"",label:nm,color:o.color||"#334155",mids:ch};if(lv===2)return {hdr:nm,items:ch};return {name:nm,st:o.st||"live",subs:ch};}function promoteNode(lv,i){if(lv<2)return;var list=LIST(lv);if(!list||!list[i])return;var item=list.splice(i,1)[0];var pl=LIST(lv-1);var pIdx=SEL[lv-2]||0;pl.splice(pIdx+1,0,_toLv(item,lv-1));SEL[lv-2]=pIdx+1;for(var k=lv-1;k<5;k++)SEL[k]=0;DIRTY=true;render();}function demoteNode(lv,i){if(lv>4)return;var list=LIST(lv);if(!list||!list[i])return;if(i<1){alert("바로 위에 상위가 될 항목이 있어야 강등할 수 있습니다.");return;}var prev=list[i-1];var item=list.splice(i,1)[0];var pk=(lv===1?"mids":(lv===2?"items":"subs"));prev[pk]=prev[pk]||[];prev[pk].push(_toLv(item,lv+1));SEL[lv-1]=i-1;for(var k=lv;k<5;k++)SEL[k]=0;DIRTY=true;render();}
