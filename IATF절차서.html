<div class="top"><h1>📋 IATF16949 품질 절차서</h1>

<script>

}, {"key": "SJQD-9005", "ch": "9.5", "dno": "SJQD-9005", "name": "품질 비용절차", "rev": "2", "date": "2018-04-29"}, {"key": "SJQP-9006", "ch": "9.6", "dno": "SJQP-9006", "name": "시정 및 예방조치 프로세스", "rev": "1", "date": "2018-03-28"}, {"key": "QSPEC-001", "ch": "-", "dno": "QSPEC-001", "name": "품질측정실 운영방안", "rev": "-", "date": "2026-04-20"}, {"key": "QSPEC-002", "ch": "-", "dno": "QSPEC-002", "name": "다기능평가시스템", "rev": "-", "date": "2026-04-20"}];
let STORE={}, cur=null, editing=false;
const el=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stat(m,c){el('st').textContent=m;el('st').style.color=c||'';}
function toggleSide(){el('side').classList.toggle('hide');}
async function load(){
 if(!sb){stat('오프라인');return;}
 try{var r=await sb.from('app_state').select('value').eq('key',CKEY).maybeSingle();
  STORE=(r.data&&r.data.value)||{}; stat('클라우드 연결됨 ✓','#bff0c8');}
 catch(e){stat('로드 실패');}
 renderList(); if(IDX.length) pick(encodeURIComponent(IDX[0].key));
}
function renderList(){var q=(el('q').value||'').toLowerCase();var h='';
 IDX.forEach(function(d){if(q&&((d.dno+' '+d.name).toLowerCase().indexOf(q)<0))return;
  h+='<button class="doc'+(d.key===cur?' on':'')+'" onclick="pick(\''+encodeURIComponent(d.key)+'\')"><div class="nm">'+esc(d.name)+'</div><div class="mt">'+esc(d.dno||'-')+' · Rev '+esc(d.rev)+' · '+esc(d.ch)+'장</div></button>';});
 el('list').innerHTML=h||'<div style="color:#9aa;padding:10px;font-size:12px">검색 결과 없음</div>';}
function pick(k){k=decodeURIComponent(k);if(editing&&!confirm('편집 중입니다. 저장하지 않고 이동할까요?'))return;editing=false;cur=k;
 var meta=IDX.find(function(x){return x.key===k;})||{};var rec=STORE[k]||{};
 el('main').innerHTML='<div class="dhead"><div class="no">'+esc(meta.dno||'-')+' · Rev '+esc(meta.rev)+'</div><h2>'+esc(meta.name)+'</h2><div class="meta">제·개정일 '+esc(meta.date)+' · '+esc(meta.ch)+'장 · IATF16949 · ㈜승정 품질기획부</div>'
  +'<div class="dbar"><button class="b-edit" onclick="startEdit()">✏️ 편집</button><button class="b-print" onclick="window.print()">🖨️ 인쇄</button><button class="b-print" onclick="toggleSide()">⤢ 목록접기/펼치기</button></div></div>'
  +'<div class="wrap"><div id="content">'+(rec.html||'<div class="empty">내용이 없습니다.</div>')+'</div></div>';
 renderList();el('main').scrollTop=0;}
function startEdit(){editing=true;var c=el('content');c.contentEditable=true;c.focus();document.body.classList.add('editing');
 var bar=document.querySelector('.dbar');bar.innerHTML='<button class="b-save" onclick="saveDoc()">💾 저장(클라우드)</button><button class="b-cancel" onclick="pick(encodeURIComponent(cur))">취소</button>';}
async function saveDoc(){var c=el('content');if(STORE[cur])STORE[cur].html=c.innerHTML;else STORE[cur]={html:c.innerHTML};
 stat('저장 중…');
 try{await sb.from('app_state').upsert({key:CKEY,value:STORE,updated_at:new Date().toISOString()});stat('저장됨 ✓ '+new Date().toLocaleTimeString(),'#bff0c8');}
 catch(e){stat('저장 실패');alert('저장 실패 — 다시 시도하세요');return;}
 editing=false;c.contentEditable=false;document.body.classList.remove('editing');pick(encodeURIComponent(cur));}
load();
