*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef1f6;color:#1c2430;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px}
.top{background:linear-gradient(90deg,#123a52,#0d6e8c);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px}

.layout{display:flex;height:calc(100vh - 46px)}

.doc .nm{font-weight:800;font-size:13px}.doc .mt{font-size:11px;color:#6a7b88;margin-top:2px;font-family:monospace}
.doc.xls{opacity:.55;cursor:default}.doc.xls:hover{border-color:#e7ebf0;background:#fff}
.side .hd{font-size:11px;color:#8b95a1;font-weight:800;margin:12px 4px 6px;letter-spacing:.3px}
.frwrap{flex:1;background:#fff}.frwrap iframe{width:100%;height:100%;border:0}
.empty{padding:40px;color:#94a3b8;text-align:center}
@media(max-width:720px){.layout{flex-direction:column;height:auto}.side{width:auto;flex:none;max-height:44vh}.frwrap{height:56vh}}
</style></head><body>

<script>

", "file": "iatf/iatf_SJQP-9001.html"}, {"ch": "9.3", "dno": "SJQD-9003", "name": "내부심사 절차", "rev": "3", "date": "2021-03-02", "file": "iatf/iatf_SJQD-9003.html"}, {"ch": "9.4", "dno": "SJQP-9004", "name": "경영검토 프로세스", "rev": "1", "date": "2018-03-28", "file": "iatf/iatf_SJQP-9004.html"}, {"ch": "9.5", "dno": "SJQD-9005", "name": "품질 비용절차", "rev": "2", "date": "2018-04-29", "file": "iatf/iatf_SJQD-9005.html"}, {"ch": "9.6", "dno": "SJQP-9006", "name": "시정 및 예방조치 프로세스", "rev": "1", "date": "2018-03-28", "file": "iatf/iatf_SJQP-9006.html"}, {"ch": "-", "dno": "QSPEC-001", "name": "품질측정실 운영방안", "rev": "-", "date": "2026-04-20", "file": "iatf/iatf_QSPEC-001.html"}, {"ch": "-", "dno": "QSPEC-002", "name": "다기능평가시스템", "rev": "-", "date": "2026-04-20", "file": "iatf/iatf_QSPEC-002.html"}];
var XLS=["품질경영시스템 매뉴얼", "조직상황/사업계획/다기능팀/품질방침/조직업무분장", "프로세스운영/변경/비상대비/안전관리", "측정시스템/문서화/문서관리/기록/4M변경", "구매업무/양산승인/FMEA/관리계획서/금형/식별추적/자재/제품/생산관리/실수방지/도면부품 등 (.xls 구형 → xlsx 저장 시 변환가능)"];
function pick(i){var d=DOCS[i];document.getElementById('fr').src=d.file;[].forEach.call(document.querySelectorAll('.doc'),function(e){e.classList.remove('on');});var b=document.getElementById('d'+i);if(b)b.classList.add('on');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){var q=(document.getElementById('q').value||'').toLowerCase();var h='';
 DOCS.forEach(function(d,i){if(q&&((d.dno+' '+d.name).toLowerCase().indexOf(q)<0))return;
  h+='<button class="doc" id="d'+i+'" onclick="pick('+i+')"><div class="nm">'+esc(d.name)+'</div><div class="mt">'+esc(d.dno||'-')+' · Rev '+esc(d.rev)+' · '+esc(d.ch)+'장</div></button>';});
 document.getElementById('list').innerHTML=h||'<div class="empty">검색 결과 없음</div>';
 document.getElementById('xlslist').innerHTML=XLS.map(function(n){return '• '+esc(n);}).join('<br>');
}
render(); if(DOCS.length) pick(0);
</script></body></html>
