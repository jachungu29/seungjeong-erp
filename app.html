<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 ERP · REV-0 본체</title><link rel="icon" href="sj-icon.png"><link rel="apple-touch-icon" href="sj-icon.png">
<style>
:root{--bg:#0d1117;--panel:#0f1620;--panel2:#161b22;--panel3:#1c2230;--line:#242c38;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);display:flex;height:100vh;overflow:hidden}
/* 좌측 사이드바 */
aside{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:#e5484d;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.brand b{font-size:14px;display:block;line-height:1.2}.brand .rev{font-family:var(--mono);font-size:10px;background:var(--blue);color:#08131f;padding:1px 7px;border-radius:5px;margin-top:2px;display:inline-block}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.grp{margin:1px 0}
.gh{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;user-select:none;font-size:13.5px;font-weight:700}
.gh:hover{background:var(--panel3)}
.gh .dot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.gh .num{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.gh .chev{color:var(--faint);font-size:11px;transition:.15s;margin-left:6px}
.gh.open .chev{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 8px}
.grp.open .sub{display:block}
.mh{font-size:10.5px;color:var(--faint);padding:6px 16px 3px 20px;letter-spacing:.5px}
.item{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 26px;cursor:pointer;font-size:12.5px;color:var(--dim)}
.item:hover{background:var(--panel3);color:var(--txt)}
.item.on{background:var(--panel3);color:var(--txt);border-left:3px solid var(--blue);padding-left:23px}
.item .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.item .badge{margin-left:auto;font-size:9px;padding:1px 6px;border-radius:20px}
.foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}
.foot a{font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.foot a:hover{border-color:var(--blue);color:var(--blue)}
/* 우측 본문 */
main{flex:1;display:flex;flex-direction:column;min-width:0}
topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
topbar .crumb{font-size:12px;color:var(--faint)}topbar .crumb b{color:var(--txt);font-size:14px}
topbar .r{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--mono)}
.stage{flex:1;overflow:auto;background:var(--bg);position:relative}
.stage iframe{width:100%;height:100%;border:0;display:block}
.ph{display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
.ph .box{max-width:440px}.ph .ic{font-size:44px}.ph h2{margin:12px 0 6px;font-size:18px}.ph p{color:var(--dim);font-size:13.5px;line-height:1.7}
.ph a{display:inline-block;margin-top:10px;background:#1f6feb;color:#fff;text-decoration:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:13px}
.ph a.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-left:8px}
</style></head><body>
<aside>
 <div class="brand"><div class="logo">SJ</div><div><b>승정 ERP</b><span class="rev">REV-0</span></div></div>
 <div class="nav" id="nav"><div style="padding:20px;color:var(--faint);font-size:12px">불러오는 중…</div></div>
 <div class="foot"><a href="설계/rev0-map.html">🗺️ 구조도 편집</a><a href="index.html">🏠 시작화면</a><a href="index.html" target="_blank">📦 기존 큰 앱</a></div>
</aside>
<main>
 <topbar><div class="crumb" id="crumb"><b>승정 ERP REV-0</b></div><div class="r">구조도 연동 · 클라우드</div></topbar>
 <div class="stage" id="stage"></div>
</main>
<script src="_lib/supabase.js"></script>
<script src="_lib/cloud.js"></script>
<script>
/* 화면 이름 → 실제 모듈 파일 (있는 것만; 없으면 준비중) */
var MOD={
 "고객사":"partners.html","공급사":"partners.html","거래선(납품처)":"partners.html","매입처 관리":"partners.html","공급처 관리":"partners.html","거래처":"partners.html","고객 등록":"partners.html",
 "수주 등록":"sales.html","수주 조회":"sales.html","수주 변경/취소":"sales.html","영업·수주":"sales.html","수주 관리":"sales.html",
 "BOM 관리":"생산/bom.html","BOM LIST(종합)":"생산/bom.html","원자재/BOM":"생산/bom.html","BOM LIST 열기 (실데이터·전PC공유)":"생산/bom.html",
 "품번 마스터":"생산/itemmaster.html","품목 마스터":"생산/itemmaster.html"
};
var STRUCT=null, OPEN={}, CUR=null;
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fileFor(name,st){ if(MOD[name])return MOD[name]; if(st==="bom")return "생산/bom.html"; return null; }
function toggle(ci){ OPEN[ci]=!OPEN[ci]; buildNav(); }
function buildNav(){
 var nav=document.getElementById("nav");
 if(!STRUCT||!STRUCT.length){ nav.innerHTML='<div style="padding:20px;color:var(--faint);font-size:12.5px;line-height:1.7">구조도 데이터가 없습니다.<br><a href="설계/rev0-map.html" style="color:var(--blue)">구조도</a>를 한 번 열고 저장하면<br>여기 메뉴가 자동으로 생깁니다.</div>'; return; }
 var h="";
 STRUCT.forEach(function(c,ci){
  var col=c.color||"#3b4657", op=OPEN[ci]===true;
  h+='<div class="grp'+(op?" open":"")+'"><div class="gh'+(op?" open":"")+'" onclick="toggle('+ci+')"><span class="dot" style="background:'+col+'22;color:'+col+'">■</span><span>'+esc(c.label)+'</span><span class="num">'+esc(c.num||"")+'</span><span class="chev">▶</span></div><div class="sub">';
  (c.mids||[]).forEach(function(m,mi){
   h+='<div class="mh">'+esc(m.hdr)+'</div>';
   (m.items||[]).forEach(function(it,ii){
    var key=ci+"_"+mi+"_"+ii, has=!!fileFor(it.name,it.st);
    h+='<div class="item'+(CUR===key?" on":"")+'" onclick="openScreen('+ci+','+mi+','+ii+')"><span class="d" style="background:'+(has?"#3fb950":"#4b5563")+'"></span><span>'+esc(it.name)+'</span>'+(it.st==="bom"?'<span class="badge" style="background:rgba(88,166,255,.18);color:var(--blue)">BOM</span>':(has?'':'<span class="badge" style="background:rgba(139,148,158,.15);color:var(--faint)">준비중</span>'))+'</div>';
   });
  });
  h+='</div></div>';
 });
 nav.innerHTML=h;
}
function openScreen(ci,mi,ii){
 var it=STRUCT[ci].mids[mi].items[ii]; CUR=ci+"_"+mi+"_"+ii;
 document.getElementById("crumb").innerHTML='<span style="color:var(--faint)">'+esc(STRUCT[ci].label)+' · '+esc(STRUCT[ci].mids[mi].hdr)+'</span> &nbsp;<b>'+esc(it.name)+'</b>';
 var file=fileFor(it.name,it.st), st=document.getElementById("stage");
 if(file){ st.innerHTML='<iframe src="'+file+'"></iframe>'; }
 else{ st.innerHTML='<div class="ph"><div class="box"><div class="ic">🚧</div><h2>'+esc(it.name)+'</h2><p>이 화면은 아직 <b>새 구조(클라우드)로 준비 중</b>이에요.<br>지금은 기존 큰 앱에서 사용하실 수 있어요.</p><a href="index.html" target="_blank">📦 기존 큰 앱에서 열기</a><a class="ghost" href="설계/rev0-map.html">🗺️ 구조도 편집</a></div></div>'; }
 buildNav();
}
function welcome(){ document.getElementById("stage").innerHTML='<div class="ph"><div class="box"><div class="ic">🏭</div><h2>승정 ERP · REV-0</h2><p>왼쪽 메뉴에서 항목을 선택하세요.<br>메뉴는 <b>구조도</b>에서 자동으로 만들어지고,<br>집·사무실 어디서든 같은 내용이 보입니다.</p><a href="sales.html" onclick="event.preventDefault();document.querySelector(&quot;.stage&quot;).innerHTML=&quot;&quot;">　</a></div></div>'; }

function applyStruct(v){ if(v&&v.length){ STRUCT=v; buildNav(); } }
(function(){
 welcome();
 try{ var raw=localStorage.getItem("SJ_MAP_STRUCT"); if(raw){ STRUCT=JSON.parse(raw); buildNav(); } }catch(e){}
 if(window.Cloud){
   Cloud.get("map_struct").then(function(v){
     if(v&&v.length){ applyStruct(v); }
     else if(STRUCT&&STRUCT.length){ Cloud.set("map_struct",STRUCT); } /* 로컬만 있으면 클라우드에 올려 공유 */
   });
   Cloud.on("map_struct", applyStruct);
 }
 if(!STRUCT) buildNav();
})();
</script>
</body></html>
