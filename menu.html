<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 ERP · 설계 메뉴 (구조도 연동)</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--panel3:#21262d;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--blue:#58a6ff;--green:#3fb950;--kr:Pretendard,"Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px}header .sub{color:var(--dim);font-size:11.5px}
header .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel3);color:var(--txt);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--blue)}
.search{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--txt);width:200px}
.main{display:flex;height:calc(100vh - 46px)}
.side{width:360px;flex-shrink:0;border-right:1px solid var(--line);overflow:auto;padding:8px 0}
.cat{margin:0 0 2px}
.crow{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;user-select:none}
.crow:hover{background:var(--panel2)}
.tw{width:12px;color:var(--faint);font-size:10px}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.num{font-family:var(--mono);font-size:11px;color:var(--faint)}
.lab{font-weight:700}
.mid{padding-left:20px}
.midh{color:var(--dim);font-size:12px;padding:4px 12px;font-weight:700}
.scr{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 30px;cursor:pointer;font-size:13px}
.scr:hover{background:var(--panel2)}.scr.sel{background:var(--panel3);border-left:3px solid var(--blue);padding-left:27px}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hasmemo{margin-left:auto;color:var(--green);font-size:11px}
.detail{flex:1;padding:22px 26px;overflow:auto}
.crumb{color:var(--dim);font-size:12px;margin-bottom:8px}
.dh{font-size:20px;font-weight:800;margin:0 0 4px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
textarea{width:100%;min-height:260px;margin-top:14px;background:var(--panel3);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:14px;line-height:1.6;padding:14px;resize:vertical}
textarea:focus{border-color:var(--blue);outline:none}
.saveinfo{font-size:12px;color:var(--green);margin-top:8px;min-height:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:110px}
.kpi b{font-size:24px;font-weight:800}.kpi span{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--dim);margin-top:14px}
.note b{color:var(--blue)}
.empty{color:var(--faint);padding:20px}
</style></head><body>
<header>
 <h1>승정 ERP · 설계 메뉴</h1><span class="sub">구조도 연동 · 화면별 메모</span>
 <span class="sp">
  <input class="search" id="q" placeholder="화면 검색…" oninput="doSearch(this.value)">
  <a class="btn" href="rev0-map.html">🗺️ 구조 편집(구조도)</a>
  <a class="btn" href="graph.html">🕸️ 그래프</a>
  <a class="btn" href="index2.html">← 메인</a>
 </span>
</header>
<div class="main">
 <div class="side" id="side"></div>
 <div class="detail" id="detail"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script>
var STCOL={live:'#3fb950',todo:'#8b949e',bom:'#58a6ff'},STLAB={live:'작동',todo:'준비중',bom:'BOM'};
var STRUCT=[], MEMOS={}, SEL=null, OPEN={}, QUERY='', _st=null;

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pathKey(a){return a.join(' / ');}

/* ── 메모 저장(로컬 + 클라우드) ── */
function loadMemos(){ try{MEMOS=JSON.parse(localStorage.getItem('SJ_ERP_MEMOS')||'{}')||{};}catch(e){MEMOS={};} }
function saveMemos(){ try{localStorage.setItem('SJ_ERP_MEMOS',JSON.stringify(MEMOS));}catch(e){} if(window.Cloud)Cloud.set('menu_memos',MEMOS); }
/* 옛 메모(SJ_ERP_MEMO_<id>)를 화면 경로 기준으로 1회 이사 → 메모 보존 */
function migrateMemos(){
  if(localStorage.getItem('SJ_MEMO_MIGRATED_v1'))return;
  try{
    var old=JSON.parse(localStorage.getItem('SJ_ERP_DESIGN_v4')||'null');
    if(old&&old.length){ (function w(ns,p){ns.forEach(function(n){var np=p.concat(n.ko);
      if(!(n.ch&&n.ch.length)){ var m=localStorage.getItem('SJ_ERP_MEMO_'+n.id); if(m&&m.trim()) MEMOS[pathKey(np)]=m; }
      if(n.ch&&n.ch.length)w(n.ch,np);});})(old,[]); }
  }catch(e){}
  localStorage.setItem('SJ_MEMO_MIGRATED_v1','1'); saveMemos();
}

/* ── 구조(구조도 map_struct) 로드 ── */
function loadStruct(){ try{STRUCT=JSON.parse(localStorage.getItem('SJ_MAP_STRUCT'))||[];}catch(e){STRUCT=[];} }

function matchScreen(cat,mid,it){ if(!QUERY)return true; var s=(cat.label+' '+mid.hdr+' '+it.name).toLowerCase(); return s.indexOf(QUERY)>=0; }
function renderSide(){
 var s=document.getElementById('side');
 if(!STRUCT.length){ s.innerHTML='<div class="empty">구조가 비어 있어요.<br><a href="rev0-map.html" style="color:var(--blue)">구조도</a>에서 대분류·중분류·화면을 만들면 여기에 자동으로 나타나요.</div>'; return; }
 var h='';
 STRUCT.forEach(function(c,ci){
  var open=QUERY?true:(OPEN[ci]!==false);
  h+='<div class="cat"><div class="crow" onclick="tg('+ci+')"><span class="tw">'+(open?'▾':'▸')+'</span><span class="dot" style="background:'+(c.color||'#5a6b78')+'"></span><span class="num">'+(c.num||'')+'</span><span class="lab">'+esc(c.label)+'</span></div>';
  if(open)(c.mids||[]).forEach(function(m,mi){
    var items=(m.items||[]).filter(function(it){return matchScreen(c,m,it);});
    if(QUERY&&!items.length)return;
    h+='<div class="mid"><div class="midh">'+esc(m.hdr)+'</div>';
    items.forEach(function(it){
      var path=[c.label,m.hdr,it.name],k=pathKey(path),sel=(SEL===k)?' sel':'',has=MEMOS[k]&&MEMOS[k].trim();
      h+='<div class="scr'+sel+'" onclick="pick('+ci+','+mi+',\''+esc(it.name).replace(/\x27/g,"")+'\')" data-k="'+esc(k)+'"><span class="sdot" style="background:'+(STCOL[it.st]||'#8b949e')+'"></span>'+esc(it.name)+(has?'<span class="hasmemo">✎ 메모</span>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='</div>';
 });
 s.innerHTML=h;
}
function tg(ci){OPEN[ci]=(OPEN[ci]===false);renderSide();}
function pick(ci,mi,name){ var c=STRUCT[ci],m=c.mids[mi],it=(m.items||[]).filter(function(x){return x.name===name;})[0]||{name:name};
 SEL=pathKey([c.label,m.hdr,it.name]); renderSide(); renderDetail(c,m,it); }

function renderDetail(c,m,it){
 var d=document.getElementById('detail'); var k=SEL;
 var st=it.st||'todo';
 var h='<div class="crumb">'+esc(c.num||'')+' '+esc(c.label)+'  ›  '+esc(m.hdr)+'</div>';
 h+='<div class="dh">'+esc(it.name)+'<span class="tag" style="background:'+(STCOL[st]||'#333')+'22;color:'+(STCOL[st]||'#8b949e')+'">'+(STLAB[st]||st)+'</span></div>';
 h+='<div style="color:var(--dim);font-size:13px">이 화면에 들어갈 항목·입력칸·규칙을 메모로 적어두세요. (자동 저장 · 모든 PC 공유)</div>';
 h+='<textarea id="memo" placeholder="예) 필수 입력: 품번, 수량, LOT / 자동: 일시, 작업자 / 규칙: 검사 미합격 시 저장 차단 …" oninput="onMemo()">'+esc(MEMOS[k]||'')+'</textarea>';
 h+='<div class="saveinfo" id="saveinfo"></div>';
 h+='<div class="note">🗺️ <b>구조(대·중·소분류) 변경</b>은 <a href="rev0-map.html" style="color:var(--blue)">구조도</a>에서 하세요. 바꾸면 이 메뉴·그래프에 <b>자동 반영</b>됩니다. 메모는 그대로 유지돼요.</div>';
 d.innerHTML=h;
}
function onMemo(){
 var t=document.getElementById('memo'); if(!t||!SEL)return;
 MEMOS[SEL]=t.value;
 clearTimeout(_st); _st=setTimeout(function(){ saveMemos(); var s=document.getElementById('saveinfo'); if(s){s.textContent='저장됨 ✓ '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});} renderSide(); },500);
}
function renderHome(){
 var d=document.getElementById('detail');
 var cat=STRUCT.length,mid=0,scr=0,memo=0;
 STRUCT.forEach(function(c){(c.mids||[]).forEach(function(m){mid++;(m.items||[]).forEach(function(it){scr++;if(MEMOS[pathKey([c.label,m.hdr,it.name])])memo++;});});});
 d.innerHTML='<div class="dh">설계 개요</div><div style="color:var(--dim);font-size:13px">왼쪽에서 화면을 클릭해 메모를 적어보세요.</div>'
  +'<div class="kpis"><div class="kpi"><b>'+cat+'</b><span>대분류</span></div><div class="kpi"><b>'+mid+'</b><span>중분류</span></div><div class="kpi"><b>'+scr+'</b><span>화면</span></div><div class="kpi"><b style="color:var(--green)">'+memo+'</b><span>메모 작성</span></div></div>'
  +'<div class="note">이 화면 구조는 <b>구조도</b>에서 온 것입니다. 구조를 바꾸면 여기에 자동으로 반영돼요.</div>';
}
function doSearch(v){QUERY=(v||'').trim().toLowerCase();renderSide();}

function redraw(){ renderSide(); if(SEL){ var f=findByKey(SEL); if(f)renderDetail(f.c,f.m,f.it); else renderHome(); } else renderHome(); }
function findByKey(k){ for(var ci=0;ci<STRUCT.length;ci++){var c=STRUCT[ci];var mids=c.mids||[];for(var mi=0;mi<mids.length;mi++){var m=mids[mi];var items=m.items||[];for(var ii=0;ii<items.length;ii++){if(pathKey([c.label,m.hdr,items[ii].name])===k)return{c:c,m:m,it:items[ii]};}}} return null; }

/* ── 시작 ── */
loadStruct(); loadMemos(); migrateMemos(); redraw();
if(window.Cloud){
 Cloud.get('map_struct').then(function(v){ if(v&&v.length){ STRUCT=v; try{localStorage.setItem('SJ_MAP_STRUCT',JSON.stringify(v));}catch(e){} redraw(); } });
 Cloud.on('map_struct', function(v){ if(v&&v.length){ STRUCT=v; try{localStorage.setItem('SJ_MAP_STRUCT',JSON.stringify(v));}catch(e){} redraw(); } });
 Cloud.get('menu_memos').then(function(v){ if(v&&typeof v==='object'){ MEMOS=v; try{localStorage.setItem('SJ_ERP_MEMOS',JSON.stringify(v));}catch(e){} redraw(); } });
 Cloud.on('menu_memos', function(v){ if(v&&typeof v==='object'){ MEMOS=v; redraw(); } });
}
/* 같은 브라우저 다른 탭에서 구조도 편집 시 반영 */
window.addEventListener('storage', function(e){ if(e.key==='SJ_MAP_STRUCT'){ loadStruct(); redraw(); } });
</script>
</body></html>
