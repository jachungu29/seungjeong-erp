<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승정 BOM (클라우드)</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--line:#e4e8f0;--tx:#1f2937;--dim:#6b7480;--faint:#9aa2af;--blue:#2563eb;--orange:#e8622a;--mono:"JetBrains Mono",Consolas,monospace;--kr:Pretendard,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--kr);font-size:13.5px}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.kpi.warn{background:#fef6f3;border-color:#f6d5c9}
.kpi .lab{font-size:12px;color:var(--dim)}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--dim);margin-left:3px}
.tabs{display:flex;gap:8px;margin-bottom:-1px;padding-left:6px}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:12px 12px 0 0;padding:10px 18px;font:inherit;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--card);border-color:var(--line);color:var(--tx)}
.tab .b{font-family:var(--mono);font-size:11px;background:#e2e8f0;color:#475569;border-radius:20px;padding:1px 8px}
.tab.on .b{background:var(--orange);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:16px 18px}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sbar .sw{flex:1;position:relative}
.sbar input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 34px;font:inherit;font-size:13.5px;background:#f8fafc}
.sbar input:focus{outline:2px solid #bcd4f6;border-color:var(--blue);background:#fff}
.sbar .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.cnt{font-size:12.5px;color:var(--dim);white-space:nowrap}
.addb{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.addb:hover{background:#cf541f}
.toolr{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:#475569}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.bomt{width:100%;border-collapse:collapse;font-size:13px}
.bomt th{text-align:left;color:var(--dim);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.bomt th.rt,.bomt td.rt{text-align:right}.bomt th.ct,.bomt td.ct{text-align:center}
.bomt td{padding:8px 10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
.bomt tbody tr:hover td{background:#f8fbff}
.bomt tr.lv0 td{background:#fbf7f0;font-weight:600}
.bomt tr.lv0:hover td{background:#f8f0e4}
.lname{min-width:280px}
.tree{color:#c3ccd8;font-family:var(--mono);white-space:pre}
.lvb{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;color:#fff;font-family:var(--mono);font-size:10.5px;border-radius:5px;padding:0 4px;margin-right:5px;vertical-align:1px}
.pno{font-family:var(--mono);font-size:11.5px;color:var(--blue)}
.spec{color:#475569}
.pill{background:#eef2f7;color:#475569;border-radius:6px;padding:2px 8px;font-size:11.5px;white-space:nowrap}
.nowrap{white-space:nowrap}
.mb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer;color:#475569;margin-left:3px}
.mb:hover{border-color:var(--blue);color:var(--blue)}
.mb.d:hover{border-color:#dc2626;color:#dc2626}.mb.save{background:var(--blue);color:#fff;border-color:var(--blue)}
.ei{border:1px solid #c7d3e6;border-radius:6px;padding:5px 7px;font:inherit;font-size:12.5px;width:100%;min-width:60px}
.ei:focus{outline:2px solid #bcd4f6;border-color:var(--blue)}
tr.editing td{background:#eff6ff}
.empty{padding:40px;text-align:center;color:var(--faint)}
.hdrow{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:20px;font-weight:800;margin:0}
.rev{font-family:var(--mono);font-size:11px;background:var(--blue);color:#fff;padding:2px 8px;border-radius:6px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div class="hdrow"><h1>BOM LIST</h1><span class="rev">☁ 클라우드 v2</span><span class="status" id="st">연결 준비 중…</span></div>
<div class="kpis">
 <div class="kpi"><div class="lab">완제품 (Lv0)</div><div class="v"><span id="k_lv0">0</span><small>품목</small></div></div>
 <div class="kpi"><div class="lab">총 BOM 항목</div><div class="v"><span id="k_tot">0</span><small>행</small></div></div>
 <div class="kpi"><div class="lab">집계 생산수량</div><div class="v">0<small>EA</small></div></div>
 <div class="kpi"><div class="lab">총 불량</div><div class="v">0<small>EA</small></div></div>
 <div class="kpi warn"><div class="lab">종합 불량율</div><div class="v">0<small>ppm</small></div></div>
</div>
<div class="tabs">
 <button class="tab on" id="tabBom" onclick="setTab('bom')">BOM LIST <span class="b" id="tab_bom_n">0</span></button>
 <button class="tab" id="tabPpm" onclick="setTab('ppm')">불량율 PPM <span class="b">0</span></button>
</div>
<div class="panel" id="panelBom">
 <div class="sbar">
  <div class="sw"><span class="ico">🔍</span><input id="q" placeholder="품번·품명·금형·설비·공급처 검색" oninput="render()"></div>
  <span class="cnt" id="cntinfo">계층형 BOM</span>
  <button class="addb" onclick="addRow()">＋ 항목 추가</button>
 </div>
 <div class="toolr"><button class="tbtn" onclick="exportCSV()">CSV 내보내기</button><button class="tbtn" onclick="reload()">↻ 새로고침</button></div>
 <div id="bomBody"></div>
</div>
<div class="panel" id="panelPpm" style="display:none">
 <div class="empty">불량율 PPM — 생산실적·불량 데이터 연동 예정입니다. (이후 단계에서 구현)</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL="https://gyasbmiordkxcfpwgvio.supabase.co", SB_KEY="sb_publishable_oMdTYbr11auTzSaYwY9Jew_qbKO3SbF";
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var COLS=["name","pno","spec","mat","price","unit","qty","wt","uph"];
var ALLK=["lv","name","type","pno","spec","mat","price","unit","qty","wp","wr","wt","ct","cvt","uph","mold","eqp","sup","remark","eqpcode"];
var ROWS=[], EDIT=null, EBUF={}, TAB="bom";
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function eatt(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function st(t,c){var s=document.getElementById("st");if(s){s.textContent=t;s.style.color=(c==="g"?"#16a34a":(c==="r"?"#dc2626":"#8a93a6"));}}
function _f(id){for(var i=0;i<ROWS.length;i++)if(ROWS[i].id===id)return ROWS[i];return null;}

async function _fetch(){var r=await sb.from("bom").select("*").order("pos",{ascending:true}).order("id");if(r.error)r=await sb.from("bom").select("*").order("id");return r;}
async function boot(){st("클라우드 연결 중…");var r=await _fetch();if(r.error){st("연결 오류: "+r.error.message,"r");alert("연결 오류: "+r.error.message);return;}ROWS=r.data||[];st("클라우드 연결됨 ✓","g");render();}
async function reload(){var r=await _fetch();if(r.error)return;ROWS=r.data||[];render();}

function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function kpis(){
 var lv0=0,tot=ROWS.length,pcs=0;
 ROWS.forEach(function(r){var lv=parseInt(r.lv,10)||0;if(lv===0)lv0++;});
 return {lv0:lv0,tot:tot,pcs:pcs};
}
function matPill(m){if(!m||!String(m).trim())return '<span style="color:#c3c8d2">·</span>';return '<span class="pill">'+esc(m)+'</span>';}
function lvBadge(lv){var c=["#334155","#2563eb","#0e9488","#64748b"][lv>3?3:lv];return '<span class="lvb" style="background:'+c+'">'+lv+'</span>';}

function filtered(){
 var q=(document.getElementById("q").value||"").trim().toLowerCase();
 if(!q)return ROWS;
 return ROWS.filter(function(r){return ((r.name||"")+" "+(r.pno||"")+" "+(r.mat||"")+" "+(r.mold||"")+" "+(r.eqp||"")+" "+(r.sup||"")).toLowerCase().indexOf(q)>=0;});
}
function render(){
 var k=kpis();
 document.getElementById("k_lv0").textContent=k.lv0;
 document.getElementById("k_tot").textContent=k.tot;
 document.getElementById("tab_bom_n").textContent=k.tot;
 var parts=k.tot-k.lv0;
 document.getElementById("cntinfo").innerHTML="완제품 "+k.lv0+" · 부품 "+parts+" · 계층형 BOM";
 var list=filtered();
 var h='<table class="bomt"><thead><tr><th class="lname">품목명 (계층)</th><th>품번</th><th>규격</th><th>재질</th><th class="rt">단가</th><th class="ct">단위</th><th class="ct">수량</th><th class="rt">총중량(G)</th><th class="rt">UPH</th><th class="ct">관리</th></tr></thead><tbody>';
 list.forEach(function(r){
  var lv=parseInt(r.lv,10)||0;
  if(EDIT===r.id){h+=erow(r);return;}
  var conn=lv>0?('<span class="tree">'+(new Array(lv).join("│&nbsp;&nbsp;"))+'└─</span>'):'';
  h+='<tr class="lv'+(lv===0?0:1)+'" data-id="'+r.id+'">';
  h+='<td class="lname"><span class="ind">'+conn+'</span>'+lvBadge(lv)+' <b'+(lv===0?' style="font-weight:800"':'')+'>'+esc(r.name)+'</b></td>';
  h+='<td class="pno">'+esc(r.pno)+'</td><td class="spec">'+esc(r.spec)+'</td><td>'+matPill(r.mat)+'</td>';
  h+='<td class="rt">'+esc(r.price)+'</td><td class="ct">'+(esc(r.unit)||"·")+'</td><td class="ct">'+(esc(r.qty)||"·")+'</td><td class="rt">'+(esc(r.wt)||"·")+'</td><td class="rt">'+(esc(r.uph)||"·")+'</td>';
  h+='<td class="ct nowrap"><button class="mb" onclick="startEdit('+r.id+')">편집</button><button class="mb d" onclick="delRow('+r.id+')">삭제</button></td></tr>';
 });
 h+='</tbody></table>';
 if(!list.length)h='<div class="empty">데이터가 없습니다. <b>＋ 항목 추가</b>로 등록하세요.</div>';
 document.getElementById("bomBody").innerHTML=h;
}
function erow(r){
 var lv=parseInt(r.lv,10)||0;
 function inp(k,ph){return '<input class="ei" value="'+eatt(EBUF[k])+'" oninput="EBUF[\''+k+'\']=this.value" placeholder="'+(ph||"")+'">';}
 var lvs='<select class="ei" style="width:64px" onchange="EBUF.lv=this.value">';for(var i=0;i<=6;i++)lvs+='<option value="'+i+'"'+((""+lv)===(""+i)?" selected":"")+'>Lv'+i+'</option>';lvs+='</select>';
 return '<tr class="editing"><td class="lname">'+lvs+' '+inp("name","품명 *")+'</td><td>'+inp("pno")+'</td><td>'+inp("spec")+'</td><td>'+inp("mat")+'</td><td>'+inp("price")+'</td><td>'+inp("unit")+'</td><td>'+inp("qty")+'</td><td>'+inp("wt")+'</td><td>'+inp("uph")+'</td><td class="ct nowrap"><button class="mb save" onclick="saveEdit()">저장</button><button class="mb" onclick="cancelEdit()">취소</button></td></tr>';
}
function startEdit(id){var r=_f(id);if(!r)return;EDIT=id;EBUF={};ALLK.forEach(function(k){EBUF[k]=r[k];});EBUF.lv=parseInt(r.lv,10)||0;render();}
function cancelEdit(){EDIT=null;EBUF={};render();}
async function saveEdit(){
 if(!EBUF.name||!String(EBUF.name).trim()){alert("품명은 필수입니다.");return;}
 var rec={lv:parseInt(EBUF.lv,10)||0};COLS.forEach(function(k){if(k!=="name")rec[k]=(EBUF[k]==null?"":String(EBUF[k]).trim());});rec.name=String(EBUF.name).trim();
 st("저장 중…");var res=await sb.from("bom").update(rec).eq("id",EDIT);
 if(res.error){st("저장 실패","r");alert("저장 실패: "+res.error.message);return;}
 var r=_f(EDIT);if(r)for(var k in rec)r[k]=rec[k];EDIT=null;EBUF={};st("저장됨 ✓","g");render();
}
function _maxPos(){var m=0;ROWS.forEach(function(r){var p=(r.pos==null?r.id:r.pos);if(p>m)m=p;});return m;}
async function addRow(){
 st("추가 중…");var rec={lv:0,name:"새 품목",pos:_maxPos()+1};
 var res=await sb.from("bom").insert(rec).select();
 if(res.error){st("추가 실패","r");alert("추가 실패: "+res.error.message);return;}
 ROWS.push(res.data[0]);st("추가됨 ✓","g");render();startEdit(res.data[0].id);
}
async function delRow(id){var r=_f(id);if(!confirm("삭제할까요? (모든 PC에서 사라짐)"+(r?("\n"+r.name):"")))return;st("삭제 중…");var res=await sb.from("bom").delete().eq("id",id);if(res.error){st("삭제 실패","r");return;}ROWS=ROWS.filter(function(x){return x.id!==id;});st("삭제됨 ✓","g");render();}

function setTab(t){TAB=t;document.getElementById("tabBom").classList.toggle("on",t==="bom");document.getElementById("tabPpm").classList.toggle("on",t==="ppm");document.getElementById("panelBom").style.display=(t==="bom")?"":"none";document.getElementById("panelPpm").style.display=(t==="ppm")?"":"none";}
function exportCSV(){var hd=["Lv"].concat(COLS);var lines=[hd.join(",")];ROWS.forEach(function(r){lines.push([r.lv].concat(COLS.map(function(k){var s=String(r[k]==null?"":r[k]);if(/[",\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s;})).join(","));});var b=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="승정_BOM.csv";a.click();}
boot();
</script>
</body></html>
