<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="승정 이상·안전·소방 신고">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="sj-icon.png">

<title>㈜승정 · 설비이상·안전·소방 통합 신고</title>
<style>
:root{
 --bg:#f0eee9;--card:#ffffff;--line:#e7e3db;--line2:#efece5;
 --txt:#1d1f24;--dim:#8b8f96;--faint:#a7abb2;
 --machine:#a9583e;--safety:#0071ce;--fire:#d64545;--blue:#2f6feb;--green:#2f9e44;
 --kr:Pretendard,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--kr);font-size:15px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:0 0 60px}
.top{background:#1a1d22;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .mk{width:34px;height:34px;border-radius:9px;background:#c0392b;display:flex;align-items:center;justify-content:center;font-weight:800}
.top b{font-size:16px}.top .v{margin-left:auto;font-size:10px;opacity:.6}
/* 언어 선택 */
.langbar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;background:var(--bg);-webkit-overflow-scrolling:touch}
.langbar button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;color:#555}
.langbar button.on{background:#1a1d22;color:#fff;border-color:#1a1d22}
.body{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:13px}
.card .t{font-size:14px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card .t .n{width:24px;height:24px;border-radius:7px;background:#1a1d22;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
select,input,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--txt);font:inherit;font-size:15px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{min-height:82px;resize:vertical}
/* 양식 표 */
table.form{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.form th{width:96px;text-align:left;vertical-align:middle;padding:10px 9px;background:#faf7f2;border:1px solid var(--line);color:#55595f;font-size:12.5px;font-weight:800;line-height:1.35}
table.form td{padding:8px;border:1px solid var(--line);vertical-align:middle}
table.form select,table.form input,table.form textarea{padding:10px 11px;font-size:14px;border-radius:9px}
table.form textarea{min-height:70px}
/* 유형 스위치 */
.rtypes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rt{border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;transition:.12s}
.rt .ic{font-size:22px;display:block;margin-bottom:3px}
.rt.on[data-rt="설비이상"]{border-color:var(--machine);background:#fbeee9;color:var(--machine)}
.rt.on[data-rt="안전"]{border-color:var(--safety);background:#e9f2fb;color:var(--safety)}
.rt.on[data-rt="소방"]{border-color:var(--fire);background:#fdecec;color:var(--fire)}
.rt.on[data-rt="불량발생"]{border-color:#7c3aed;background:#f1ebfb;color:#7c3aed}
.urg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.urg .u{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 4px;text-align:center;font-weight:800;font-size:13px;cursor:pointer}
.urg .u.on{color:#fff}.urg .u.on[data-u="긴급"]{background:var(--fire);border-color:var(--fire)}
.urg .u.on[data-u="보통"]{background:var(--safety);border-color:var(--safety)}.urg .u.on[data-u="낮음"]{background:var(--dim);border-color:var(--dim)}
/* 사진 첨부 */
.photorow{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.photobtn{width:100%;background:#eef2f7;border:1.5px dashed #b3c1d1;border-radius:10px;padding:15px 10px;font:inherit;font-size:15px;font-weight:800;color:#2f6feb;cursor:pointer}
.photobtn.cam{background:#2f6feb;color:#fff;border:1.5px solid #2f6feb}
.photobtn.alb{background:#eef2f7;color:#2f6feb;border:1.5px dashed #b3c1d1}
.photobtn:active{opacity:.82}
.pthumb{margin-top:8px}
.pthumb img{width:100%;max-height:240px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#f4f2ee;display:block}
.pdel{margin-top:6px;width:100%;background:#fff;border:1px solid var(--fire);color:var(--fire);border-radius:9px;padding:8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.phint{font-size:11px;color:var(--faint);margin-top:6px}
.pbusy{font-size:12px;color:var(--blue);margin-top:6px;font-weight:700}
/* 화면 내장 카메라 */
.cammodal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.cammodal.on{display:flex}
.cammodal video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.camx{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:20px;width:46px;height:46px;border-radius:50%;cursor:pointer}
.camtip{position:absolute;top:16px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cambar{display:flex;gap:14px;padding:18px;background:#000;justify-content:center;align-items:center}
.camshot{width:72px;height:72px;border-radius:50%;background:#fff;border:6px solid #c0392b;cursor:pointer;box-shadow:0 0 0 3px #fff}
.camshot:active{transform:scale(.94)}
.installbtn{width:100%;background:#123a52;color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:12px;box-shadow:0 2px 8px rgba(18,58,82,.25)}
.installbtn:active{opacity:.85}
.submit{width:100%;background:#c0392b;color:#fff;border:none;border-radius:13px;padding:17px;font:inherit;font-size:18px;font-weight:800;cursor:pointer;margin-top:4px}
.submit:active{opacity:.85}
.st{font-size:11px;text-align:center;color:var(--dim);margin-top:8px}
.mine{margin-top:8px}
.mine h3{font-size:13px;font-weight:800;margin:18px 4px 8px}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.rep .rr{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.badge{font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px}
.b-설비이상{background:#fbeee9;color:var(--machine)}.b-안전{background:#e9f2fb;color:var(--safety)}.b-소방{background:#fdecec;color:var(--fire)}.b-불량발생{background:#f1ebfb;color:#7c3aed}
.stt{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px}
.s-접수{background:#eef0f3;color:#6b7280}.s-조치중{background:rgba(208,135,0,.16);color:#d08700}.s-완료{background:rgba(47,158,68,.14);color:var(--green)}
.rep .rc{font-size:14px;font-weight:700;margin-top:5px}
.rep .rthumb{margin-top:6px}.rep .rthumb img{max-width:120px;max-height:100px;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1d22;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.2s;z-index:20;max-width:90%}
.toast.on{opacity:1}
.link{display:block;text-align:center;font-size:12px;color:var(--blue);text-decoration:none;margin-top:14px}
</style></head><body>
<div class="wrap">
 <div class="top"><div class="mk">承</div><b id="hdrTitle">이상·안전·소방 신고</b><span class="v" id="st">…</span></div>

 <div class="langbar" id="langbar"></div>

 <div class="body">
  <button type="button" id="installBtn" class="installbtn" style="display:none" onclick="doInstall()">📲 홈 화면에 추가</button>
  <div class="card">
   <div class="t"><span class="n">📝</span><span data-k="formTitle">비상신고서</span></div>
   <table class="form">
    <tr><th data-k="thType">신고유형</th><td>
     <div class="rtypes" id="rtypes">
      <div class="rt on" data-rt="설비이상"><span class="ic">🔧</span><span class="lb"></span></div>

      <div class="rt" data-rt="소방"><span class="ic">🧯</span><span class="lb"></span></div>
      <div class="rt" data-rt="불량발생"><span class="ic">🚫</span><span class="lb"></span></div>
     </div></td></tr>
    <tr><th data-k="thCat">대분류</th><td><select id="f_cat" onchange="onCat()"></select></td></tr>
    <tr><th data-k="thSub">세부항목</th><td><select id="f_sub"></select></td></tr>
    <tr><th data-k="thContent">현상·내용</th><td><textarea id="f_content"></textarea></td></tr>
    <tr><th data-k="thLoc">위치·설비</th><td><input id="f_loc"></td></tr>
    <tr><th data-k="thUrg">긴급도</th><td>
     <div class="urg" id="urg">
      <div class="u" data-u="긴급"><span class="ue">🔴</span> <span class="ul"></span></div>
      <div class="u on" data-u="보통"><span class="ue">🔵</span> <span class="ul"></span></div>
      <div class="u" data-u="낮음"><span class="ue">⚪</span> <span class="ul"></span></div>
     </div></td></tr>
    <tr><th data-k="thPhoto">사진 첨부</th><td>
     <input type="file" id="f_photo_cam" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)">
     <input type="file" id="f_photo_alb" accept="image/*" style="display:none" onchange="onPhoto(this)">
     <div class="photorow">
      <button type="button" class="photobtn cam" id="photoCamBtn" onclick="openCamera()">📷 사진 촬영</button>
      <button type="button" class="photobtn alb" id="photoAlbBtn" onclick="document.getElementById('f_photo_alb').click()">🖼️ 앨범</button>
     </div>
     <div class="pbusy" id="photoBusy" style="display:none">…</div>
     <div id="photoPrev"></div>
     <div class="phint" id="photoHint"></div>
    </td></tr>
    <tr><th data-k="thReporter">신고자</th><td><input id="f_reporter"></td></tr>
    <tr><th data-k="thAt">발생일시</th><td><input type="datetime-local" id="f_at"></td></tr>
   </table>
  </div>

  <button class="submit" id="submitBtn" onclick="submitReport()">🚨 신고하기</button>
  <div class="st" id="submitSt"></div>

  <div class="mine">
   <h3 id="myTitle">📋 내가 신고한 내역</h3>
   <div id="myList"></div>
  </div>

  <a class="link" id="adminLink" href="이상안전이력.html">🖥️ 관리자 이력 화면 열기 →</a>
 </div>
</div>
<div class="cammodal" id="cammodal">
 <div class="camtip" id="camtip">📷</div>
 <video id="camvideo" playsinline autoplay muted></video>
 <button class="camx" onclick="closeCamera()">✕</button>
 <div class="cambar"><button class="camshot" id="camshot" onclick="capturePhoto()" title="촬영"></button></div>
</div>
<div class="toast" id="toast"></div>

<script src="supabase.js"></script>
<script src="cloud.js"></script>

 return set.indexOf(n)>=0?n:'ko';}catch(e){return 'ko';}}

 return '<button data-l="'+l[0]+'" class="'+(l[0]===LANG?'on':'')+'" onclick="setLang(\''+l[0]+'\')">'+l[1]+'</button>';}).join('');}
function setLang(l){LANG=l;try{localStorage.setItem('SJ_LANG',l);}catch(e){}
 document.documentElement.lang=l;buildLangBar();applyLang();}
function applyLang(){
 document.getElementById('hdrTitle').textContent=tr('title');
 [].forEach.call(document.querySelectorAll('[data-k]'),function(el){el.textContent=tr(el.getAttribute('data-k'));});
 var rts=document.querySelectorAll('#rtypes .rt .lb');rts[0].textContent=tr('tyMachine');rts[1].textContent=tr('tySafety');rts[2].textContent=tr('tyFire');if(rts[3])rts[3].textContent=tr('tyDefect');
 var uls=document.querySelectorAll('#urg .ul');uls[0].textContent=tr('uHigh');uls[1].textContent=tr('uMid');uls[2].textContent=tr('uLow');
 document.getElementById('photoCamBtn').textContent=tr('photoCam');
 document.getElementById('photoAlbBtn').textContent=tr('photoAlbum');
 document.getElementById('photoHint').textContent=tr('photoHint');
 document.getElementById('photoBusy').textContent=tr('photoBusy');
 document.getElementById('f_content').placeholder=tr('contentPh');
 document.getElementById('f_loc').placeholder=tr('locPh');
 document.getElementById('f_reporter').placeholder=tr('reporterPh');
 document.getElementById('submitBtn').textContent=tr('submit');
 document.getElementById('myTitle').textContent=tr('myTitle');
 document.getElementById('adminLink').textContent=tr('adminLink');
 document.getElementById('installBtn').textContent=tr('installBtn');
 fillCats(); renderPhotoPrev(); renderMy();
 setSt(window.__cloudOk?tr('cloudOk'):tr('localMode'), window.__cloudOk?'#2f9e44':'#d64545');
}

function fillCats(){var cur=document.getElementById("f_cat").value;
 var s=document.getElementById("f_cat");
 s.innerHTML=(CATS[TYPE]||[]).map(function(c){return '<option value="'+esc(c)+'">'+esc(catName(c))+'</option>';}).join("");
 if(cur&&(CATS[TYPE]||[]).indexOf(cur)>=0)s.value=cur; onCat();}
function onCat(){var c=document.getElementById("f_cat").value,s=document.getElementById("f_sub");
 s.innerHTML='<option value="">'+esc(tr('selectPh'))+'</option>'+((SUBS[c]||[]).map(function(x){
  return '<option value="'+esc(x[0])+'">'+esc(LANG==='ko'?x[0]:x[1])+'</option>';}).join(""));}
document.getElementById("rtypes").addEventListener("click",function(e){var b=e.target.closest(".rt");if(!b)return;
 TYPE=b.dataset.rt;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});fillCats();});
document.getElementById("urg").addEventListener("click",function(e){var b=e.target.closest(".u");if(!b)return;
 URG=b.dataset.u;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});});

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on");},2400);}

/* 사진: 촬영/선택 → 압축(최대1024px, JPEG) → base64 */
function compressImage(file,maxDim,quality){return new Promise(function(resolve){
 var rd=new FileReader();
 rd.onload=function(){var img=new Image();
  img.onload=function(){var w=img.width,h=img.height;
   if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
   var cv=document.createElement('canvas');cv.width=w;cv.height=h;
   try{cv.getContext('2d').drawImage(img,0,0,w,h);resolve(cv.toDataURL('image/jpeg',quality));}catch(e){resolve('');}};
  img.onerror=function(){resolve('');};img.src=rd.result;};
 rd.onerror=function(){resolve('');};rd.readAsDataURL(file);});}
/* 화면 내장 카메라: 버튼 클릭 → 라이브 미리보기 → 촬영 → 압축 → 저장 */
var CAMSTREAM=null;
function openCamera(){
 var md=navigator.mediaDevices;
 if(!md||!md.getUserMedia){document.getElementById('f_photo_cam').click();return;} /* 구형: 기본 카메라 */
 document.getElementById('camtip').textContent=tr('camTip');
 md.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){
  CAMSTREAM=stream;var v=document.getElementById('camvideo');v.srcObject=stream;
  var p=v.play();if(p&&p.catch)p.catch(function(){});
  document.getElementById('cammodal').classList.add('on');
 }).catch(function(err){
  /* 권한 거부/카메라 없음 → 기본 카메라·파일선택으로 폴백 */
  toast(tr('camFail'));document.getElementById('f_photo_cam').click();
 });
}
function stopCam(){if(CAMSTREAM){try{CAMSTREAM.getTracks().forEach(function(t){t.stop();});}catch(e){}CAMSTREAM=null;}}
function closeCamera(){stopCam();document.getElementById('cammodal').classList.remove('on');var v=document.getElementById('camvideo');try{v.pause();}catch(e){}v.srcObject=null;}
function capturePhoto(){
 var v=document.getElementById('camvideo');var w=v.videoWidth,h=v.videoHeight;
 if(!w||!h){toast(tr('photoFail'));return;}
 var maxDim=1024;if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
 var cv=document.createElement('canvas');cv.width=w;cv.height=h;
 try{cv.getContext('2d').drawImage(v,0,0,w,h);PHOTO=cv.toDataURL('image/jpeg',0.7);}catch(e){PHOTO='';}
 closeCamera();
 if(PHOTO)renderPhotoPrev();else toast(tr('photoFail'));
}
async function onPhoto(inp){var f=inp.files&&inp.files[0];if(!f)return;
 document.getElementById('photoBusy').style.display='block';
 PHOTO=await compressImage(f,1024,0.7);
 document.getElementById('photoBusy').style.display='none';
 if(!PHOTO){toast(tr('photoFail'));return;}
 renderPhotoPrev();}
function renderPhotoPrev(){var box=document.getElementById('photoPrev');
 box.innerHTML=PHOTO?('<div class="pthumb"><img src="'+PHOTO+'" alt="photo"><button type="button" class="pdel" onclick="clearPhoto()">'+esc(tr('delPhoto'))+'</button></div>'):'';}
function clearPhoto(){PHOTO='';['f_photo_cam','f_photo_alb'].forEach(function(id){var i=document.getElementById(id);if(i)i.value='';});renderPhotoPrev();}

/* 내 신고(이 기기) */
function myReps(){try{return JSON.parse(localStorage.getItem("SJ_MY_SAFETY")||"[]");}catch(e){return[];}}
function saveMy(a){try{localStorage.setItem("SJ_MY_SAFETY",JSON.stringify(a.slice(-20)));}catch(e){}}
function renderMy(){var a=myReps().slice().reverse(),box=document.getElementById("myList");
 if(!a.length){box.innerHTML='<div style="color:var(--faint);font-size:12.5px;padding:6px 4px">'+esc(tr('myEmpty'))+'</div>';return;}
 box.innerHTML=a.map(function(r){var stK=r.status||"접수";var stTxt=(STT[stK]&&(STT[stK][LANG]||STT[stK].ko))||stK;
  var ph=(r.hasPhoto||r.photo)?' · '+tr('photoTag'):'';
  return '<div class="rep"><div class="rr"><span class="badge b-'+esc(r.type)+'">'+esc(r.type)+'</span><span>'+esc(catName(r.cat)||"")+'</span><span class="stt s-'+esc(stK)+'">'+esc(stTxt)+'</span></div><div class="rc">'+esc(r.content||"")+'</div><div class="rr" style="margin-top:4px">'+esc(r.loc||"")+' · '+esc((r.at||"").replace("T"," "))+ph+'</div></div>';}).join("");}

async function readAll(){ if(!window.SB)return null;
 try{var r=await window.SB.from("app_state").select("value").eq("key",KEY).maybeSingle();
  return (r.error)?null:((r.data&&r.data.value)||[]);}catch(e){return null;} }

async function submitReport(){
 var content=document.getElementById("f_content").value.trim();
 var cat=document.getElementById("f_cat").value, sub=document.getElementById("f_sub").value;
 var loc=document.getElementById("f_loc").value.trim(), reporter=document.getElementById("f_reporter").value.trim();
 var at=document.getElementById("f_at").value||nowLocal();
 if(!content){toast(tr('needContent'));return;}
 if(!reporter){toast(tr('needReporter'));return;}
 var rec={id:"R"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
  type:TYPE,cat:cat,sub:sub,content:content,loc:loc,urg:URG,reporter:reporter,at:at,
  photo:PHOTO||"",
  status:"접수",action:"",mgr:"",createdAt:new Date().toISOString(),src:(window.__CID||"")};
 document.getElementById("submitSt").textContent=tr('sending');
 var arr=await readAll();
 if(arr===null){ toast(tr('noCloud')); }
 else { arr.push(rec);
  try{ await window.SB.from("app_state").upsert({key:KEY,value:arr,src:(window.__CID||""),updated_at:new Date().toISOString()});
   toast(tr('submitted')); }catch(e){ toast(tr('sendFail')); document.getElementById("submitSt").textContent=""; return; } }
 var recL=Object.assign({},rec); delete recL.photo; recL.hasPhoto=!!rec.photo;
 var my=myReps(); my.push(recL); saveMy(my); renderMy();
 document.getElementById("f_content").value=""; document.getElementById("f_loc").value="";
 document.getElementById("f_at").value=nowLocal();
 clearPhoto();
 document.getElementById("submitSt").textContent=tr('receiptNo')+rec.id;
}

async function refreshStatus(){
 var arr=await readAll();
 if(arr===null){window.__cloudOk=false;setSt(tr('localMode'),"#d64545");return;}
 window.__cloudOk=true;setSt(tr('cloudOk'),"#2f9e44");
 var my=myReps(); if(my.length){var map={};arr.forEach(function(r){map[r.id]=r;});
  my=my.map(function(r){var c=map[r.id];if(!c)return r;var m=Object.assign({},c);delete m.photo;m.hasPhoto=!!c.photo;return m;}); saveMy(my);}
 renderMy();
}

/* PWA: 홈 화면에 추가(앱 설치) */
var deferredPrompt=null;
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;var b=document.getElementById('installBtn');if(b&&!isStandalone())b.style.display='block';});
window.addEventListener('appinstalled',function(){deferredPrompt=null;var b=document.getElementById('installBtn');if(b)b.style.display='none';});
function doInstall(){
 if(deferredPrompt){deferredPrompt.prompt();try{deferredPrompt.userChoice.finally(function(){deferredPrompt=null;document.getElementById('installBtn').style.display='none';});}catch(e){}return;}
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 toast(tr(ios?'installIOS':'installAndroid'));
}
function initInstallBtn(){var b=document.getElementById('installBtn');if(!b)return;
 if(isStandalone()){b.style.display='none';return;}
 /* 모바일이면 항상 노출(안드로이드는 위 이벤트로 기능, iOS는 안내) */
 if(/iphone|ipad|ipod|android/i.test(navigator.userAgent))b.style.display='block';}

/* init */
LANG=detectLang();document.documentElement.lang=LANG;
buildLangBar(); applyLang(); initInstallBtn(); renderMy(); refreshStatus();
try{ if(window.SB) window.SB.channel("safety_rt_m")
  .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"key=eq."+KEY},refreshStatus).subscribe(); }catch(e){}
</script>
