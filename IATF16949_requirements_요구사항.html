<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IATF 16949:2016 요구사항</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --primary: #0A2463;
    --accent: #E84855;
    --gold: #C9AE4A;
    --surface: #F7F6F2;
    --card: #FFFFFF;
    --border: #DDD9CE;
    --text: #1A1A1A;
    --muted: #6B6860;
    --tag-bg: #EBF0F8;
    --tag-text: #0A2463;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--surface);
    color: var(--text);
    line-height: 1.6;
  }

  /* HEADER */
  header {
    background: var(--primary);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(10,36,99,0.3);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-badge {
    background: var(--accent);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .header-title h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-title p {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 1px;
  }
  .header-search {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #search-input {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    width: 260px;
    outline: none;
    transition: background 0.2s;
  }
  #search-input::placeholder { color: rgba(255,255,255,0.5); }
  #search-input:focus { background: rgba(255,255,255,0.2); }
  #search-count {
    font-size: 12px;
    opacity: 0.6;
    white-space: nowrap;
  }

  /* NAV TABS */
  nav {
    background: var(--primary);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-tab {
    color: rgba(255,255,255,0.6);
    font-size: 12.5px;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .nav-tab:hover { color: rgba(255,255,255,0.9); }
  .nav-tab.active { color: white; border-bottom-color: var(--gold); font-weight: 500; }

  /* MAIN LAYOUT */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
  }

  /* INTRO BANNER */
  .intro-banner {
    background: white;
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 20px;
  }
  .intro-stat {
    text-align: center;
  }
  .intro-stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1;
  }
  .intro-stat .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .intro-stat + .intro-stat {
    border-left: 1px solid var(--border);
  }

  /* SECTION */
  .section {
    display: none;
  }
  .section.active {
    display: block;
  }

  /* CLAUSE GROUP */
  .clause-group {
    margin-bottom: 12px;
  }
  .clause-header {
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: box-shadow 0.15s;
    user-select: none;
  }
  .clause-header:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .clause-header.expanded {
    border-radius: 6px 6px 0 0;
    border-bottom: 1px solid var(--border);
  }
  .clause-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    min-width: 48px;
  }
  .clause-title {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .clause-badge-wrap {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }
  .badge-iatf {
    background: #FFF3E0;
    color: #BF6000;
    border: 1px solid #F9C36D;
  }
  .badge-9001 {
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid #BDD0EE;
  }
  .badge-cs {
    background: #F3E5F5;
    color: #6A1B9A;
    border: 1px solid #CE93D8;
  }
  .arrow {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .arrow.open { transform: rotate(90deg); }

  /* CLAUSE BODY */
  .clause-body {
    background: white;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    display: none;
  }
  .clause-body.open { display: block; }

  /* SUB-CLAUSE */
  .sub-clause {
    padding: 16px 20px 16px 66px;
    border-bottom: 1px solid #F0EEE8;
  }
  .sub-clause:last-child { border-bottom: none; }
  .sub-clause-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .sub-clause-title {
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .sub-clause-desc {
    font-size: 12.5px;
    color: #3A3830;
    line-height: 1.65;
  }
  .sub-clause-desc ul {
    margin: 6px 0 0 16px;
  }
  .sub-clause-desc ul li {
    margin-bottom: 3px;
    font-size: 12.5px;
  }
  .iatf-note {
    display: inline-block;
    background: #FFF8E1;
    border-left: 3px solid var(--gold);
    color: #7A5800;
    font-size: 11.5px;
    padding: 6px 10px;
    margin-top: 8px;
    border-radius: 0 4px 4px 0;
    line-height: 1.5;
  }
  .iatf-note strong {
    color: #6B4000;
  }

  /* SEARCH HIGHLIGHT */
  mark {
    background: #FFE57A;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    display: none;
  }
  .no-results.show { display: block; }

  /* FOOTER */
  footer {
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 20px 32px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: var(--muted);
  }

  @media (max-width: 768px) {
    .main { padding: 16px; }
    .header-inner { padding: 12px 16px; }
    .nav-inner { padding: 0 16px; }
    #search-input { width: 180px; }
    .intro-banner { grid-template-columns: 1fr 1fr; }
    .sub-clause { padding-left: 20px; }
    footer { padding: 16px; flex-direction: column; gap: 6px; text-align: center; }
  }
</style>
</head>

function renderClauses(filter = "", section = "all") {
  const container = document.getElementById("clauses-container");
  container.innerHTML = "";
  let totalVisible = 0;

  const q = filter.toLowerCase().trim();

  data.forEach(clause => {
    if (section !== "all" && clause.num !== section) return;

    const matchedSubs = clause.subs.filter(sub => {
      if (!q) return true;
      return (
        sub.num.toLowerCase().includes(q) ||
        sub.title.toLowerCase().includes(q) ||
        sub.desc.toLowerCase().includes(q) ||
        sub.items.some(i => i.toLowerCase().includes(q)) ||
        (sub.iatf && sub.iatf.toLowerCase().includes(q))
      );
    });

    if (q && matchedSubs.length === 0) return;
    totalVisible += matchedSubs.length;

    const groupEl = document.createElement("div");
    groupEl.className = "clause-group";

    const headerEl = document.createElement("div");
    headerEl.className = "clause-header";
    headerEl.innerHTML = `
      <span class="clause-num">${clause.num}</span>
      <span class="clause-title">${hl(clause.title, q)}</span>
      <span class="arrow">▶</span>
    `;

    const bodyEl = document.createElement("div");
    bodyEl.className = "clause-body";
    if (!q) {
      // default collapsed except when searching
    } else {
      headerEl.classList.add("expanded");
      bodyEl.classList.add("open");
      headerEl.querySelector(".arrow").classList.add("open");
    }

    headerEl.addEventListener("click", () => {
      const isOpen = bodyEl.classList.toggle("open");
      headerEl.classList.toggle("expanded", isOpen);
      headerEl.querySelector(".arrow").classList.toggle("open", isOpen);
    });

    const subsToShow = q ? matchedSubs : clause.subs;
    subsToShow.forEach(sub => {
      const subEl = document.createElement("div");
      subEl.className = "sub-clause";
      const badges = sub.badges.map(b => {
        if (b === "IATF 추가") return `<span class="badge badge-iatf">IATF 추가</span>`;
        if (b === "ISO 9001") return `<span class="badge badge-9001">ISO 9001</span>`;
        if (b === "고객별") return `<span class="badge badge-cs">CSR</span>`;
        return "";
      }).join(" ");

      let itemsHtml = "";
      if (sub.items.length) {
        itemsHtml = `<ul>${sub.items.map(i => `<li>${hl(i, q)}</li>`).join("")}</ul>`;
      }
      let iatfHtml = "";
      if (sub.iatf) {
        iatfHtml = `<div class="iatf-note"><strong>IATF Note:</strong> ${hl(sub.iatf, q)}</div>`;
      }

      subEl.innerHTML = `
        <div class="sub-clause-num">${sub.num}</div>
        <div class="sub-clause-title">${hl(sub.title, q)} <span style="margin-left:6px">${badges}</span></div>
        <div class="sub-clause-desc">${hl(sub.desc, q)}${itemsHtml}${iatfHtml}</div>
      `;
      bodyEl.appendChild(subEl);
    });

    groupEl.appendChild(headerEl);
    groupEl.appendChild(bodyEl);
    container.appendChild(groupEl);
  });

  const noResults = document.getElementById("no-results");
  if (totalVisible === 0 && q) {
    noResults.classList.add("show");
  } else {
    noResults.classList.remove("show");
  }

  const countEl = document.getElementById("search-count");
  if (q) {
    countEl.textContent = `${totalVisible}건 일치`;
  } else {
    countEl.textContent = "";
  }
}

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return text.replace(re, m => `<mark>${m}</mark>`);
}

let currentSection = "all";

document.getElementById("nav-tabs").querySelectorAll(".nav-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentSection = tab.dataset.section;
    renderClauses(document.getElementById("search-input").value, currentSection);
  });
});

let searchTimeout;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    renderClauses(e.target.value, currentSection);
  }, 200);
});

renderClauses();
</script>
